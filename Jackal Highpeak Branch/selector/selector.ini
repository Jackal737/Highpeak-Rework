[core]
overrideAndReplace: commandCenter
isUnrepairableUnit:true
isPickableStartingUnit:true
name: lohpSelector
tags: center, normalVision, greatEmerald
displayText: Faction Selector
displayDescription: Choose a faction
class: CustomUnitMetadata
price: 0
maxHp: 10000
armour: 10
armourMinDamageToKeep: 0
mass: 3500

techLevel: 1
buildSpeed: 20s
radius: 28
isBio: false
isBug: false
isBuilding:true
fogOfWarSightRange: 18
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 12

footprint: -1,-1,0,0
constructionFootprint: -2,-2,1,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

[arm_1]
x: 0
y: 4
image_end: seed.png
drawOverBody: true

[hiddenAction_aura]
autoTrigger:true
spawnEffects: CUSTOM:aura

[effect_aura]

priority: critical
image: ROOT:\data\images\auraSummon.png
life: 200
fadeOut: true
attachedToUnit: true
scaleFrom: 0.7
scaleTo: 1.3
fadeInTime:20
drawUnderUnits:false
liveAfterAttachedDies: true
xOffsetRelative: 0
yOffsetRelative: 0
dirSpeedRandom:0.15
dirOffsetRandom:360
color:green
alpha:0.6

[effect_auraBirth]
fadeInTime:30
priority: critical
image: ROOT:\data\images\emeraldBirth.png
life: 250
fadeOut: true
attachedToUnit: true
scaleFrom: 1.2
scaleTo: 3
drawUnderUnits:false
liveAfterAttachedDies: true
xOffsetRelative: 0
yOffsetRelative: 0
dirSpeedRandom:0.15
dirOffsetRandom:360
dirSpeed:1
alpha:1
hOffset:4

[animation_birth]
effect_0s:{name:CUSTOM|birth*1}
effect_0.25s:{name:CUSTOM|birth*1}

[effect_birth]
fadeInTime:20
priority: critical
alpha: 0.7
attachedToUnit: true
life: 250
scaleFrom:1
scaleTo: 0.3
image: ROOT:\data\images\emeraldBirth.png
drawUnderUnits:false
hSpeed:0.3
hOffset:4
xSpeedRelativeRandom:0.06
ySpeedRelativeRandom:0.06
dirOffsetRandom:360
dirSpeed:3

[action_human]
isLocked: if self.queueSize(greaterThan=0)
textAddUnitName:highpeakHumanFaction
description: -Generalist faction\n -Powerful ranged units\n -Very mobile, infantry can ride yaks for cheap\n -No magical abilities\n\n ----Racial Mechanics----\n -Farms cannot be harvesed, instead generating a trickle of food based on the number of yaks they have\n -Units can ride these yaks, increasing movespeed and health conciderably.
unitShownInUI:highpeakHumanFaction
spawnUnits: highpeakHumanFaction
deleteSelf:true

whenBuilding_playAnimation:birth
spawnEffects:CUSTOM:auraBirth
buildSpeed: 3s
highPriorityQueue: true
ai_isHighPriority:true

