
[core]
name: highpeakHumanCenter
tags: center, canBurn, building, dropoff
class: CustomUnitMetadata
price: Emerald:750
maxHp: 3000
mass: 9000

displayText: Town hall
displayDescription: "Ain't no town without one of those!"\n\n -Provides 14 lodging\n-Can train carpenters\n -Can garrison carpenters\n-Resource dropoff

borrowResourcesWhileBuilt:lodging=-14

techLevel: 1
buildSpeed: 15s

radius: 60
footprint: -2,-2,2,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

maxTransportingUnits:8
transportUnitsRequireTag:builder
transportUnitsKillOnDeath:false

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:20
exit_moveAwayAmount:40

################################# Rancher Tech #################################

[hiddenAction_rancherTechRecover]
autoTrigger: if self.resource(type='humanBuildingRancher', lessThan=20)
addResources: humanBuildingRancher=1

[hiddenAction_rancherTechTrigger]
requireConditional: if self.resource(type='humanBuildingRancher', equalTo=20)
autoTriggerOnEvent: tookDamage
spawnUnits: highpeakHumanTempRancher*6
addResources: humanBuildingRancher=-20

[canBuild_builder]
name: setRally, highpeakHumanBuilder_1
pos: 2.1
addResources: Lodging=1

[canBuild_hero]
name: highpeakHumanHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2


[graphics]
total_frames: 3
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

[animation_idle]
onActions: idle
KeyframeTimeScale : 0.8
body_0s: {frame:0}
body_0.1s: {frame:0}
body_0.2s: {frame:1}
body_0.3s: {frame:1}
body_0.4s: {frame:2}
body_0.5s: {frame:2}



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.55

noneInBaseExtraPriority: 0.25

maxEachBase: 1

[arm_11]
x: 0.5
y: 2
spinRate:0.25
image_end: needle.png
drawOverBody: true