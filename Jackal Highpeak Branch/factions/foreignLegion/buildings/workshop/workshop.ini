
[core]
name: highpeakForeignLegionWorkshop
tags:canBurn, building
class: CustomUnitMetadata
price: Emerald=1200
maxHp: 2500
mass: 9000

displayText: Bestiary
displayDescription: "Conventional machinery proved... inadequate to travel the great waste."\n\n -Can train skarabai auxilas\n -Additionally provides a slow trickle of Requisition

techLevel: 1
buildSpeed: 20s

radius: 35
footprint: -2,-1,1,1
constructionFootprint: -2,-1,1,2
buildingToFootprintOffsetX:0
