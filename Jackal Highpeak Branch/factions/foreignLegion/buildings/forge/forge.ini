
[core]
name: highpeakForeignLegionForge
tags: highpeakForge, canBurn, canSellTrophy, building, legionForge, dropOff
class: CustomUnitMetadata
price: Emerald=350
maxHp: 2500
mass: 9000

displayText: Depot
displayDescription: "Dvarik logistic surpass all others."\n\n -Can barter resources\n-Can request engineer Qaurus\n-Resource dropoff\n -Additionally provides a slow trickle of Requisition

techLevel: 1
buildSpeed: 15s

radius: 30
footprint: -1,-1,0,0
constructionFootprint: -1,-1,0,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:30

[action_requisition]
iconImage:ROOT:\data\images\requisitionIcon.png
displayType:action
pos:0
text: Requisition
description: Passive\n -Generates 0.1 Requisition points every 10 seconds
buildSpeed: 0s
isVisible: true

[hiddenAction_requisitionTrickle]
autoTrigger: if self.customTimer(laterThanSeconds=10)
addResources: Requisition=0.1
resetCustomTimer: true

[canBuild_builder]
name: setRally
pos: 2.1

[action_request1]
iconImage:ROOT:\data\images\melee.png
displayType: action
price:  Requisition=8, Lodging=1
addResources: Lodging=1
text: Request Echidna
description:-Ship an Echidna Mining Drill from Dvar
buildSpeed: 16s
allowMultipleInQueue: true
pos: 3
produceUnits: highpeakDvarikDrill_1
alsoTriggerAction: Flod1

[action_request2]
iconImage:ROOT:\data\images\melee.png
displayType: action
price:  Requisition=12, Lodging=2
addResources: Lodging=2
text: Request Echidna
description:-Ship a Porcupine Assault Drill from Dvar
buildSpeed: 30s
allowMultipleInQueue: true
pos: 3
produceUnits: highpeakDvarikDrill_2
alsoTriggerAction: Flod2



[hiddenAction_Flod1]
requireConditional: if self.globalTeamTags(includes='flodHelpTech')
produceUnits: highpeakFlodrjinaiInfantry_1

[hiddenAction_Flod2]
requireConditional: if self.globalTeamTags(includes='flodHelpTech')
produceUnits: highpeakFlodrjinaiInfantry_1*2

[action_produceGazul]
ai_isDisabled:true
price: Emerald=1000
addResources: Gazul=550
text: Barter for Gazul
description: -Recieve 550 Gazul for 1000 Emerald
buildSpeed: 10s
pos: 0.1

[action_produceEmerald]
ai_isDisabled:true
price: Gazul=1000
addResources: Emerald=550
text: Barter for emeralds
description: -Recieve 550 Emerald for 1000 Gazul
buildSpeed: 10s
pos: 0.2


[graphics]
total_frames: 1
imageScale: 0.8

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0
shadowOffsetY:1



[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 100
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.6

noneGlobalExtraPriority: 0.2

maxEachBase: 1