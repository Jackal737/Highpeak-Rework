
[core]
name: highpeakTrollBonfire
tags: fireTotem, canBurn, restingPlace, superVision, building
class: CustomUnitMetadata
price: Emerald=850, Gazul=750
maxHp: 1000
mass: 9000

displayText: Bonfire
displayDescription: "Fire is good..."\n\n -Can heal nearby units (Do not stack)\n -Can upgrade Toha Bo into Toha Boda\n -Super vision

techLevel: 1
buildSpeed: 20s

radius: 30
