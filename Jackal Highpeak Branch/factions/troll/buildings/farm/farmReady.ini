
[core]
showInEditor:false
copyFrom:farm.ini
name: highpeakTrollFarmReady
price: localEmerald=3000

resourceRate: 0.002175
similarResourcesHaveTag:emeraldResource
resourceMaxConcurrentReclaimingThis:1
isUnrepairableUnit:true

energyMax: 0

[hiddenAction_emeraldTimer]
autoTrigger: if self.customTimer(laterThanSeconds=9)
alsoTriggerAction: emeraldLvL1
resetCustomTimer:true
[hiddenAction_emeraldLvL1]
addResources: Emerald=5, hp=-1
spawnEffects:CUSTOM:unloadEmerald
alsoTriggerAction: aiBoost

[hiddenAction_aiBoost]
requireConditional: if self.isControlledByAI()
addResourcesScaledByAIHandicaps: Emerald=5


[effect_unloadEmerald]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\emerald10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[ai]
upgradedFrom:highpeakTrollFarm

