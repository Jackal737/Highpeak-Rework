
[core]
copyFrom: ROOT:\data\templates\troll.template
name: highpeakTrollBarricade
tags: canBurn, building
class: CustomUnitMetadata
price: Emerald=350
maxHp: 3000
armour:12
mass: 10000
displayText: Dolmen
displayDescription: "We are like stone..."\n\n -Defensive building\n -Can garrison a troll and be painted with runes

techLevel: 1
buildSpeed: 20s

radius: 20
footprint: 0,0,0,0
constructionFootprint: 0,0,0,0
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

isBuilding: true
isBio: false

maxTransportingUnits:2
transportUnitsRequireTag:monster
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6

[hiddenAction_aiCargo]
autoTriggerOnEvent: completeAndActive
requireConditional: if self.isControlledByAI()
addUnitsIntoTransport: highpeakTrollArcher_1
addResources: Lodging=3

[graphics]
drawLayer:bottom
imageScale: 0.85
total_frames: 1
image:        barricade.png
image_wreak:  NONE
image_back:   back.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 0
turretTurnSpeed: 6
maxAttackRange: 0
shootDelay: 80

[attachment_1]
x: 0
y: 4
height:3
idleDir:0
canBeAttackedAndDamaged:false
keepAliveWhenParentDies:true
setDrawLayerOnTop:true
addTransportedUnits:true
rotateWithParent:true

[movement]
movementType: BUILDING
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
maxTurnSpeed: 0
turnAcceleration: 0

[ai]

buildPriority: 0.30

noneInBaseExtraPriority: 0.1

maxEachBase: 3

[arm_10]
x: 0
y: 0
image_end: ROOT:\data\images\runeLarge.png
drawUnderAllUnits: true
hidden:if not self.tags(includes='rune')
spinRate:0.25
image_end_teamColors:true