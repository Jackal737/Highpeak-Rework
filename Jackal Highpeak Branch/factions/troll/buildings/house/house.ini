
[core]
name: highpeakTrollHouse
tags: building, house
class: CustomUnitMetadata
price: Emerald=350
maxHp: 2000
mass: 9000

displayText: Menhir
displayDescription: "The stone stands... the toha stands..."\n\n -Provides 10 lodging\n -Generates Gazul\n -Can only be built on Gazul veins

techLevel: 1
buildSpeed: 20s

borrowResourcesWhileBuilt:lodging=-10
placeOnlyOnResPool: true

radius: 30

energyMax: 120
energyRegen: 0.02

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:25

[action_lvlUpDisplay]
iconImage:ROOT:\data\images\addon.png
displayType: upgrade
isVisible: true
text: Ages pass
description:Passive\n -Slowly ages, increasing efficiency and lodging
buildSpeed: 0s
pos:1.1

[hiddenAction_create]
autoTriggerOnEvent: created
resourceAmount: energy
resourceAmount_setValue: 0

[hiddenAction_lvlUpTech]
autoTrigger: if self.resource(type='energy',greaterThan=60) and  self.globalTeamTags(includes='trollMenhirTech')
convertTo: highpeakTrollHouse_2
resourceAmount: energy
resourceAmount_setValue: 0

[hiddenAction_lvlUp]
autoTrigger: if self.resource(type='energy',equalTo=120)
convertTo: highpeakTrollHouse_2
resourceAmount: energy
resourceAmount_setValue: 0


[hiddenAction_aiBoost]
autoTrigger: if self.resource(type='Gazul',lessThan=2000)
requireConditional: if self.isControlledByAI()
addResources: Gazul=2

[hiddenAction_gazulTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoTriggerAction: gazulLvL1
resetCustomTimer:true
[hiddenAction_gazulLvL1]
addResourcesScaledByAIHandicaps: Gazul=10
spawnEffects:CUSTOM:produceGazul

[effect_produceGazul]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\gazul10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[graphics]
total_frames: 1
imageScale: 0.7

image:        base.png
image_back:  base.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0
shadowOffsetY:0



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.4

noneGlobalExtraPriority: 0.2