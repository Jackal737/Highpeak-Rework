
[core]
copyFrom:ROOT:\data\templates\unitXp.template
name: highpeakGanjingaMonster_1
tags: bio, monster, normalVision
displayText: Skaale
displayDescription: -Monster\n -Good vs cavalry and monsters\n -Can carry an infantry unit\n -Can move over water\n -Fast
class: CustomUnitMetadata
price: Emerald=250, Gazul=200, Lodging=1
borrowResourcesWhileBuilt:Lodging=1
maxHp: 400
selfRegenRate:0
armour:2
mass: 300
radius: 8
softCollisionOnAll: 6
techLevel: 1
experimental: false
buildSpeed: 20s

maxTransportingUnits:1
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6
transportUnitsRequireTag:infantry

isBio: true
isBug: false
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\deathReptile.ogg:0.1


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[graphics]
imageScale: 1
total_frames: 5

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadowHorseSmall.png
shadowOffsetX:1
shadowOffsetY:2
splastEffect:true


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 4
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 1
animation_attack_end: 4
animation_attack_speed: 5
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]

canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
canAttackUnderwaterUnits: false
isFixedFiring: true
isMelee:true
meleeEngangementDistance:120
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 8
shootDelay: 0.8s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\maceHit.ogg, ROOT:\data\soundFx\maceHit2.ogg
shoot_sound_vol:0.07
recoilOffset:4
recoilOutTime: 15
recoilReturnTime: 18

[projectile_1]
mutatorCavalry_ifUnitWithTags:monster, cavalry
mutatorCavalry_directDamageMultiplier:1.75

directDamage: 35
armourIgnoreAmount:5
life: 10
instant:true
explodeEffect:NONE

[attachment_1]
resetRotationWhenNotAttacking:true
x: 0
y: -1
idleDir:0
height:2
isVisible:true
keepAliveWhenParentDies:true
addTransportedUnits:true
rotateWithParent:true
canBeAttackedAndDamaged:true


[movement]
movementType: HOVER
moveSpeed: 1.2
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: false

maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  180
reverseSpeedPercentage:0

[arm_1]
x: 0
y: 0
image_end: ROOT:\data\images\swim.png
drawOverBody: true
hidden: if not self.isOverLiquid()





