
[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakPlagueOrcMonster_1
tags: monster, bio, normalVision, plagueMutant
displayDescription: -Monster\n -Very well armed and armored \n -Good single target attack\n -Afflicted \n -Ruptures on death \n -Spawn larvas upon death
displayText: Flargger
class: CustomUnitMetadata
price: 0
borrowResourcesWhileBuilt:Lodging=3
maxHp: 1000
selfRegenRate:0
armour:8
mass: 1500
radius: 7
softCollisionOnAll: 7

transportSlotsNeeded:5

techLevel: 1
experimental: false
buildSpeed: 35s

isBio: true
isBug: true
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*9

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.1


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:0.5
scaleTo: 0
xOffsetRelativeRandom:3
yOffsetRelativeRandom:2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\plague.png
drawUnderUnits:false
dirOffsetRandom:360

[action_afflictedInfo]
isGuiBlinking: if self.resource(type='Plague', greaterThan=99)
iconImage:ROOT:\data\images\trophy.png
addResources: Plague=1
price:  Plague=1
text: Afflicted: 
description: -Plague affliction\n -Plague attack\n -A flargpox larva is spawned upon death at level 100
displayType: infoOnly
buildSpeed: 0s
pos: 0
displayRemainingStockpile: true
isActive:false

[action_plague]
iconImage:ROOT:\data\images\fireIcon.png
displayType:action
pos:1
text: Infectious
description: Passive\n -Infect enemies with plague, lowering their max health and infesting them with larvae.
buildSpeed: 0s
isVisible: true

[hiddenAction_afflicted]
autoTriggerOnEvent: created
addResources: Plague=1

[hiddenAction_spawnPlagueOrcLarvas]
autoTriggerOnEvent: destroyed
spawnUnits:highpeakPlagueOrcLarva*2

[hiddenAction_spawnPlagueOrcLarvas2]
requireConditional: if self.globalTeamTags(includes='plagueOrcLarvaTech')
autoTriggerOnEvent: destroyed
spawnUnits:highpeakPlagueOrcLargeLarva

[action_soupFeast]
iconImage:ROOT:\data\images\feast.png
spawnEffectsOnQueue:CUSTOM:orcHowl
isVisible: if numberOfUnitsInTeam(withTag='soup', withinRange=110, greaterThan=0)
convertTo:highpeakPlagueOrcMonster_2
addResources: hp=10000
displayType: upgrade
price:  Soup=275, Gazul=250, lodging=2
text:Feast
description:Feast on soup
buildSpeed: 0s
pos:1

[effect_orcHowl]
alpha:0
alsoEmitEffects: CUSTOM:gunk*5
alsoPlaySound:ROOT:\data\soundFx\deathOrc.ogg:0.05, ROOT:\data\soundFx\deathOrc2.ogg:0.05, ROOT:\data\soundFx\deathOrc3.ogg:0.05

[effect_gunk]
attachedToUnit: false
life: 120
physics: true
scaleFrom:1.1
scaleTo: 0.2
xOffsetRelativeRandom:7
yOffsetRelativeRandom:7
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\gunk.png
drawUnderUnits:false
dirOffsetRandom:360

[graphics]
imageScale: 0.7
total_frames: 6

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadowBig.png
shadowOffsetX:1
shadowOffsetY:3

animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 6
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 4
animation_attack_end: 5
animation_attack_speed: 7
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]

canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
