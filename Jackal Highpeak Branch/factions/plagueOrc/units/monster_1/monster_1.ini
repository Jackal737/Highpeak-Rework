areaRadius=3
armourIgnoreAmount:30
life: 10
instant:true
explodeEffect:CUSTOM:blood*3

mutatorPoison_ifUnitWithTags: bio
mutatorPoison_addResourcesAreaHit: Plague=10

[action_rupture]
iconImage:ROOT:\data\images\splatIcon.png
text: Rupture
description: -Will explode if killed, spreading plague and dealing damage in a small area
