
[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakPlagueOrcMonster_3
tags: monster, bio, normalVision, plagueMutant
displayText: Flargrotter
displayDescription: -Long range monster\n -Area plague and poison attack \n -Good vs infantry\n -Afflicted\n -Spawn larvas upon death
class: CustomUnitMetadata
price: 0
borrowResourcesWhileBuilt:Lodging=3
maxHp: 330
selfRegenRate:0
armour:6
mass: 1500
radius: 9
softCollisionOnAll: 9

transportSlotsNeeded:5

techLevel: 1
experimental: false
buildSpeed: 35s

isBio: true
isBug: true
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*9

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.1

[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:0.5
scaleTo: 0
xOffsetRelativeRandom:3
yOffsetRelativeRandom:2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\plague.png
drawUnderUnits:false
dirOffsetRandom:360

[action_afflictedInfo]
isGuiBlinking: if self.resource(type='Plague', greaterThan=99)
iconImage:ROOT:\data\images\trophy.png
addResources: Plague=1
price:  Plague=1
text: Afflicted: 
description: -Plague affliction\n -Plague attack\n -A flargpox larva is spawned upon death at level 100
displayType: infoOnly
buildSpeed: 0s
pos: 0
displayRemainingStockpile: true
isActive:false

[action_plague]
iconImage:ROOT:\data\images\fireIcon.png
displayType:action
pos:1
text: Infectious
description: Passive\n -Infect enemies with plague, lowering their max health and infesting them with larvae.
buildSpeed: 0s
isVisible: true

[action_poison]
iconImage:ROOT:\data\images\trophy.png
displayType:action
pos:1
text: Poison
description: Passive\n -Poison enemies, dealing damage over time
buildSpeed: 0s
isVisible: true

[hiddenAction_afflicted]
autoTriggerOnEvent: created
addResources: Plague=1

[hiddenAction_spawnPlagueOrcLarvas]
autoTriggerOnEvent: destroyed
spawnUnits:highpeakPlagueOrcLarva*3
[hiddenAction_spawnPlagueOrcLarvas2]
requireConditional: if self.globalTeamTags(includes='plagueOrcLarvaTech')
autoTriggerOnEvent: destroyed
spawnUnits:highpeakPlagueOrcLargeLarva

[graphics]
imageScale: 0.7
total_frames: 6

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadowBig.png
shadowOffsetX:1
shadowOffsetY:3

animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 6
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 3
animation_attack_end: 5
animation_attack_speed: 5
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 250
shootDelay: 2.5s

[turret_1]
x: 0
y: -1
shoot_sound:ROOT:\data\soundFx\spit.ogg
shoot_sound_vol:0.06
recoilOffset:-3
recoilOutTime: 15
recoilReturnTime: 18

[projectile_1]
life: 300
speed: 4
speedSpread:1
frame: 3
drawSize: 0.5
hitSound: true
targetGround:true
targetGroundSpread: 15
targetGround_includeTargetHeight:true
explodeEffect:CUSTOM:particles*4,CUSTOM:sound
deflectionPower: 2
buildingDamageMultiplier: 1.5
areaDamage:45
areaRadius: 35
armourIgnoreAmount: -10
image: ROOT:\data\images\plague.png
initialUnguidedSpeedHeight: 1.4
gravity:0.22
shadowFrame:3
trailEffect:CUSTOM:trail, CUSTOM:particles
trailEffectRate:1

mutatorPoison_ifUnitWithTags: bio
mutatorPoison_addResourcesAreaHit: Plague=25, Poison=15


[effect_particles]
attachedToUnit: false
life: 60
physics: true
scaleFrom:0.4
scaleTo: 0.6
xOffsetRelativeRandom:2
yOffsetRelativeRandom:2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\plague.png
drawUnderUnits:false
dirOffsetRandom:360

[effect_sound]
alsoPlaySound: ROOT:\data\soundFx\splat.ogg:0.1
life:30
attachedToUnit: false
priority: veryhigh
alpha: 0

[effect_trail]
color:#9bb400
createWhenZoomedOut: false
image: ROOT:\data\images\trail.png
life: 30
fadeOut: true
attachedToUnit: false
dirOffsetRandom:360
fadeInTime:1
scaleFrom: 0.5
scaleTo: 0
alpha: 1.5
drawUnderUnits:false


[movement]
movementType: LAND
moveSpeed: 0.45
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: false

maxTurnSpeed: 2.5
turnAcceleration: 0.75

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  180
reverseSpeedPercentage:0





