
[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakPlagueOrcMaggot_1
tags: bio, cavalry, normalVision, plagueMutant
displayText: Flargpox Host
displayDescription: -Long range siege monster \n -Good vs structures and large\n -Spawns larvae\n -Afflicted
class: CustomUnitMetadata
price: Emerald=500, Gazul=250, Lodging=1
borrowResourcesWhileBuilt:Lodging=1
maxHp: 250
selfRegenRate:0
armour:2
mass: 200
radius: 7
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 10s


isBio: true
isBug: true
hideScorchMark: true

effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.05

[action_larva]
iconImage:ROOT:\data\images\addon.png
displayType:action
pos:1
text: Hive
description: Passive\n -Attacks by spawning larvae, which do bonus damage into structures
buildSpeed: 0s
isVisible: true

[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[effect_orcHowl]
alpha:0
alsoEmitEffects: CUSTOM:gunk*5
alsoPlaySound:ROOT:\data\soundFx\deathOrc.ogg:0.05, ROOT:\data\soundFx\deathOrc2.ogg:0.05, ROOT:\data\soundFx\deathOrc3.ogg:0.05

[effect_gunk]
attachedToUnit: false
life: 120
physics: true
scaleFrom:1.1
scaleTo: 0.2
xOffsetRelativeRandom:7
yOffsetRelativeRandom:7
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\gunk.png
drawUnderUnits:false
dirOffsetRandom:360

[action_afflictedInfo]
isGuiBlinking: if self.resource(type='Plague', greaterThan=99)
iconImage:ROOT:\data\images\trophy.png
addResources: Plague=1
price:  Plague=1
text: Afflicted: 
description: -Plague affliction\n -A flargpox larva is spawned upon death at level 100
displayType: infoOnly
buildSpeed: 0s
pos: 0
displayRemainingStockpile: true
isActive:false

[hiddenAction_afflicted]
autoTriggerOnEvent: created
addResources: Plague=1


[hiddenAction_wasps]
autoTrigger:true
spawnEffects:CUSTOM:wasps*2, CUSTOM:wasps2*2


[effect_wasps]
attachedToUnit: true
life: 75
alpha: 1
scaleFrom:0.25
scaleTo: 0.75
dirOffsetRandom:360
dirSpeedRandom:6
xSpeedRelativeRandom: 0.05
ySpeedRelativeRandom: 0.05
hOffset:-2
hSpeed: 0.05
image: wasps.png

[effect_wasps2]
attachedToUnit: false
life: 120
alpha: 1
scaleFrom:0.5
scaleTo: 0.75
dirOffsetRandom:360
dirSpeedRandom:6
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hOffset:-2
hSpeed: 0.05
image: wasps.png

[effect_spit]
createWhenZoomedOut: false
image: ROOT:\data\images\plague.png
life: 50
fadeOut: true
attachedToUnit: false
dirOffsetRandom:75
xOffsetRelativeRandom:1
yOffsetRelativeRandom:3
ySpeedRelativeRandom: 0.5
fadeInTime:2
scaleFrom: 0.8
scaleTo: 1.2
alpha: 0.6
drawUnderUnits:false
physics:false

[effect_spit2]
attachedToUnit: false
life: 120
physics: true
scaleFrom:1.5
scaleTo: 0.2
xOffsetRelativeRandom:3
yOffsetRelativeRandom:3
xSpeedRelativeRandom: 0.4
ySpeedRelativeRandom: 0.8
hSpeed: 1
image: ROOT:\data\images\gunk.png
drawUnderUnits:false
dirOffsetRandom:60

[graphics]
imageScale: 0.85
total_frames: 5

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadowHorse.png
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 5
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 3
animation_attack_end: 4
animation_attack_speed: 7
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 310
shootDelay: 5s

[turret_1]
