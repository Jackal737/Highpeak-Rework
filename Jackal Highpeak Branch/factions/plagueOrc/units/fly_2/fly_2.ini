[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakPlagueOrcFly_2
displayText: Flarg carrier
tags: bio, normalVision, monster, shield, cannotConvert, large, plagueMutant, flargCarrier
displayDescription: -Large, volatile monster\n -Area plague attack\n -Very high plague application\n -Good vs Structures\n -Produce up to 5 larvas over time\n -Larvas are released upon getting attacked\n - Devastating explosion on death\n -Shield\n -Afflicted
class: CustomUnitMetadata
price: Emerald=750, Gazul=450, Lodging=4
borrowResourcesWhileBuilt:Lodging=4
maxHp: 1080
armour: 8
armourMinDamageToKeep: 0
mass: 4000

transportSlotsNeeded:5

techLevel: 1
buildSpeed: 30s
radius: 15
isBio: true
isBug: true
fogOfWarSightRange: 18
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 12

effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

explodeOnDeathGroundCollision:false
effectOnDeathGroundCollision:NONE

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.05

[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:0.5
scaleTo: 0
xOffsetRelativeRandom:3
yOffsetRelativeRandom:2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\plague.png
drawUnderUnits:false
dirOffsetRandom:360

[hiddenAction_LarvaTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoQueueAction: Larva
resetCustomTimer:true
requireConditional: if self.numberOfAttachedUnits(lessThan=5)

[action_Larva]
text:Larva
description: -Spawns up to 5 flarg pox Larvas over time
buildSpeed:9s
attachments_addNewUnits:highpeakPlagueOrcLarva
isActive:false
canPlayerCancel:false
requireConditional: if self.numberOfAttachedUnits(lessThan=5)
displayType:infoOnly
pos: 2

[hiddenAction_LarvaReleaseOn]
autoTrigger: if self.numberOfAttachedUnits(greaterThan=4) and self.hasTakenDamage(withinSeconds=1)
alsoTriggerAction:LarvaRelease
alsoTriggerActionRepeat:5

[hiddenAction_LarvaRelease]
attachments_disconnect:true
spawnEffects: CUSTOM:blood

[action_afflictedInfo]
isGuiBlinking: if self.resource(type='Plague', greaterThan=99)
iconImage:ROOT:\data\images\trophy.png
addResources: Plague=1
price:  Plague=1
text: Afflicted: 
description: -Plague affliction\n -Plague attack\n -A flargpox larva is spawned upon death at level 100
displayType: infoOnly
buildSpeed: 0s
pos: 0
displayRemainingStockpile: true
isActive:false

[hiddenAction_afflicted]
autoTriggerOnEvent: created
addResources: Plague=1

[action_shield]
iconImage:ROOT:\data\images\shield.png
displayType:action
pos:1
text: Shield
description: Passive\n -This unit is resistant to small projectiles
buildSpeed: 0s
isVisible: true

[action_plague]
iconImage:ROOT:\data\images\fireIcon.png
