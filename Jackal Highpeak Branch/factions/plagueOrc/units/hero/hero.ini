
[core]
copyFrom: ROOT:\data\templates\unitXp.template, ROOT:\data\templates\drowning.template, ROOT:\data\templates\unitInventory.template, ROOT:\data\templates\hero.template
name: highpeakPlagueOrcHero
tags: bio, infantry, normalVision, hero, cannotConvert, plagueMutant, chef
displayText: Ravener
displayDescription: -Explorer\n -Good vs neutrals\n -Can gather treasures\n -Afflicted\n -Can level up\n -Can be resurected at the feast hall
class: CustomUnitMetadata
price: Emerald=450
maxHp: 600
selfRegenRate:0
armour:0
mass: 300
radius: 7
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 30s

isBio: true
isBug: false
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\deathOrc.ogg:0.05, ROOT:\data\soundFx\deathOrc2.ogg:0.05, ROOT:\data\soundFx\deathOrc3.ogg:0.05

[hiddenAction_birth]
autoTriggerOnEvent:completeAndActive
spawnEffects:CUSTOM:birth

[effect_birth]
fadeInTime:10
attachedToUnit: true
life: 60
alpha: 2
scaleFrom:1.4
scaleTo: 0.2
hSpeed: 0.4
image: ROOT:\data\images\birth.png
priority: high
drawUnderUnits:false


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[action_afflictedInfo]
isGuiBlinking: if self.resource(type='Plague', greaterThan=99)
iconImage:ROOT:\data\images\trophy.png
addResources: Plague=1
price:  Plague=1
text: Afflicted: 
description: -Plague affliction\n -A flargpox larva is spawned upon death at level 100
displayType: infoOnly
buildSpeed: 0s
pos: 0
displayRemainingStockpile: true
isActive:false

[hiddenAction_afflicted]
autoTriggerOnEvent: created
addResources: Plague=1

[graphics]
imageScale: 0.95
total_frames: 6
showEnergyBar:false
image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadow.png
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 5
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 4
animation_attack_end: 5
animation_attack_speed: 6
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]

canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
