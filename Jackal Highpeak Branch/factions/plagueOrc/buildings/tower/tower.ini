
[core]
name: highpeakPlagueOrcTower
tags: highpeakTower, canBurn, normalVision, building, plagueOrcBuilding
class: CustomUnitMetadata
price: Emerald=500
maxHp: 1500
mass: 9000

displayText: Foul Tower
displayDescription: "Try catch us up' here!"\n\n -Defensive building\n -Good vs infantry\n -Can garrison infantry\n -Spawns flargpox larvas when destroyed

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,0,0
constructionFootprint: -2,-2,1,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5
exit_x:-12

maxTransportingUnits:3
transportUnitsRequireTag:infantry
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6

[hiddenAction_spawnLarvas]
autoTriggerOnEvent: destroyed
spawnUnits:highpeakPlagueOrcLarva*6


[graphics]
total_frames: 1
imageScale: 0.7

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

[action_plague]
iconImage:ROOT:\data\images\fireIcon.png
displayType:action
pos:1
text: Infectious
description: Passive\n -Infect enemies with plague, lowering their max health and infesting them with larvae.
buildSpeed: 0s
isVisible: true

[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretMultiTargeting:true
turretSize: 8
turretTurnSpeed: 20

maxAttackRange: 300
shootDelay: 2s

[turret_1]
x: 0
y: 22
shoot_sound:ROOT:\data\soundFx\buzz.ogg
shoot_sound_vol:0.05
recoilOffset:-3
recoilOutTime: 15
recoilReturnTime: 18
projectile:1

[turret_2]
x: -4
y: 16
warmup:4
copyFrom:1
canAttackCondition:if self.isControlledByAI() or self.transportingCount(greaterThan=0)
limitingRange:175

[turret_3]
x: 4
y: 16
warmup:9
copyFrom:1
canAttackCondition:if self.isControlledByAI() or self.transportingCount(greaterThan=1)
limitingRange:175

[projectile_1]
mutatorShield_ifUnitWithTags:shield
mutatorShield_areaDamageMultiplier:0.5

mutatorPlate_ifUnitWithTags:plate
mutatorPlate_areaDamageMultiplier:0.25

areaDamage:30
areaRadius:3
areaRadiusFromEdge:true
areaDamageNoFalloff:true

life: 160
speed: 1.5
image: wasps.png
explodeEffect: CUSTOM:sparks*3
buildingDamageMultiplier: 0.1
drawSize:0.7
gravity:0.18
shadowFrame:11
trailEffect:CUSTOM:trail
trailEffectRate:1

wobbleFrequency:1s
wobbleAmplitude:1

mutatorPoison_ifUnitWithTags: bio
mutatorPoison_addResourcesAreaHit: Plague=10

[effect_Sparks]
attachedToUnit: false
life: 130
alpha: 1
scaleFrom:0.5
scaleTo: 1
dirOffsetRandom:360
dirSpeedRandom:6
xSpeedRelativeRandom: 0.05
ySpeedRelativeRandom: 0.05
hOffset:10
hSpeed: 0.05
image: wasps.png

[effect_trail]
createWhenZoomedOut: false
image: wasps.png
life: 45
fadeOut: true
attachedToUnit: false
dirOffsetRandom:360
fadeInTime:2
scaleFrom: 0.5
scaleTo: 1
alpha: 1
dirSpeedRandom:2
drawUnderUnits:false


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.28

noneInBaseExtraPriority: 0.1

maxEachBase: 2

