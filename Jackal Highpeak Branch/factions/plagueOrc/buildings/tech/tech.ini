yOffsetRelativeRandom:5
attachedToUnit: false
life: 400
alpha: 0.3
scaleFrom:1
scaleTo: 2
#physics: true
xSpeedRelativeRandom: 0.07
ySpeedRelativeRandom: 0.07
hSpeed: 0.1
hOffset:10
image: ROOT:\data\images\sick.png
priority: low
drawUnderUnits:false
atmospheric:true
fadeInTime:40

[graphics]
total_frames: 1
imageScale: 0.8

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

