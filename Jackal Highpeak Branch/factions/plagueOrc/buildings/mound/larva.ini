[hiddenAction_spreadTheDisease]

autoTrigger: true
addWaypoint_type:Attack
addWaypoint_target_randomUnit_tagged:corpse
addWaypoint_target_randomUnit_maxRange: 75

[action_plague]
iconImage:ROOT:\data\images\fireIcon.png
displayType:action
pos:1
text: Infectious
description: Passive\n -Infect enemies with plague, lowering their max health and infesting them with larvae.
buildSpeed: 0s
isVisible: true

[hiddenAction_expiration]
