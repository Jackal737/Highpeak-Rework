
[core]
name: highpeakPlagueOrcCenter
tags: center, canBurn, building, dropoff, plagueOrcBuilding
class: CustomUnitMetadata
price: Emerald:750
maxHp: 3000
mass: 9000

displayText: Feast hall
displayDescription: "We bring all duh loot here and feast after duh hunt..."\n\n -Provides 12 lodging\n-Can train peons and up to 6 chef\n -Can garrison peons\n-Resource dropoff\n -Spawns flargpox larvas when destroyed

borrowResourcesWhileBuilt:lodging=-12

techLevel: 1
buildSpeed: 15s

radius: 60
footprint: -2,-2,2,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

maxTransportingUnits:8
transportUnitsRequireTag:builder
transportUnitsKillOnDeath:false

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:20
exit_moveAwayAmount:40

[canBuild_builder]
name: setRally, highpeakPlagueOrcBuilder_1
pos: 2.2
addResources: Lodging=1

[canBuild_chef]
name:highpeakPlagueOrcChef_1
isLocked: if numberOfUnitsInTeam(withTag='chef', greaterThan=4, factoryQueue=true)
addResources: Lodging=1
pos: 2.1

[canBuild_hero]
name: highpeakPlagueOrcHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2

[hiddenAction_spawnLarvas]
autoTriggerOnEvent: destroyed
spawnUnits:highpeakPlagueOrcLarva*3

[graphics]
total_frames: 1
imageScale: 0.8

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.55

noneInBaseExtraPriority: 0.25

maxEachBase: 1