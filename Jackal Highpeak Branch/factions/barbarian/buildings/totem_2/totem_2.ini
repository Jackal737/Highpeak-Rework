
[core]
name: highpeakBarbarianTotem_2
tags: guardianTotem, canBurn, building, totem
class: CustomUnitMetadata
price: Emerald=750
maxHp: 1500
mass: 9000

displayText: Guardian totem
displayDescription: "Home of the bear and stag spirits."\n\n -Offer upgrades to nearby trophy-holding units

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: 0,0,0,0
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:7

isBuilding: true
isBio: false
numBitsOnDeath: 5
exit_x:-12


[graphics]
total_frames: 1
imageScale: 0.76

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:1

[action_trophyInfo]
iconImage:ROOT:\data\images\trophy.png
displayType:action
pos:0
isGuiBlinking:if self.resource(type='localTrophy', greaterThan=0)
text: Trophy: %{self.resource.localTrophy}
buildSpeed: 0s
isVisible: true

[resource_localTrophy]
displayName: totemTrophy
hidden: true

[action_takeTrophy]
iconImage:ROOT:\data\images\buy.png
text:Gather Trophy
description:Gather trophies from nearby units, storing them for later use.
buildSpeed:0s
takeResources: trophy=100
takeResources_excludeUnitsWithoutAllResources: false
takeResources_includeUnitsWithinRange: 110
takeResources_includeUnitsWithinRange_team: own
takeResources_directTransferStoppingAtZero: true
takeResources_triggerActionIfAnyCollected: takeTrophy

[hiddenAction_convertTrophy]
autoTrigger: if self.resource(type='trophy', greaterThan=0)
convertResource_from: trophy
convertResource_to: localTrophy
convertResource_maxAmount: 1

[action_trial]
isVisible: true
iconImage:ROOT:\data\images\trophyMarker.png
spawnUnits: highpeakBarbarianUndead_1(offsetRandomX=110, offsetRandomY=110)
displayType: action
price: emerald=400
text:Blood Trial
description:Summon hostile undead to hone your troops skills
allowMultipleInQueue: false
buildSpeed: 1s
pos:1
alsoTriggerAction:trial1
addActionCooldownTime: 25s
spawnEffectsOnQueue:CUSTOM:upgrade
spawnEffects:CUSTOM:upgrade2

[hiddenAction_trial1]
spawnUnits: highpeakBarbarianUndead_1(offsetRandomX=109, offsetRandomY=109)
buildSpeed: 4s
pos:1
alsoTriggerAction:trial2


[hiddenAction_trial2]
spawnUnits: highpeakBarbarianUndead_1(offsetRandomX=108, offsetRandomY=108)
buildSpeed: 4s
pos:1
alsoTriggerAction:trial3

[hiddenAction_trial3]
spawnUnits: highpeakBarbarianUndead_1(offsetRandomX=107, offsetRandomY=107) 
buildSpeed: 4s
pos:1
alsoTriggerAction:trial4

[hiddenAction_trial4]
spawnUnits: highpeakBarbarianUndead_1(offsetRandomX=106, offsetRandomY=106)
buildSpeed: 4s
pos:1

[effect_upgrade]
fadeInTime:50
alwayStartDirAtZero:true
attachedToUnit: true
life: 70
alpha: 1
image: ROOT:\data\images\upgrade.png
priority: high
drawUnderUnits:true
scaleFrom:2
scaleTo: 0.75

[effect_upgrade2]
fadeOut: true
alwayStartDirAtZero:true
attachedToUnit: true
life: 25
alpha: 1
image: ROOT:\data\images\upgrade.png
priority: high
drawUnderUnits:true
scaleFrom:0.75
scaleTo: 4

[attack]

canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 8
turretTurnSpeed: 20

maxAttackRange: 110
shootDelay: 1s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.40

noneInBaseExtraPriority: 0.1

maxEachBase: 1

