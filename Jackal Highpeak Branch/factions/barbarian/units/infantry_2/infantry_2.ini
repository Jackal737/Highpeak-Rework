
[core]
copyFrom:ROOT:\factions\barbarian\units\totemOffering.template, ROOT:\data\templates\unitXp.template, ROOT:\data\templates\drowning.template, ROOT:\data\templates\unitInventory.template
showInEditor:false
name: highpeakBarbarianInfantry_2
tags: bio, infantry, elite, normalVision
displayText: Eagle Warrior
displayDescription: -Elite melee infantry\n -Well armed and armored\n -Good vs armour\n -Can cross cliffs\n -Can summon totemic beasts
class: CustomUnitMetadata
price: 0
borrowResourcesWhileBuilt:Lodging=1
maxHp: 525
selfRegenRate:0
armour:7
mass: 300
radius: 6
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 0s

energyMax:100
energyRegen:0

autoTriggerCooldownTime:0.1s

isBio: true
isBug: false
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

[hiddenAction_regenBio]
addResources: hp=${core.maxHp*0.00015}
[hiddenAction_hungryBio]
addResources: hp=-${core.maxHp*0.001}
[hiddenAction_heroRegen]
addResources: hp=${core.maxHp*0.00025}
[hiddenAction_restRegen]
addResources: hp=${core.maxHp*0.0015}
[hiddenAction_healingBreezeRegen]
addResources: hp=${core.maxHp*0.0035}
[hiddenAction_coldBio]
addResources: hp=-${core.maxHp*0.001}
[hiddenAction_poisonDamage]
addResources: hp=-${ core.maxHp * 0.0015 }, Poison=-0.1
[hiddenAction_acidDamage]
addResources: hp=-${ core.maxHp * 0.002 }, Acid=-0.1
[hiddenAction_curseDamage]
setUnitStats: maxHp-=${ core.maxHp * 0.0025 }, hp-=${ core.maxHp * 0.0025 }
addResources: Curse=-0.1
[hiddenAction_freezingDamage]
addResources: Freezing=-0.1, hp=-0.2
[hiddenAction_plagueGrowing]
addResources: Plague=0.05
[hiddenAction_infectuousInfection]
addResources: Plague=0.1
[hiddenAction_plagueDamage]
addResources: hp=-${ core.maxHp * 0.002 }


[effect_hpRegen]
spawnChance:0.1
[effect_hpDegen]
spawnChance:0.1
[effect_poisoned]
spawnChance:0.1
[effect_cursed]
spawnChance:0.1
[effect_effectFreezing]
spawnChance:0.1
[effect_sick]
spawnChance:0.1
[effect_plagued]
spawnChance:0.1

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\deathBar1.ogg:0.1, ROOT:\data\soundFx\deathBar2.ogg:0.1, ROOT:\data\soundFx\deathBar3.ogg:0.1, ROOT:\data\soundFx\deathBar4.ogg:0.1


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[action_jumpInfo]
iconImage:ROOT:\data\images\jump.png
displayType:action
pos:0.1
isGuiBlinking:if self.isEnergyFull()
text: Eagle flight
description: Passive\n -Jump at the target pushing back all enemies upon landing\n-Gain momentum when moving
buildSpeed: 0s
isVisible: true

[hiddenAction_ready]
autoTrigger: if self.isEnergyFull()
convertTo: highpeakBarbarianInfantry_2_ready

[action_momentum]
price:  0
autoTrigger:if self.isMoving() and  not self.isEnergyFull()
text: momentum
displayType: building
buildSpeed: 1s
pos: 0
addResources: energy=1

isVisible:false

[hiddenAction_takeTrophy]
autoTriggerOnEvent: killedAnyUnit
requireConditional:if self.resource(type='Trophy', lessThan=1)
addResources: Trophy=1

[hiddenAction_sendTrophy]
autoTriggerOnEvent: killedAnyUnit
requireConditional:if self.resource(type='Trophy', greaterThan=0)
sendMessageTo: unitref nearestUnit(relation='own', withinRange=150, withTag	='hero')
sendMessageWithTags:trophyOverflow

[action_trophyInfo]
iconImage:ROOT:\data\images\trophy.png
displayType:action
pos:0
isGuiBlinking:if self.resource(type='Trophy', greaterThan=0)
text: Trophy: %{self.resource.trophy}/1
description: Passive\n -Collect a trophy to offer the spirits
buildSpeed: 0s
isVisible: true

[resource_localTrophy]
displayName: totemTrophy
hidden: true

[action_takeLocalTrophy]
isVisible: if numberOfUnitsInTeam(withTag='totem', withinRange=110, greaterThan=0) and self.resource(type='Trophy', lessThan=1)
iconImage:ROOT:\data\images\buy.png
text:Collect Trophy
description:Collect a trophy from a nearby totem
buildSpeed:0s
takeResources: localTrophy=1
takeResources_excludeUnitsWithoutAllResources: false
takeResources_includeUnitsWithinRange: 110
takeResources_includeUnitsWithinRange_team: own
takeResources_directTransferStoppingAtZero: true

[hiddenAction_convertTrophy]
autoTrigger: if self.resource(type='localTrophy', greaterThan=0)
convertResource_from: localTrophy
convertResource_to: trophy
convertResource_maxAmount: 1

[action_summonEagle]
alsoTriggerAction:resetTrophyValue
isVisible: if (numberOfUnitsInTeam(withTag='hunterTotem', withinRange=110, greaterThan=0) or self.numberOfUnitsInAllyNotOwnTeam(withTag='hunterTotem', withinRange=110, greaterThan=0)) or self.isControlledByAI()
unitShownInUI:highpeakBarbarianEagle
spawnUnits:highpeakBarbarianEagle
displayType: upgrade
price:  trophy=1, Gazul=125, Lodging=1
addResources: Lodging=1
text: Summon the eagle spirit
description:-Use your trophy to honor this spirit\n -Spawn a totemic beast
buildSpeed: 0s
pos:1


[graphics]
imageScale: 0.8
total_frames: 6

showEnergyBar:false

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadow.png
shadowOffsetX:2
shadowOffsetY:3


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 4
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 4
animation_attack_end: 5
animation_attack_speed: 6
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]
aimOffsetSpread:0
canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
canAttackUnderwaterUnits: false
isFixedFiring: true
isMelee:true
meleeEngangementDistance:90
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 8
shootDelay: 0.5s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\axeHit.ogg, ROOT:\data\soundFx\axeHit2.ogg, ROOT:\data\soundFx\axeHit3.ogg
shoot_sound_vol:0.07
recoilOffset:3
recoilOutTime: 15
recoilReturnTime: 18
projectile:1

[projectile_1]
directDamage: 20
armourIgnoreAmount:12
life: 10
instant:true
explodeEffect:NONE

[hiddenAction_jump2]
autoTrigger: if self.isAtGroundHeight() and self.hasFlag(id=0)
addResources: unsetFlag=0
fireTurretXAtGround: Land
fireTurretXAtGround_withOffset: 0,-20

[turret_Land]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\axeHit.ogg, ROOT:\data\soundFx\axeHit2.ogg, ROOT:\data\soundFx\axeHit3.ogg
shoot_sound_vol:0.07
recoilOffset:3
recoilOutTime: 15
recoilReturnTime: 18
onShoot_triggerActions: jump2
projectile: Land
canShoot: false

[projectile_Land]
areaDamage: 30
areaDamageNoFalloff:true
areaRadius:30
targetGround:true
armourIgnoreAmount:0
life: 10
speed:12
explodeEffect:shockwave

pushForce:30
pushVelocity:0.6


[movement]
movementType: OVER_CLIFF
moveSpeed: 1
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: false

landOnGround:true

maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode :true
moveIgnoringBody:false
moveSlidingDir:  180
reverseSpeedPercentage:0



