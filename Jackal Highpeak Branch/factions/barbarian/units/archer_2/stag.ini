
[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakBarbarianStag
tags: bio, monster, normalVision
displayText: Great Stag
displayDescription: -Beast\n -Good vs infantry\n -Can carry an infantry unit\n -Can cross cliffs\n -Very fast
class: CustomUnitMetadata
price: 0
borrowResourcesWhileBuilt:Lodging=1
maxHp: 525
selfRegenRate:0
armour:4
mass: 500
radius: 10
