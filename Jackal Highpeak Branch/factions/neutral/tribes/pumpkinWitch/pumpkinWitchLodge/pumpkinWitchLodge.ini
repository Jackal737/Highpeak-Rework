
[core]
showInEditor:false
name: highpeakNeutralPumpkinWitchLodge
tags: pumpkinKinCamp, canBurn, neutralTribe, building, pumpkinSoup
class: CustomUnitMetadata
price: 0
maxHp: 2000
mass: 9000

displayText: Pumpkin lodge
displayDescription: -One of the many residences of the infamous Pumpkin witch\n -Can recruit up to 13 pumpkin kins\n -Orcs can recruit pumpkin kins by feasting on pumpkin soup\n -Produces soup over time (Orcs only)\n -Can be taken over

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

isBuilding: true
isBio: true
numBitsOnDeath: 5
hideScorchMark: true
exit_y:30

unitsSpawnedOnDeath:highpeakNeutralPumpkinWitchLodge
unitsSpawnedOnDeath_setToTeamOfLastAttacker:true

[hiddenAction_kms]
autoTrigger: true
requireConditional: if self.numberOfUnitsInAllTeams(withTag='managerResources', withinRange=100, greaterThan=0)
deleteSelf: true

[hiddenAction_soupTimer]
autoTrigger: if self.customTimer(laterThanSeconds=6) and self.globalTeamTags(includes='factionOrc')
alsoTriggerAction: soupLvL1
resetCustomTimer:true
[hiddenAction_soupLvL1]
addResourcesScaledByAIHandicaps: Soup=1
spawnEffects:CUSTOM:produceSoup

[effect_produceSoup]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\soup10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[hiddenAction_smoke]
autoTrigger:true
spawnEffects:CUSTOM:smoke*3

[effect_smoke]
xOffsetRelative:0
yOffsetRelative:38
attachedToUnit: false
life: 400
alpha: 0.3
scaleFrom:0.5
scaleTo: 2
#physics: true
xSpeedRelativeRandom: 0.07
ySpeedRelativeRandom: 0.07
hSpeed: 0.1
image: ROOT:\data\images\smoke.png
priority: low
drawUnderUnits:false
atmospheric:true
fadeInTime:40

[hiddenAction_taken]
autoTriggerOnEvent:completeAndActive
showMessageToPlayer: Pumpkin witch: Alright sugar, you can stop wiggling that big sword around... Pray tell what is thine wish?

[hiddenAction_lost]
autoTrigger:if numberOfUnitsInTeam(withTag='faction', lessThan=1)
spawnUnits:highpeakNeutralPumpkinWitchLodgeNeutral
alsoTriggerAction:delete
[hiddenAction_delete]
deleteSelf:true

[canBuild_Warrior]
name:setRally, highpeakNeutralPumpkinKin
isLocked: if numberOfUnitsInTeam(withTag='pumpkinKin', greaterThan=12, factoryQueue=true) or self.isControlledByAi
pos: 1

[graphics]
total_frames: 1
imageScale: 0.7
image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: shadow.png
shadowOffsetX:0
shadowOffsetY:0



[attack]

canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 8
turretTurnSpeed: 20

maxAttackRange: 110
shootDelay: 1s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1

