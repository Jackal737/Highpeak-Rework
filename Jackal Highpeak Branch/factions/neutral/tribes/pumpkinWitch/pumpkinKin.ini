
[core]
copyFrom:ROOT:\data\templates\unitXp.template, ROOT:\data\templates\drowning.template, ROOT:\data\templates\unitInventory.template
name: highpeakNeutralPumpkinKin
tags: magical, monster, pumpkinKin, normalVision
displayText: Pumpkin kin
displayDescription: -Magical monster\n -Well armed\n -Area attack\n -Good vs infantry\n -Poison
class: CustomUnitMetadata
price: Emerald=200, Gazul=125
maxHp: 275
selfRegenRate:0
armour:-1
mass: 175
radius: 7
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 20s

isBio: true
isBug: false
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*9

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.1


[effect_blood]
attachedToUnit: false
life: 120
physics: true
scaleFrom:1
scaleTo: 0.2
xOffsetRelativeRandom:5
yOffsetRelativeRandom:5
xSpeedRelativeRandom: 0.4
ySpeedRelativeRandom: 0.4
hSpeed: 1
image: ROOT:\data\images\gunk.png
drawUnderUnits:false
dirOffsetRandom:360

[action_poison]
iconImage:ROOT:\data\images\trophy.png
displayType:action
pos:1
text: Poison
description: Passive\n -Poison enemies, dealing damage over time
buildSpeed: 0s
isVisible: true

[hiddenAction_guardians]

autoTriggerOnEvent: completeAndActive
temporarilyAddTags: neutral
requireConditional: if self.hasFlag(id=1)
addWaypoint_type:guard
addWaypoint_target_nearestUnit_tagged: pumpkinKinCamp
addWaypoint_target_nearestUnit_team: own

[hiddenAction_deleteGuardians]
autoTriggerOnEvent: completeAndActive
requireConditional: if not numberOfUnitsInTeam(withTag='pumpkinKinCamp', withinRange=500,greaterThan=0) and self.hasFlag(id=1)
deleteSelf:true

[hiddenAction_GuardiansWander]
autoTrigger: if self.customTimer(laterThanSeconds=3)
requireConditional: if self.hasFlag(id=1)
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_position_randomOffsetFromSelf: 15,15
addWaypoint_maxTime: 15s
resetCustomTimer:true


[graphics]
imageScale: 0.75
total_frames: 10

movementEffect:CUSTOM:blood*3
movementEffectRate:30

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadowBig.png
shadowOffsetX:1
shadowOffsetY:2


animation_moving_start: 5
animation_moving_end: 7
animation_moving_speed: 5
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 4
animation_idle_speed: 6
animation_idle_scale_start:1.0
animation_idle_scale_end:1.012
animation_idle_pingPong: true

animation_attack_start: 7
animation_attack_end: 9
animation_attack_speed: 5
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]

canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
canAttackUnderwaterUnits: false
isFixedFiring: true
isMelee:true
meleeEngangementDistance:120
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 9
shootDelay: 1s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\maceHit.ogg, ROOT:\data\soundFx\maceHit2.ogg, ROOT:\data\soundFx\axeHit3.ogg
shoot_sound_vol:0.06
recoilOffset:5
recoilOutTime: 15
recoilReturnTime: 18

[projectile_1]
areaDamage: 28
areaRadius:24
armourIgnoreAmount:0
life: 10
instant:true
explodeEffect:CUSTOM:blood*3

mutatorPoison_ifUnitWithTags: bio
mutatorPoison_addResourcesAreaHit: Poison=5


[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: false

maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  180
reverseSpeedPercentage:0



