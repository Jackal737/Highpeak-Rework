
[core]
copyFrom:dryadBonfire.ini
showInEditor:true
name: highpeakNeutralDryadBonfireNeutral
tags: dryadCamp, neutralBuilding, canBurn, building
createOnAggressiveTeam:true

[hiddenAction_farAway]
autoTriggerOnEvent: completeAndActive
requireConditional: if numberOfUnitsInEnemyTeam(withTag='center', withinRange=700,greaterThan=0)
deleteSelf:true

[hiddenAction_spreaded]
autoTriggerOnEvent: completeAndActive
requireConditional: if numberOfUnitsInTeam(withTag='neutralBuilding', withinRange=250,greaterThan=1)
deleteSelf:true


[hiddenAction_dryad]
autoTrigger:if numberOfUnitsInTeam(withTag='dryad', withinRange=450, lessThan=5) and self.customTimer(laterThanSeconds=15)
spawnUnits:highpeakNeutralDryad_1(addResources= setFlag:1, offsetY=30, offsetDir=0)
resetCustomTimer:true

[hiddenAction_lost]
autoTrigger:false

[hiddenAction_kms]
autoTrigger: true
requireConditional: if self.numberOfUnitsInAllTeams(withTag='managerResources', withinRange=100, greaterThan=0)
deleteSelf: true

[canBuild_Warrior]
name:NONE
isLocked: IGNORE
pos: IGNORE

