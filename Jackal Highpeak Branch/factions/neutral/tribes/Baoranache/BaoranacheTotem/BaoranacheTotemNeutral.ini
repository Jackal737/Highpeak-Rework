
[core]
copyFrom:baoranacheTotem.ini
showInEditor:true
name: highpeakNeutralBaoranacheTotemNeutral
tags: baoranacheCamp, neutralBuilding, canBurn, building
createOnAggressiveTeam:true

[hiddenAction_farAway]
autoTriggerOnEvent: completeAndActive
requireConditional: if numberOfUnitsInEnemyTeam(withTag='center', withinRange=1000,greaterThan=0)
deleteSelf:true

[hiddenAction_spreaded]
autoTriggerOnEvent: completeAndActive
requireConditional: if numberOfUnitsInTeam(withTag='neutralBuilding', withinRange=250,greaterThan=1)
deleteSelf:true


[hiddenAction_baoranache]
autoTrigger:if numberOfUnitsInTeam(withTag='baoranache', withinRange=450, lessThan=2) and self.customTimer(laterThanSeconds=30)
spawnUnits:highpeakNeutralBaoranache(addResources= setFlag:1, offsetY=30, offsetDir=0)
resetCustomTimer:true

[hiddenAction_kms]
autoTrigger: true
requireConditional: if self.numberOfUnitsInAllTeams(withTag='managerResources', withinRange=100, greaterThan=0)
deleteSelf: true

[hiddenAction_lost]
autoTrigger:false

[canBuild_Warrior]
name:NONE
isLocked: IGNORE
pos: IGNORE

