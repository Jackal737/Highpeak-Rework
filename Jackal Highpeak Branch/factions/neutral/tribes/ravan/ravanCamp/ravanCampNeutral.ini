
[core]
copyFrom:ravanCamp.ini
showInEditor:true
name: highpeakNeutralRavanCampNeutral
tags: ravanCamp, neutralBuilding, canBurn, building
createOnAggressiveTeam:true

[hiddenAction_emeraldTimer]
autoTrigger: false

[hiddenAction_farAway]
autoTriggerOnEvent: completeAndActive
requireConditional: if numberOfUnitsInEnemyTeam(withTag='center', withinRange=700,greaterThan=0)
deleteSelf:true

[hiddenAction_kms]
autoTrigger: true
requireConditional: if self.numberOfUnitsInAllTeams(withTag='managerResources', withinRange=100, greaterThan=0)
deleteSelf: true

[hiddenAction_spreaded]
autoTriggerOnEvent: completeAndActive
requireConditional: if numberOfUnitsInTeam(withTag='neutralBuilding', withinRange=250,greaterThan=1)
deleteSelf:true


[hiddenAction_ravan]
autoTrigger:if numberOfUnitsInTeam(withTag='ravan', withinRange=450, lessThan=3) and self.customTimer(laterThanSeconds=20)
spawnUnits:highpeakNeutralRavan(addResources= setFlag:1, offsetY=30, offsetDir=0)
resetCustomTimer:true

[hiddenAction_lost]
autoTrigger:false

[canBuild_Warrior]
name:NONE
isLocked: IGNORE
pos: IGNORE

