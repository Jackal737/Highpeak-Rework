
[core]
copyFrom:ROOT:\data\templates\builderEffect.template
name: highpeakFlodrjinaiMine
tags:highpeakMine, canBurn, canSellTrophy, building, kuluj
class: CustomUnitMetadata
price: Emerald=400
maxHp: 2200
mass: 9000

displayText: Skarabai kuluj
displayDescription: "This gazul rich oasis is perfect to set up camp and rest our weary skarabai."\n\n -Generates Gazul and coins\n -Can train scarabs\n -Can only be built on Gazul veins\n -Can upgrade\n -Can Barter resources


techLevel: 1
buildSpeed: 20s

placeOnlyOnResPool: true

radius: 16

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:35

################################# Resources #################################

[action_produceGazul]
ai_isDisabled:true
price: Emerald=1000
addResources: Gazul=550
text: Barter for Gazul
description: -Recieve 550 Gazul for 1000 Emerald
buildSpeed: 10s
pos: 0.1

[action_produceEmerald]
ai_isDisabled:true
price: Gazul=1000
addResources: Emerald=550
text: Barter for emeralds
description: -Recieve 550 Emerald for 1000 Gazul
buildSpeed: 10s
pos: 0.2

[hiddenAction_gazulTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoTriggerAction: gazulLvL1
resetCustomTimer:true
[hiddenAction_gazulLvL1]
addResourcesScaledByAIHandicaps: Gazul=10, Coins=2
spawnEffects:CUSTOM:produceGazul

[effect_produceGazul]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\gazul10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

################################# Abilities #################################

[action_rest]
iconImage:ROOT:\data\images\healingBreeze.png
displayType:action
pos:1
text: Rest
description: Passive\n -Increase nearby ally units hp regeneration(Do not stack)
buildSpeed: 0s
isVisible: if self.hasFlag(id=1)

################################# Training #################################

[action_upgrade]
pos:1.1
text:Upgrade oasis
description: -Unlock advanced scarabs\n -Adds a resting effect that heals nearby units  when food is available
displayType:upgrade
price:Emerald=1000
isActive:if not self.hasFlag(id=1)
isVisible:if not self.hasFlag(id=1)
allowMultipleInQueue:false
buildSpeed:32s
addResources: setFlag=1
temporarilyAddTags:restingPlace

[action_upgrade2]
pos:1.1
text:Upgrade oasis
description: -Unlock research\n -Increase coin production
displayType:upgrade
price:Emerald=500, gazul=250
isActive:if self.hasFlag(id=1)
isVisible:if self.hasFlag(id=1)
allowMultipleInQueue:false
buildSpeed:20s
convertTo: highpeakFlodrjinaiMine2

[canBuild_1]
name: setRally, highpeakFlodrjinaiHouse, highpeakFlodrjinaiScarab_3
pos: 1.3

[canBuild_3]
isVisible: if self.hasFlag(id=1)
name: highpeakFlodrjinaiScarab_1, highpeakFlodrjinaiScorpion_1
pos: 1.4
addResources: Lodging=2

[canBuild_4]
isVisible: if self.hasFlag(id=1)
name: highpeakFlodrjinaiScarab_2, highpeakFlodrjinaiAirship_1
pos: 1.4
addResources: Lodging=3

[canBuild_5]
isVisible: if self.hasFlag(id=1)
name: highpeakFlodrjinaiTrader_1
pos: 1.4

[canBuild_ai]
name: highpeakFlodrjinaiScarab_1_ai
pos: 0.5
isVisible:if self.isControlledByAI()
addResources: Lodging=3

[canBuild_aiT2]
name: highpeakFlodrjinaiScarab_2_ai, highpeakFlodrjinaiAirship_1_ai
pos: 0.6
isVisible:if self.isControlledByAI() and self.hasFlag(id=1)
addResources: Lodging=4

[action_mobileHouse]
isVisible:if self.isControlledByAI() and numberOfUnitsInTeam(withTag='mobileHouse', withinRange=600, lessThan=4)
ai_isHighPriority: if numberOfUnitsInTeam(withTag='mobileHouse', withinRange=600, lessThan=3)
produceUnits:highpeakFlodrjinaiHouse
price:Emerald=50
buildSpeed:25s

[action_mobileBarracks]
isVisible:if self.isControlledByAI() and numberOfUnitsInTeam(withTag='mobileBarracks', withinRange=600, lessThan=2)
ai_isHighPriority: if numberOfUnitsInTeam(withTag='mobileBarracks', withinRange=600, lessThan=1)
produceUnits:highpeakFlodrjinaiScarab_3
price:Emerald=750
buildSpeed:40s

[hiddenAction_delete]
autoTrigger: if not numberOfUnitsInTeam(withTag='highpeakRecordTrackingAndSpawner',greaterThan=0)
deleteSelf:true

[hiddenAction_aiBoost]
autoTrigger: if self.resource(type='Gazul',lessThan=2000)
requireConditional: if self.isControlledByAI()
addResources: Gazul=2

[hiddenAction_aiBoost2]
autoTrigger: if self.resource(type='Coins',lessThan=1000)
requireConditional: if self.isControlledByAI()
addResources: Coins=1

################################# Attack #################################

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s

################################# Movement #################################

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1

################################# Ai #################################

[ai]

buildPriority: 0.7
noneInBaseExtraPriority: 0.1

noneGlobalExtraPriority: 0.2

maxEachBase: 4

################################# Graphics #################################

[hiddenAction_gazulOasis]
autoTrigger:if self.hasFlag(id=1)
spawnEffects:CUSTOM:oasis

[effect_oasis]
dirSpeed:0.2
fadeInTime:60
attachedToUnit: false
life: 900
physics: true
scaleFrom:0.5
scaleTo: 3
image: ROOT:\data\images\gazulOasis.png
drawUnderUnits:true
dirOffsetRandom:5
alpha:0.25

[graphics]
total_frames: 3
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:1

animation_idle_start: 0
animation_idle_end: 2
animation_idle_speed: 9
#animation_idle_pingPong: true

[arm_12]
x: -0.5
y: 0
image_end: baseT2.png
image_end_teamColors: true
hidden:if not self.hasFlag(id=1)
drawOverBody:true
