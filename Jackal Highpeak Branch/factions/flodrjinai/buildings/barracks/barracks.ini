price: Emerald=500
maxHp: 2500
mass: 9000

displayText: Mercenary tent
displayDescription: "The finest blades coins can buy are gathered here."\n\n -Can train mercenary units (For coins)\n -Non Flodrjinai factions also recieves coins over time

