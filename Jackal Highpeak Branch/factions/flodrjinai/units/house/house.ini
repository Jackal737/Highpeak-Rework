
[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakFlodrjinaiHouse
tags: bio, normalVision, monster, shield, cannotConvert, mobileHouse, CanBurn, dropoff
displayText: Skarajanai
displayDescription: "Home is where the heart wanders..."\n\n -Mobile house\n -Provides 15 lodging\n -Can train servai\n -Shield\n -Can catch fire\n-Resource dropoff
class: CustomUnitMetadata
price: Emerald=600
borrowResourcesWhileBuilt:Lodging=-10
maxHp: 1000
selfRegenRate:0
armour:12
mass: 600
radius: 14
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 25s

transportSlotsNeeded:5

isBio: true
isBug: true
hideScorchMark: true

effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

################################# Death #################################

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.05

[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

################################# Training #################################

[canBuild_Recruit]
name:highpeakFlodrjinaiBuilder_1
pos: 2
addResources: Lodging=1

################################# Abilities #################################

[hiddenAction_durable]
requireConditional: if self.globalTeamTags(includes='flodrjinaiCaravanTech')
autoTrigger: if not self.hasTags(includes='durable') and self.globalTeamTags(includes='flodrjinaiCaravanTech')
setUnitStats: armour += 5, maxHp+=${core.maxHp*0.2}
temporarilyAddTags: durable

[action_shield]
iconImage:ROOT:\data\images\shield.png
displayType:action
pos:1
text: Shield
description: Passive\n -This unit is resistant to small projectiles
buildSpeed: 0s
isVisible: true

[hiddenAction_Wanders]
text: Wanders
buildSpeed:0
autoTrigger: if self.customTimer(laterThanSeconds=29) and self.isControlledByAI()
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_position_randomOffsetFromSelf: 40,40
addWaypoint_maxTime: 5s
resetCustomTimer:true

################################# Attack ################################

[attack]

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:  false
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 8
shootDelay: 1s

################################# Graphics ################################

[graphics]
imageScale: 1
total_frames: 1

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:2


animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 7

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 0
animation_attack_end: 0
animation_attack_speed: 7
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true

[leg_1]
x: -7
y: 8
attach_x: -2
attach_y: 4
rotateSpeed:6
moveSpeed: 1.8
resetAngle:5
heightSpeed: 0.5
dust_effect: false
holdDisMin: 4
holdDisMax: 12
hardLimit: 12
holdDisMin_maxMovingLegs:2
hold_moveOnlyIfFurthest:true
estimatingPositionMultiplier:0.45
hidden:if self.isFlying()

endDirOffset:15
draw_foot_on_top:true
image_leg:  leg.png
image_foot:  foot.png

[leg_2]
x: 7
y: 8
attach_x: 2
attach_y: 4
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:-15

[leg_3]
x: -10
y: -3
attach_x: -3
attach_y: 2
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:200

[leg_4]
x: 10
y: -3
attach_x: 3
attach_y: 2
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:-200

[leg_5]
x: -9
y: -11
attach_x: -3
attach_y: -1
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:160

[leg_6]
x: 9
y: -11
attach_x: 3
attach_y: -1
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:-160

################################# Movement ################################

[movement]
movementType: LAND
moveSpeed: 0.4
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: true

maxTurnSpeed: 3
turnAcceleration: 0.1

moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  180
reverseSpeedPercentage:0





