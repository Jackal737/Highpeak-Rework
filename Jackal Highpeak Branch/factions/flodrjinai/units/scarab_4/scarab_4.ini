
[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakFlodrjinaiScarab_4
tags: magical, normalVision, monster, plate, cannotConvert, good, center, greatEmerald, factionFlodrjinai, large, dropoff
displayText: Rejeral Karavajinai
displayDescription: "Home is where there is opportunity."\n\n -Large mobile caravan\n -Provides 10 lodging\n -Can train servai and Mamashin\n -Can barter resources\n-Resource dropoff\n -Defend at all cost
class: CustomUnitMetadata
price: 0
borrowResourcesWhileBuilt:Lodging=-10
maxHp: 4000
selfRegenRate:0
armour:10
mass: 10000
radius: 22
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 10s

transportSlotsNeeded:100

isBio: true
isBug: true
hideScorchMark: true

effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

################################# death #################################

[hiddenAction_deathExplosion]
requireConditional: if not game.nukesEnabled()
autoTriggerOnEvent:destroyed
fireTurretXAtGround:death

[effect_deathExplode]
priority:critical
attachedToUnit: false
life: 180
physics: true
scaleFrom:2.5
scaleTo: 0.6
xSpeedRelativeRandom: 12
ySpeedRelativeRandom: 12
hSpeed: 2
image: ROOT:\data\images\pixel.png
drawUnderUnits:false
color:green

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\splat.ogg:0.05

[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

################################# Abilities #################################

[hiddenAction_durable]
requireConditional: if self.globalTeamTags(includes='flodrjinaiCaravanTech')
autoTrigger: if not self.hasTags(includes='durable') and self.globalTeamTags(includes='flodrjinaiCaravanTech')
setUnitStats: armour += 5, maxHp+=${core.maxHp*0.2}
temporarilyAddTags: durable

################################# Resources #################################

[action_produceGazul]
ai_isDisabled:true
price: Emerald=1000
addResources: Gazul=550
text: Barter for Gazul
description: -Recieve 550 Gazul for 1000 Emerald
buildSpeed: 5s
pos: 0.1

[action_produceEmerald]
ai_isDisabled:true
price: Gazul=1000
addResources: Emerald=550
text: Barter for emeralds
description: -Recieve 550 Emerald for 1000 Gazul
buildSpeed: 5s
pos: 0.1

[action_produceCoins]
ai_isDisabled:true
price: Emerald=500, Gazul=500
addResources: Coins=250
text: Barther for coins
description: -Sell 500 emeralds and 500 gazul for 250 coins
buildSpeed: 5s
pos: 0.1

[hiddenAction_aiBoost2]
autoTrigger: if self.resource(type='Coins',lessThan=1000)
requireConditional: if self.isControlledByAI()
addResources: Coins=1

################################# Training #################################

[canBuild_Recruit]
name:highpeakFlodrjinaiBuilder_1
pos: 1
addResources: Lodging=1

[canBuild_heroFlodrjinai]
name: highpeakFlodrjinaiHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2

################################# Alert #################################

[hiddenAction_onCreateAmmo]
requireConditional: if not game.nukesEnabled()
autoTriggerOnEvent: created
addResources: ammo=15

[hiddenAction_alarmTimer]
requireConditional: if not game.nukesEnabled()
autoTrigger: if self.ammo(lessThan=15)
addResources: ammo=1

[hiddenAction_alarm]
autoTriggerOnEvent: tookDamage
requireConditional:if self.ammo(greaterThan=14)
addResources: ammo=-15
showMessageToPlayer: OUR EMERALD IS UNDER ATTACK!
playSoundToPlayer:ROOT:\data\soundFx\alarm.ogg:0.3

################################# Attack #################################

[attack]

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 1
shootDelay: 1s

[turret_1]
x: 0
y: 0
canShoot:false
invisible:true

[turret_death]
x: 0
y: 0
canShoot:false
invisible:true
projectile:death

[projectile_death]
spawnProjectilesOnExplode:death
areaDamage: 100000
areaRadius:500000
areaDamageNoFalloff:true
areaHitAirAndLandAtSameTime:true
areaHitUnderwaterAlways:true
armourIgnoreAmount:10000
friendlyFire:only-ignoreEnemy
life: 120
speed:50
explodeEffect:shockwave, CUSTOM:deathExplode*100
drawSize:0

[turret_2]
x: 0
y: 14
attachedTo:1
slave:true
canShoot:false


################################# Movement #################################

[movement]
movementType: LAND
moveSpeed: 0.4
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: true
targetHeight:2
maxTurnSpeed: 1
turnAcceleration: 0.1

moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  180
reverseSpeedPercentage:0

################################# Graphics #################################


[graphics]
drawLayer:experimentals
total_frames: 1
imageScale: 1.1
teamColorsOnTurret: true
image:        body.png
image_wreak:  ROOT:\data\images\medium_dead.png
image_turret: turret.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:2

showTransportBar:false

animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 17
animation_moving_scale_start:1
animation_moving_scale_end:1.02

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong:true
lock_body_rotation_with_main_turret:true

[attachment_1]
resetRotationWhenNotAttacking:true
x: 0
y: 0
idleDir:0
height:2
isVisible:true
keepAliveWhenParentDies:false
rotateWithParent:false
canBeAttackedAndDamaged:false
onCreateSpawnUnitOf:highpeakFlodrjinaiScarab_4_emerald


[leg_1]
x: -13
y: 9
attach_x: -2
attach_y: 4
rotateSpeed:4
moveSpeed: 1.8
resetAngle:5
heightSpeed: 0.5
dust_effect: false
holdDisMin: 4
holdDisMax: 12
hardLimit: 12
holdDisMin_maxMovingLegs:2
hold_moveOnlyIfFurthest:true
estimatingPositionMultiplier:0.45
hidden:if self.isFlying()

endDirOffset:15
draw_foot_on_top:true
image_leg:  leg.png
image_foot:  foot.png


[leg_2]
x: 13
y: 9
attach_x: 2
attach_y: 4
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:-15

[leg_3]
x: -15
y: -2
attach_x: -3
attach_y: 2
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:200

[leg_4]
x: 15
y: -2
attach_x: 3
attach_y: 2
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:-200

[leg_5]
x: -14
y: -14
attach_x: -3
attach_y: -1
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:160

[leg_6]
x: 14
y: -14
attach_x: 3
attach_y: -1
copyFrom: 1
hidden:if self.isFlying()
endDirOffset:-160

[arm_8]
x: 0
y: 0
image_end: ROOT:\data\images\auraHeroVeryLarge.png
image_end_teamColors: true
drawUnderAllUnits: true

[arm_12]
x: 0
y: 0
image_end: body2.png
image_end_teamColors: true
hidden:if game.nukesEnabled()
drawOverBody:true

################################# Ai #################################

[hiddenAction_Wanders]
text: Wanders
buildSpeed:0
autoTrigger: if self.customTimer(laterThanSeconds=29) and self.isControlledByAI()
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_position_randomOffsetFromSelf: 40,40
addWaypoint_maxTime: 5s
resetCustomTimer:true

[ai]
useAsBuilder:true
