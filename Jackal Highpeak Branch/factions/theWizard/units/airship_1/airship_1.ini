[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakTheWizardAirship_1
displayText: Wonder cube
tags:magical, normalVision
displayDescription: -Magical Airship \n -Can transport units
class: CustomUnitMetadata
price: Emerald=550, Gazul=500, Sapphire=15
maxHp: 400
armour: 5
armourMinDamageToKeep: 0
mass: 1500

maxTransportingUnits:10
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6

techLevel: 1
buildSpeed: 30s
radius: 20
isBio: false
isBug: false
fogOfWarSightRange: 18
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 12

[hiddenAction_iceSpark]
spawnEffects: CUSTOM:iceSpark*3
autoTrigger:true

[effect_iceSpark]
attachedToUnit: false
life: 80
scaleFrom:0.7
scaleTo: 0
xOffsetRelativeRandom: 16
yOffsetRelativeRandom: 16
hOffset: 8
dirOffsetRandom:25
xSpeedRelativeRandom: 0.15
ySpeedRelativeRandom: 0.15
ySpeedRelative: 0.2
hSpeed: 0.1
image: ROOT:\data\images\snowFlake2.png
drawUnderUnits:false
fadeInTime:15

[action_blink]
iconImage:ROOT:\data\images\iceIcon.png
displayType: action
text: Blink
description: -Move to the target destination instantly
price: Sapphire=10
spawnEffects: CUSTOM:effectBlinkIn
fireTurretXAtGround: blink
buildSpeed: 0s
addActionCooldownTime:30s
pos: 0
ai_isDisabled: true

[graphics]
total_frames: 1
imageScale: 0.7
teamColorsOnTurret: true
image:        ROOT:\data\images\auraHeroVeryLarge.png
image_wreak:  ROOT:\data\images\medium_dead_wood.png
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
showTransportBar:false

movementEffect:CUSTOM:iceSpark
movementEffectRate:5

[attack]

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 11
turretTurnSpeed: 3

maxAttackRange: 135
shootDelay: 2s

[turret_1]
x: 0
y: 0
canShoot: false

[turret_blink]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\phaseShiftOut.ogg
shoot_sound_vol:0.2
projectile:blink
limitingRange:250
canShoot: false
shoot_light: #c3ddef

[projectile_blink]
life: 999
speed: 100
drawSize: 0
directDamage: 0
targetGround: true
explodeOnEndOfLife: true
explodeEffect:CUSTOM:effectBlinkOut
shouldRevealFog:true
teleportSource:true

[effect_effectBlinkIn]
attachedToUnit: false
life: 15
alpha: 1
hOffset:1
xOffsetRelativeRandom:3
yOffsetRelativeRandom:3
hSpeed: 0.2
xSpeedRelativeRandom:0.1
ySpeedRelativeRandom:0.1
dirSpeed:0.4
dirSpeedRandom:0.3
dirOffsetRandom:360
fadeInTime:5
image: ROOT:\data\images\snowFlake.png
priority: high
drawUnderUnits:false
scaleFrom:4
scaleTo: 0

[effect_effectBlinkOut]
attachedToUnit: false
life: 15
alpha: 1
hOffset:1
xOffsetRelativeRandom:3
yOffsetRelativeRandom:3
hSpeed: 0.2
xSpeedRelativeRandom:0.1
ySpeedRelativeRandom:0.1
dirSpeed:0.4
dirSpeedRandom:0.3
dirOffsetRandom:360
fadeInTime:5
image: ROOT:\data\images\snowFlake.png
priority: high
drawUnderUnits:false
scaleFrom:1
scaleTo: 5

[movement]
movementType: AIR
moveSpeed: 0.5
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 2
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181
reverseSpeedPercentage:0

[arm_1]
x: 0
y: 0
drawUnderAllUnits: true
spinRate:-1

[arm_2]
x: 0
y: 0
copyFrom:1
spinRate:1

[arm_3]
x: 0
y: 0
copyFrom:1
spinRate:-1

[arm_10]
x: 0
y: 0
image_end: ROOT:\data\images\auraHeroVeryLarge.png
image_end_teamColors: true
drawUnderAllUnits: true

#----------------------------(Decals)--------------------------------------

[decal_body1]
onlyWhileAlive:true
order:0
imageScale:0.7
xOffsetRelative:0
yOffsetRelative:0
hOffset:0
layer: afterBody
imageStack:ROOT:\data\images\auraHeroVeryLarge.png, body.png*2, body2.png*1,body.png*1, body2.png*6, body.png*1, body2.png*1, body.png*1
stack_hOffset:0.4
teamColors:true
basePositionFromLegEnd:arm_1

image_shadow: SHADOW:body.png
shadowOffsetX:0
shadowOffsetY:0

[decal_body2]
onlyWhileAlive:true
order:2
imageScale:0.7
xOffsetRelative:0
yOffsetRelative:0
hOffset:4
layer: afterBody
imageStack:ROOT:\data\images\auraHeroVeryLarge.png, body.png*2, body2.png*1,body.png*1, body2.png*6, body.png*1, body2.png*1, body.png*1
stack_hOffset:0.4
teamColors:true
basePositionFromLegEnd:arm_2

[decal_body3]
onlyWhileAlive:true
order:3
imageScale:0.7
xOffsetRelative:0
yOffsetRelative:0
hOffset:8
layer: afterBody
imageStack:ROOT:\data\images\auraHeroVeryLarge.png, body.png*2, body2.png*1,body.png*1, body2.png*6, body.png*1, body2.png*1, body.png*1
stack_hOffset:0.4
teamColors:true
basePositionFromLegEnd:arm_3


[animation_idle]
onActions: idle

arm1_0s: {x:0, y:0,height:-1}
arm1_3s: {x:0, y:0,height:-3}

arm2_0s: {x:0, y:0,height:1}
arm2_3s: {x:0, y:0,height:-1}

arm3_0s: {x:0, y:0,height:1}
arm3_3s: {x:0, y:0,height:3}

pingPong:true

[animation_move]
onActions: move

arm1_0s: {x:0, y:0,height:-1}
arm1_3s: {x:0, y:0,height:-3}

arm2_0s: {x:0, y:0,height:1}
arm2_3s: {x:0, y:0,height:-1}

arm3_0s: {x:0, y:0,height:1}
arm3_3s: {x:0, y:0,height:3}

pingPong:true