
[core]
copyFrom:ROOT:\data\templates\unitXp.template
name: highpeakTheWizardGargoyle_1
tags: magical, monster, normalVision
displayText: Gargoyle
displayDescription: -Magical monster \n -Good vs infantry\n -Regenerates hp when immobile
class: CustomUnitMetadata
price: Emerald=75, Gazul=30, Amber=2
maxHp: 125
selfRegenRate:0
armour:5
mass: 250
radius: 6
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 14s
fogOfWarSightRange: 18
isBio: true
isBug: false
explodeOnDeathGroundCollision:false
effectOnDeathGroundCollision:NONE

hideScorchMark: true
effectOnDeath:CUSTOM:death, smoke
unitsSpawnedOnDeath:neutralDead

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\crack.ogg:0.05

[action_passiveRegenInfo]
iconImage:ROOT:\data\images\healingBreeze.png
displayType:action
pos:1
text: Regenerate
description: Passive\n -Regenerates hp when immobile
buildSpeed: 0s
isVisible: true

[hiddenAction_passiveRegen]
autoTrigger: if not self.isMoving() and not self.hp(full=true) and not self.hasTakenDamage(withinSeconds=5) and not self.isAttacking()
addResources: hp=5
spawnEffects:CUSTOM:hpRegen

[graphics]
imageScale: 0.8
total_frames: 4
showQueueBar:false
image:        body.png
image_wreak:  ROOT:\data\images\dust.png
image_turret: NONE

image_shadow: ROOT:\data\images\shadowAir.png
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 4
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_pingPong: true

animation_attack_start: 0
animation_attack_end: 3
animation_attack_speed: 4

lock_body_rotation_with_main_turret: true


[attack]

canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: true
isMelee:true
meleeEngangementDistance:120
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 8
shootDelay: 1.25s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\maceHit.ogg, ROOT:\data\soundFx\maceHit2.ogg
shoot_sound_vol:0.05
recoilOffset:3
recoilOutTime: 15
recoilReturnTime: 18

[projectile_1]
directDamage: 20
buildingDamageMultiplier: 0.5
armourIgnoreAmount:0
life: 10
instant:true
