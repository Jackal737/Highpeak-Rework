
[core]
name: highpeakTheWizardRingIce
tags: highpeakbarracks, canBurn, building, moot
class: CustomUnitMetadata
price: Emerald=750
maxHp: 1500
mass: 9000

displayText: Ring of ice
displayDescription: "Adaptability perhaps is the key..."\n\n -Defensive building\n -Can train ice units and generates sapphires

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5

disableAllUnitCollisions:true
exit_y:0

[canBuild_Recruit]
name:setRally, highpeakTheWizardInfantry_2, highpeakTheWizardArcher_3, highpeakTheWizardSiege_1, highpeakTheWizardAirship_1, highpeakTheWizardSiege_2
pos: 0.1

[hiddenAction_sapphireTimer]
autoTrigger: if self.customTimer(laterThanSeconds=7)
alsoTriggerAction: sapphireLvL1
resetCustomTimer:true
[hiddenAction_sapphireLvL1]
requireConditional:if self.resource(type='Sapphire',lessThan=100)
addResourcesScaledByAIHandicaps: sapphire=1
spawnEffects:CUSTOM:produceSapphire

[effect_produceSapphire]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\sapphire10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[graphics]
total_frames: 1
imageScale: 0.9
drawLayer:bottom
image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0.5
shadowOffsetY:1



[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 20

maxAttackRange: 250
shootDelay: 2s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\flameThrower.ogg
shoot_sound_vol:0.1
shoot_flame:smoke
recoilOffset:-3
recoilOutTime: 15
recoilReturnTime: 18
projectile:1

[projectile_1]
mutatorShield_ifUnitWithTags:shield
mutatorShield_areaDamageMultiplier:0.5

mutatorPlate_ifUnitWithTags:plate
mutatorPlate_areaDamageMultiplier:0.25

areaDamage:40
areaHitAirAndLandAtSameTime:true
areaRadius:20
targetGround:true
targetGround_includeTargetHeight:true
targetGroundSpread:15
life: 120
speed: 3
speedSpread:1
image: ROOT:\data\images\snowFlake.png
buildingDamageMultiplier: 0.5
drawSize:0.8
shadowFrame:11
trailEffect:CUSTOM:trail
trailEffectRate:1
lightColor:#c3ddef
initialUnguidedSpeedHeight: 1
gravity:0.18

explodeEffect:CUSTOM:effectFreezingBomb*2

mutatorFire_ifUnitWithTags: bio
mutatorFire_addResourcesAreaHit: Freezing=3

[effect_effectFreezingBomb]
attachedToUnit: true
life: 10
alpha: 1
hOffset:1
xOffsetRelativeRandom:3
yOffsetRelativeRandom:3
hSpeed: 0.2
xSpeedRelativeRandom:0.1
ySpeedRelativeRandom:0.1
dirSpeed:0.4
dirSpeedRandom:0.3
dirOffsetRandom:360
fadeInTime:2
image: ROOT:\data\images\snowFlake.png
priority: high
drawUnderUnits:false
scaleFrom:1
scaleTo: 2

[effect_trail]
createWhenZoomedOut: false
image: ROOT:\data\images\snowFlake.png
life: 40

xSpeedRelativeRandom:0.4
ySpeedRelativeRandom:0.4
ySpeedRelative:2

fadeOut: true
attachedToUnit: false
fadeInTime:2
scaleFrom: 0.6
scaleTo: 0
alpha: 1
drawUnderUnits:false


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.30

noneGlobalExtraPriority: 0.1

maxEachBase: 1

[arm_4]
x: 0
y: 0

image_end: ring.png
drawOverBody: true
spinRate:-0.1

[arm_1]
x: 0
y: 0

image_end: ring2.png
drawOverBody: true
spinRate:0.1

[arm_2]
x: 0
y: -4

image_end: ring2.png
drawOverBody: true
spinRate:0.23

[arm_6]
x: 0
y: 0
image_end: crystalSmall.png
image_end_teamColors: true
