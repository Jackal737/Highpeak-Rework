
[core]
name: highpeakTheWizardRingEarth
tags: highpeakbarracks, canBurn, building, moot
class: CustomUnitMetadata
price: Emerald=1000
borrowResourcesWhileAlive: Lodging=-10
maxHp: 6000
mass: 9000

displayText: Greater Ring of Earth
displayDescription: "Immovability is immortality..."\n\n -Powerful elemental structure\n -Can train advanced earth units\n -Generates Amber\n -Well armed and armored\n -Generates 10 lodging

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,2,2
constructionFootprint: -1,-1,2,2
buildingToFootprintOffsetX:22
buildingToFootprintOffsetY:12

isBuilding: true
isBio: false
numBitsOnDeath: 5

disableAllUnitCollisions:true
exit_y:0

[canBuild_Recruit]
