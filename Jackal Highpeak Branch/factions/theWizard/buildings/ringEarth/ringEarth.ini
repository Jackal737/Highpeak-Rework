pos: 0.1

[hiddenAction_amberTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoTriggerAction: amberLvL1
resetCustomTimer:true
[hiddenAction_amberLvL1]
requireConditional:if self.resource(type='Amber',lessThan=500)
addResourcesScaledByAIHandicaps: amber=5
spawnEffects:CUSTOM:produceAmber

[effect_produceAmber]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\amber10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[graphics]
total_frames: 1
imageScale: 1.3
drawLayer:bottom
image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:0.5
shadowOffsetY:1



[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 20

maxAttackRange: 300
shootDelay: 4s

[turret_1]
