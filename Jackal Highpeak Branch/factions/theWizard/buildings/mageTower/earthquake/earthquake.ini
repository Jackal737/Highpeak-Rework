[core]
showInEditor: true
name: highpeakEarthquakeSpell
displayText: Earthquake
displayDescription: -Deal 250 base and 1250 siege damage at target location over 10 seconds
class: CustomUnitMetadata
price: 0
maxHp: 1000
armour: 999999
armourMinDamageToKeep: 0
mass: 10000
techLevel: 1
radius: 1
isBio: false
transportSlotsNeeded: 1000
isUnrepairableUnit: true
hideScorchMark: true
fogOfWarSightRange: 0
energyMax: 10
energyRegen: 0
dieOnZeroEnergy: true
explodeOnDeath:false
softCollisionOnAll: 100
disableAllUnitCollisions:true
canNotBeDirectlyAttacked:true
isUnselectable:true

[action_lifeTime]
autoTrigger: true
isVisible: false
addEnergy: -1

[hiddenAction_triggerDamage]
autoTrigger: true
fireTurretXAtGround: damageEmitter
fireTurretXAtGround_withOffset: 0,0

[hiddenAction_triggerParticles]
autoTriggerOnEvent: created
isVisible: false
fireTurretXAtGround: ambientCracks
fireTurretXAtGround_withOffset: 0,10

[graphics]
total_frames: 1
showEnergyBar:false
image:        spawner.png
image_wreak:  NONE
image_shadow: NONE

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 110
turretTurnSpeed: 10
shootDelay: 3
aimOffsetSpread: 0

[turret_damageEmitter]
x: 0
y: 0
projectile: earthquake
canShoot: true

[turret_ambientCracks]
x: 0
y: 0
projectile: ambientCracks
canShoot: true

[projectile_earthquake]
life: 0
speed: 0
frame: 0
drawSize: 0
targetGround: true
areaDamage: 25
areaRadius: 110
friendlyFire: true
buildingDamageMultiplier: 5
explodeOnEndOfLife: true
explodeEffect: NONE

[projectile_ambientCracks]
life: 10s
speed: 0.0001
targetSpeed: 0.0001
targetGround: true
directDamage: 0
frame: 0
drawSize: 0
trailEffect: CUSTOM:crack*1, CUSTOM:crackSpread*2,CUSTOM:sound, CUSTOM:dustTrail*3
trailEffectRate: 15

[effect_crack]
spawnChance:0.25
alwayStartDirAtZero:true
priority:high
attachedToUnit: false
life: 600
scaleFrom:1.5
scaleTo: 1.4
#dirOffsetRandom:360
image: ROOT:\data\images\crack.png
drawUnderUnits:true
xOffsetAbsoluteRandom:80
yOffsetAbsoluteRandom:80
fadeInTime:10

[effect_crackSpread]
spawnChance:0.25
attachedToUnit: false
life: 350
scaleFrom:0.75
scaleTo: 1
dirOffsetRandom:360
image: ROOT:\data\images\crack.png
alpha:0.5
drawUnderUnits:true
xOffsetAbsoluteRandom:120
yOffsetAbsoluteRandom:120
fadeInTime:10

[effect_dustTrail]
alwayStartDirAtZero:true
atmospheric:true
fadeInTime:30
dirOffsetRandom:360
xOffsetRelativeRandom:14
yOffsetRelativeRandom:14
attachedToUnit: false
life: 300
alpha: 0.6
scaleFrom:2
scaleTo: 4
hSpeed: 0
xSpeedRelativeRandom:0.14
ySpeedRelativeRandom:0.14
image: ROOT:\data\images\dust.png
priority: high
drawUnderUnits:false

xOffsetAbsoluteRandom:80
yOffsetAbsoluteRandom:80

[effect_sound]
spawnChance:0.25
alsoPlaySound: ROOT:\data\soundFx\crack.ogg:0.1
life:30
attachedToUnit: false
priority: veryhigh
alpha: 0

[movement]
movementType: NONE
moveSpeed: 0
targetHeight:-1
maxTurnSpeed: 0
moveSlidingMode :true
moveIgnoringBody: true