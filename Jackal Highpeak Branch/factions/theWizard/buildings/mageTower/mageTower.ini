scaleFrom: 1.2
scaleTo: 3
fadeInTime:20
drawUnderUnits:false
liveAfterAttachedDies: true
xOffsetRelative: 0
yOffsetRelative: -8
dirSpeedRandom:0.15
dirOffsetRandom:360
teamColorRatio:1
alpha:0.6

[effect_deathExplode]
priority:critical
attachedToUnit: false
life: 180
physics: true
