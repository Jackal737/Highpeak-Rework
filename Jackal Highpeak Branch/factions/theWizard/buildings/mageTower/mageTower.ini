
[core]
copyFrom:ROOT:\data\templates\builderEffect.template, ROOT:\data\templates\unitXp.template
isUnrepairableUnit:true
name: highpeakTheWizardMageTower
tags: center, normalVision, good, magical, greatEmerald, factionTheWizard, large, building, dropoff, canBurn, wizardTower
displayText: Tower
displayDescription: "A vessel to explore every facets of reality"\n\n -Cannot attack\n -Can build and repair structures\n -Can can cast spells over a large area\n -Provides 12 lodging\n -Defend at all cost
class: CustomUnitMetadata
price: Emerald=1000, Gazul=500
maxHp: 2000

borrowResourcesWhileBuilt:lodging=-12

selfRegenRate:0
