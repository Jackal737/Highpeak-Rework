
[core]
name: highpeakTheWizardRingFire
tags: highpeakbarracks, canBurn, building, moot
class: CustomUnitMetadata
price: Emerald=550
maxHp: 1500
mass: 9000

displayText: Ring of fire
displayDescription: "Change is the only constant..."\n\n -Defensive building\n -Can train fire units and generates rubies

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5

disableAllUnitCollisions:true
exit_y:0

[canBuild_Recruit]
name:setRally, highpeakTheWizardArcher_1, highpeakTheWizardArcher_2, highpeakTheWizardDragon_1, highpeakTheWizardMonster_3
pos: 0.1

[hiddenAction_rubyTimer]
autoTrigger: if self.customTimer(laterThanSeconds=7)
alsoTriggerAction: rubyLvL1
resetCustomTimer:true
[hiddenAction_rubyLvL1]
requireConditional:if self.resource(type='Ruby',lessThan=100)
addResourcesScaledByAIHandicaps: ruby=1
spawnEffects:CUSTOM:produceRuby

[effect_produceRuby]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\ruby10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[graphics]
total_frames: 1
imageScale: 0.9
drawLayer:bottom
image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0.5
shadowOffsetY:1



[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 20

maxAttackRange: 250
shootDelay: 2s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\flameThrower.ogg
shoot_sound_vol:0.1
shoot_flame:smoke
recoilOffset:-3
recoilOutTime: 15
recoilReturnTime: 18
projectile:1

[projectile_1]
mutatorShield_ifUnitWithTags:shield
mutatorShield_areaDamageMultiplier:0.5

mutatorPlate_ifUnitWithTags:plate
mutatorPlate_areaDamageMultiplier:0.25

areaDamage:60
areaHitAirAndLandAtSameTime:true
areaRadius:20
targetGround:true
targetGround_includeTargetHeight:true
targetGroundSpread:15
life: 120
speed: 3
speedSpread:1
image: ROOT:\data\images\ember.png
buildingDamageMultiplier: 0.5
drawSize:0.9
shadowFrame:11
trailEffect:CUSTOM:trail
trailEffectRate:1

initialUnguidedSpeedHeight: 1
gravity:0.18

mutatorFire_ifUnitWithTags: canBurn
mutatorFire_addResourcesAreaHit: Fire=5

[effect_trail]
atmospheric:true
createWhenZoomedOut: false
color:#ff4e00
image: ROOT:\data\images\trail.png
life: 60
fadeOut: true
attachedToUnit: false
fadeInTime:2
scaleFrom: 0.7
scaleTo: 0.2
alpha: 0.6
drawUnderUnits:false


[movement]
movementType: NONE
moveSpeed: 0
