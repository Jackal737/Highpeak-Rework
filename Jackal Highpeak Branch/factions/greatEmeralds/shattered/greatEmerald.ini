#[action_gameplayTips]
#isGuiBlinking:true
#iconImage:tips.png
#iconExtraImage:tips.png
#displayType:infoOnly
#text: Gameplay tips
#description: How to play LoHP\n -In legends of Highpeak, you must protect your great emerald at all cost or loose\n -Gather Emeralds(Using miners on emerald fields) and Gazoo (Using mines)\n -Feed your troops with a steady food income (Using farms or equivalent and hunt wild animals)\n (Your units consume food over time, some more than others)\n -Building a mine and farms should be your first steps\n\n -Each factions have unique specific mechanics (Please mind those and read tooltips carefully)\n -Explorers are unique units that can level up and gather treasures from special point of interests scattered around the map by standing near them\n-Be mindful, some points of interest are perilous and will need some units to support your explorer\n (If you loose your explorer, they can be resurrected at the Great emerald)\n -Many neutral tribes can be found on the field (You can subjugate their settlements to gain access to new units)\n (Some might even offer special abilities)\n\n -Most units will require local recruits or materials to be trained (Those will locally generate over time)\n -Units are categorised and have bonuses and maluses vs specific unit types\n -Some units have special abilities and status effects to their attacks (Be mindful of those)\n \n ---Thanks for reading this guide (More infos will be added if needed)---
#buildSpeed: 0s
#isVisible: true
#pos:1.5

[hiddenAction_alarm]
autoTriggerOnEvent: tookDamage
requireConditional:if self.customTimer(laterThanSeconds=15)
showMessageToPlayer: OUR EMERALD IS UNDER ATTACK!
playSoundToPlayer:ROOT:\data\soundFx\alarm.ogg:0.3
resetCustomTimer:true

[graphics]
imageScale: 1.1
total_frames: 1
rotate_with_direction:false
teamColorsOnTurret: true
image:        base.png
image_back:        back.png
image_wreak:  back.png
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 10
turretTurnSpeed: 20
maxAttackRange: 200
shootDelay: 1

[turret_death]
