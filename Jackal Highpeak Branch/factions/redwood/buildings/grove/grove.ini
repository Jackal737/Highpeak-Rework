
[core]
name: highpeakRedwoodGrove
tags:canBurn, building
class: CustomUnitMetadata
price: Emerald=1200
maxHp: 2200
mass: 9000

displayText: Redwood
displayDescription: "A millennial forest holds a magic of its own..."\n\n -Can train master beasts

techLevel: 1
buildSpeed: 20s

radius: 35
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5


exit_y:15

[canBuild_1]
name:setRally, highpeakRedwoodCrow_1, highpeakRedwoodCavalry_2, highpeakRedwoodEagle_1
pos: 0.1
addResources: Lodging=1

[canBuild_2]
name:highpeakRedwoodBear_1
pos: 0.1
addResources: Lodging=3

[canBuild_ai]
name:highpeakRedwoodCavalry_2_ai
pos: 0.2
isVisible:if self.isControlledByAI()

[hiddenAction_stealth]

autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0)
convertTo:highpeakRedwoodGrove_stealth
spawnEffects:CUSTOM:fairyDust*5

[effect_fairyDust]
teamColorRatio:0.25
attachedToUnit: false
life: 160
scaleFrom:1.5
scaleTo: 0.2
xOffsetRelativeRandom: 7
yOffsetRelativeRandom: 7
yOffsetRelative: 7

xSpeedRelativeRandom: 0.15
ySpeedRelativeRandom: 0.15
hSpeed: 0.1
image: ROOT:\data\images\fairyDust.png
drawUnderUnits:false


[graphics]
total_frames: 1
imageScale: 0.8

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:1



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.30

noneGlobalExtraPriority: 0.1

maxEachBase: 1