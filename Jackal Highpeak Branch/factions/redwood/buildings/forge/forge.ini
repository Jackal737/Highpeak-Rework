
[core]
name: highpeakRedwoodForge
tags: highpeakForge, canBurn, canSellTrophy, building, dropoff
class: CustomUnitMetadata
price: Emerald=350
maxHp: 2200
mass: 9000

displayText: Old oak
displayDescription: "Hey listen! Pixies live here... better avoid the place."\n\n -Can barther resources\n-Can train pixies\n -Spawns acorns over time\n-Resource dropoff\n -Hidden

techLevel: 1
buildSpeed: 15s

radius: 26
footprint: 0,0,0,0
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:8

[canBuild_builder]
name: setRally, highpeakFaeArcher_1, highpeakFaeArcher_3
pos: 2.1
addResources: Lodging=1

[action_produceGazul]
ai_isDisabled:true
price: Emerald=1000
addResources: Gazul=550
text: Barther for Gazul
description: -Recieve 550 Gazul for 1000 Emerald
buildSpeed: 10s
pos: 0.1

[action_produceEmerald]
ai_isDisabled:true
price: Gazul=1000
addResources: Emerald=550
text: Barther for emeralds
description: -Recieve 550 Emerald for 1000 Gazul
buildSpeed: 10s
pos: 0.2

[hiddenAction_stealth]

autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0)
convertTo:highpeakRedwoodForge_stealth
spawnEffects:CUSTOM:fairyDust*5

[effect_fairyDust]
teamColorRatio:0.25
attachedToUnit: false
life: 160
scaleFrom:1.5
scaleTo: 0.2
xOffsetRelativeRandom: 7
yOffsetRelativeRandom: 7
yOffsetRelative: 7

xSpeedRelativeRandom: 0.15
ySpeedRelativeRandom: 0.15
hSpeed: 0.1
image: ROOT:\data\images\fairyDust.png
drawUnderUnits:false


[graphics]
total_frames: 1
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s

[hiddenAction_acornTimer]
autoTrigger: if self.customTimer(laterThanSeconds=20)
alsoQueueAction: acorn
resetCustomTimer:true

[action_acorn]
highPriorityQueue:false
text:Acorn
description: -Spawns up to 4 acorn over time\n-Can be walked over by forest folk for extra food\n -Increases hp of master beasts who walks over it up to 5 times
buildSpeed:0s
attachments_addNewUnits:highpeakRedwoodAcorn
isActive:false
canPlayerCancel:false
requireConditional: if self.numberOfAttachedUnits(lessThan=4)
displayType:infoOnly
