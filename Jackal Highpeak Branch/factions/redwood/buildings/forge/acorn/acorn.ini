
[core]
tags:acorn
name: highpeakRedwoodAcorn
displayText: Acorn
displayDescription: -Can be walked over by forest folk for extra food\n -Increases hp of master beasts who walks over it up to 5 times
class: CustomUnitMetadata
price: 0
maxHp: 50
mass: 100

techLevel: 1
buildSpeed: 8s

radius: 6
isBio: false
isBug: false
isBuilding:false

numBitsOnDeath: 10


showOnMinimap: false
disableAllUnitCollisions:true
explodeOnDeath:false

effectOnDeath:smoke

[hiddenAction_birth]
autoTriggerOnEvent: created
spawnEffects: CUSTOM:fairyDust*3

[hiddenAction_stealth]

autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0)
convertTo:highpeakRedwoodAcorn_stealth
spawnEffects:CUSTOM:fairyDust*5

[effect_fairyDust]
teamColorRatio:0.25
attachedToUnit: false
life: 120
scaleFrom:1.3
scaleTo: 0.2
xSpeedRelativeRandom: 0.1
ySpeedRelativeRandom: 0.1
hSpeed: 0.1
image: ROOT:\data\images\fairyDust.png
drawUnderUnits:false

[effect_unloadFood]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\food10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[hiddenAction_food]
autoTrigger:if numberOfUnitsInTeam(withTag='forestFolk', greaterThan=0, withinRange=10)
buildSpeed: 0s
addResources: hp=-${ core.maxHp * 1 }, Food=10
spawnEffects:CUSTOM:unloadFood

[hiddenAction_hp+]
autoTrigger:if numberOfUnitsInTeam(withTag='masterBeast', greaterThan=0, withinRange=10)
fireTurretXAtGround: hp+
fireTurretXAtGround_withOffset: 0,0
buildSpeed: 0s
addResources: hp=-${ core.maxHp * 1 }

[turret_hp+]
x: 0
y: 0
canShoot: false
projectile: hp+
shoot_light: green

[projectile_hp+]
areaDamage: 0
areaRadius: 10
friendlyFire: only-ignoreEnemy
targetGround:true
areaDamageNoFalloff:true
areaHitAirAndLandAtSameTime:true
mutatorX_ifUnitWithTags:bio, magical
mutatorX_addResourcesAreaHit: hp=25, acorn=1, maxAcorn=1
shieldDefectionMultiplier:0
armourIgnoreAmount:1000
explodeEffect:CUSTOM:heal, CUSTOM:fairyDust*3
life: 1
explodeOnEndOfLife:true
speed:50

[effect_heal]
life: 0
spawnChance:1
fadeInTime: 0
fadeOut: false

alsoPlaySound:ROOT:\data\soundFx\fairyDust.ogg

[graphics]
rotate_with_direction:false
drawLayer:ground2
imageScale: 0.6
total_frames: 1
image:        body.png
image_wreak:  NONE
image_turret: NONE

image_shadow: ROOT:\data\images\shadow.png
shadowOffsetX:0
shadowOffsetY:3



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
isMelee:false
turretSize: 0
turretTurnSpeed: 100
aimOffsetSpread:0

maxAttackRange: 1
shootDelay: 1


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
joinsGroupFormations: false
targetHeight:5
targetHeightDrift:1

maxTurnSpeed: 0
turnAcceleration: 0.4

reverseSpeedPercentage:0

