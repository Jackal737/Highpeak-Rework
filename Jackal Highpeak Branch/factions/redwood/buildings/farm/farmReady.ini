
[core]
showInEditor:false
copyFrom:farm.ini
name: highpeakRedwoodFarmReady
price: localFood=3000

resourceRate: 0.0067
similarResourcesHaveTag:foodResource
resourceMaxConcurrentReclaimingThis:1
isUnrepairableUnit:true

[hiddenAction_foodTimer]
autoTrigger: if self.customTimer(laterThanSeconds=9)
alsoTriggerAction: foodLvL1
resetCustomTimer:true
[hiddenAction_foodLvL1]
addResources: Food=10, hp=-2
spawnEffects:CUSTOM:unloadFood
alsoTriggerAction: aiBoost

[hiddenAction_aiBoost]
requireConditional: if self.isControlledByAI()
addResourcesScaledByAIHandicaps: Food=20


[effect_unloadFood]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\food10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[hiddenAction_stealth]

autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0)
convertTo:highpeakRedwoodFarm_stealth
spawnEffects:CUSTOM:fairyDust*5

[ai]
upgradedFrom:highpeakRedwoodFarm

