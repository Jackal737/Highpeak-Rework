spawnEffects:CUSTOM:fairyDust*5

[effect_fairyDust]
teamColorRatio:0.25
attachedToUnit: false
life: 160
scaleFrom:2
scaleTo: 0.5
xOffsetRelativeRandom: 10
yOffsetRelativeRandom: 10
yOffsetRelative: 20

xSpeedRelativeRandom: 0.15
ySpeedRelativeRandom: 0.15
hSpeed: 0.1
image: ROOT:\data\images\fairyDust.png
drawUnderUnits:false

[graphics]
total_frames: 1
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.55

noneInBaseExtraPriority: 0.25

