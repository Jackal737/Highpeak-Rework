
[core]
name: highpeakRedwoodCenter
tags: center, canBurn, building, dropoff
class: CustomUnitMetadata
price: Emerald:750
maxHp: 3000
mass: 9000

displayText: Whirly willow
displayDescription: "When you see it, you are already entwined!"\n\n -Provides 10 lodging\n-Can train gnomes\n -Can garrison gnomes\n-Resource dropoff\n -Hidden

borrowResourcesWhileBuilt:lodging=-10

techLevel: 1
buildSpeed: 15s

radius: 60
footprint: -2,-2,2,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

maxTransportingUnits:8
transportUnitsRequireTag:builder
transportUnitsKillOnDeath:false

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:20
exit_moveAwayAmount:40

[canBuild_builder]
name: setRally, highpeakRedwoodBuilder_1
pos: 2.1
addResources: Lodging=1

[canBuild_hero]
name: highpeakRedwoodHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2

[hiddenAction_stealth]

autoTrigger:if not numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) and not numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0)
