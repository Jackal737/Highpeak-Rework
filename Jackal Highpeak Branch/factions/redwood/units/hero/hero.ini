
[core]
copyFrom: ROOT:\data\templates\unitXp.template, ROOT:\data\templates\unitInventory.template, ROOT:\data\templates\hero.template
name: highpeakRedwoodHero
tags: bio, infantry, normalVision, hero, cannotConvert, forestFolk
displayText: Brave strider
displayDescription: -Forest folk Explorer\n -Good vs neutrals\n -Can gather treasures\n -Can level up\n -Can be resurected at the Whirly willow\n -Can cross cliffs
class: CustomUnitMetadata
price: Emerald=450
maxHp: 350
selfRegenRate:0
armour:0
mass: 300
radius: 6
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 30s

isBio: true
isBug: false
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

[action_stealth]
isVisible: if self.tags(includes='lvl3')
isLocked: if numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) or numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0) or self.isOverLiquid()
isLockedMessage:Spotted

displayType:action
text:Hiddy-sneaky
description:-Unit become invisible\n -Spotted if enemies get near\n -Slow
iconImage:ROOT:\data\images\stealth.png
buildSpeed:2s
convertTo:highpeakRedwoodHero_stealth
pos: 1

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\deathSmall1.ogg:0.1, ROOT:\data\soundFx\deathSmall2.ogg:0.1

[hiddenAction_birth]
autoTriggerOnEvent:completeAndActive
spawnEffects:CUSTOM:birth

[effect_birth]
fadeInTime:10
attachedToUnit: true
life: 60
alpha: 2
scaleFrom:1.4
scaleTo: 0.2
hSpeed: 0.4
image: ROOT:\data\images\birth.png
priority: high
drawUnderUnits:false


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[graphics]
imageScale: 0.7
total_frames: 6
showEnergyBar:false
image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadow.png
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 3
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 3
animation_attack_end: 5
animation_attack_speed: 5
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true

[attack]

canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
canAttackUnderwaterUnits: false
isFixedFiring: true
isMelee:true
meleeEngangementDistance:120
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 8
shootDelay: 1s

[turret_1]
x: 0
y: 0
shoot_sound:ROOT:\data\soundFx\maceHit.ogg, ROOT:\data\soundFx\maceHit2.ogg, ROOT:\data\soundFx\axeHit3.ogg
shoot_sound_vol:0.07
recoilOffset:3
recoilOutTime: 15
recoilReturnTime: 18

[projectile_1]
mutatorNeutral_ifUnitWithTags:neutral
mutatorNeutral_areaDamageMultiplier:2.5

areaDamage: 50
areaRadius:15
armourIgnoreAmount:0
life: 10
instant:true
explodeEffect:NONE

[movement]
movementType: OVER_CLIFF
moveSpeed: 1.2
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.05
joinsGroupFormations: false
targetHeight:1
maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  180
reverseSpeedPercentage:0

[arm_8]
x: 0
y: 0
image_end: ROOT:\data\images\auraHero.png
image_end_teamColors: true
drawUnderAllUnits: true



