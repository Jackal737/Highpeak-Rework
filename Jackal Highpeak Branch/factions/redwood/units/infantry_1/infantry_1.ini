
[core]
copyFrom: ROOT:\data\templates\unitXp.template, ROOT:\data\templates\drowning.template, ROOT:\data\templates\unitInventory.template
name: highpeakRedwoodInfantry_1
tags: bio, infantry, normalVision, forestFolk
displayText: Badger lord
displayDescription: -Melee forest folk infantry\n -Well armed and armored\n -Good vs large and buildings\n -Stealthy
class: CustomUnitMetadata
price: Food=350, Lodging=1
borrowResourcesWhileBuilt:Lodging=1
maxHp: 375
selfRegenRate:0
armour:4
mass: 200
radius: 4
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 12s

isBio: true
isBug: false
hideScorchMark: true
effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath:neutralDead

[action_stealth]

isLocked: if numberOfUnitsInEnemyTeam(withTag='normalVision', withinRange=50, greaterThan=0) or numberOfUnitsInEnemyTeam(withTag='superVision', withinRange=250, greaterThan=0) or self.isOverLiquid()
isLockedMessage:Spotted

displayType:action
text:Hiddy-sneaky
description:-Unit become invisible\n -Spotted if enemies get near\n -Slow
iconImage:ROOT:\data\images\stealth.png
buildSpeed:2s
convertTo:highpeakRedwoodInfantry_1_stealth
pos: 1

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\deathBar3.ogg:0.08

[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[graphics]
imageScale: 0.65
total_frames: 5

image:        body.png
image_wreak:  ROOT:\data\images\skeleton.png
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadow.png
shadowOffsetX:1
shadowOffsetY:2


animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 7
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 3
animation_attack_end: 4
animation_attack_speed: 7
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true


[attack]

canAttack: true
canAttackFlyingUnits: if self.isFlying()
canAttackLandUnits:  if self.isAtGroundHeight()
canAttackUnderwaterUnits: false
isFixedFiring: true
isMelee:true
meleeEngangementDistance:120
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 12
shootDelay: 1.25s

[turret_1]
x: 0
y: 0
shoot_sound: ROOT:\data\soundFx\maceHit.ogg, ROOT:\data\soundFx\maceHit2.ogg, ROOT:\data\soundFx\axeHit3.ogg
shoot_sound_vol:0.05
recoilOffset:3
recoilOutTime: 15
recoilReturnTime: 18

[projectile_1]

mutatorLarge_ifUnitWithTags:large
mutatorLarge_directDamageMultiplier:2

buildingDamageMultiplier:3
directDamage: 25
armourIgnoreAmount:3
life: 10
instant:true
explodeEffect:NONE


[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.05
joinsGroupFormations: true

maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  180
reverseSpeedPercentage:0





