
[core]
name: highpeakTrogCenter
tags: center, canBurn, building, dropoff
class: CustomUnitMetadata
price: Emerald:750
maxHp: 3000
mass: 9000

displayText: Hive
displayDescription: "huddle huddle! Hoard all the things!"\n\n-Generates cave dwellers\n-Can train diggers\n -Can garrison digger\n-Resource dropoff


techLevel: 1
buildSpeed: 15s

radius: 60
footprint: -2,-2,2,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0
fogOfWarSightRange: 5

maxTransportingUnits:8
transportUnitsRequireTag:builder
transportUnitsKillOnDeath:false

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:20
exit_moveAwayAmount:40

[hiddenAction_caveDwellersTimer]
autoTrigger: if self.customTimer(laterThanSeconds=9)
alsoTriggerAction: caveDwellersLvL1
resetCustomTimer:true
[hiddenAction_caveDwellersLvL1]
requireConditional:if self.resource(type='CaveDwellers',lessThan=100)
addResourcesScaledByAIHandicaps: caveDwellers=1
spawnEffects:CUSTOM:produceCaveDwellers

[effect_produceCaveDwellers]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\caveDwellers10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[canBuild_builder]
name: setRally, highpeakTrogBuilder_1
pos: 2.2

[canBuild_hero]
name: highpeakTrogHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2


[graphics]
total_frames: 1
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.55

noneInBaseExtraPriority: 0.25

maxEachBase: 1