
[core]
copyFrom: ROOT:\data\templates\unitXp.template, ROOT:\data\templates\hero.template
name: highpeakHauntingHero
tags: undead, infantry, normalVision, hero, cannotConvert, etheral
displayText: Reaper
displayDescription: -Etheral explorer\n -Freezing attack\n -Good vs neutrals\n -Can gather treasures\n -Can level up\n -Can be resurected at the Burial ground\n -Can move over water
class: CustomUnitMetadata
price: Gazul=150
maxHp: 400
selfRegenRate:0
armour:0
mass: 300
radius: 7
softCollisionOnAll: 6

techLevel: 1
