spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\deathHaunt.ogg:0.075, ROOT:\data\soundFx\deathHaunt2.ogg:0.075, ROOT:\data\soundFx\deathHaunt3.ogg:0.075, ROOT:\data\soundFx\deathHaunt4.ogg:0.1


[effect_deathFog]
fadeInTime:20
color:#81f7ff
attachedToUnit: false
alpha:0.5
life: 70
scaleFrom:0.7
scaleTo: 0.1
