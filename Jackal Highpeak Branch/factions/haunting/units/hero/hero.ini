#------------------------------------(ai)-----------------------------------------------------

[hiddenAction_aiHaunting]

autoTrigger:if self.isControlledByAI() and not self.hasActiveWaypoint(type='guard')
addWaypoint_type:guard
addWaypoint_target_nearestUnit_tagged: livinglodestone
addWaypoint_target_nearestUnit_team: own
addWaypoint_target_nearestUnit_maxRange:800
clearAllWaypoints:true
addWaypoint_triggerActionIfFailed: aiHaunting2

[hiddenAction_aiHaunting2]

autoTrigger:if self.isControlledByAI() and not self.hasActiveWaypoint(type='guard')
addWaypoint_type:guard
addWaypoint_target_nearestUnit_tagged: marker
addWaypoint_target_nearestUnit_team: own
addWaypoint_target_nearestUnit_maxRange:400
clearAllWaypoints:true
addWaypoint_triggerActionIfFailed: aiHaunting3

[hiddenAction_aiHaunting3]

autoTrigger:if self.isControlledByAI() and not self.hasActiveWaypoint(type='guard')
addWaypoint_type:guard
addWaypoint_target_nearestUnit_tagged: lodestone
addWaypoint_target_nearestUnit_team: own
addWaypoint_target_nearestUnit_maxRange:200
clearAllWaypoints:true



