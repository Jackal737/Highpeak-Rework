
[core]
name: highpeakHauntingCemetery
class: CustomUnitMetadata
tags: canBurn, farm, building
price: Emerald=300
maxHp: 650
mass: 9000

displayText: Cemetery
displayDescription: "The dead are restless and know no peace..."\n\n -Slowly generates wisps over time\n -Wisps provide spirit and gazul\n -Crumbles if more than 3 cemeteries are adjacent

techLevel: 1
buildSpeed: 20s

radius: 22
footprint: -1,-1,0,0
constructionFootprint: -1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

disableAllUnitCollisions:true

explodeOnDeath:false
isBuilding: true
isBio: false
numBitsOnDeath: 0

[hiddenAction_spiritTimer]
autoTrigger: if self.customTimer(laterThanSeconds=30)
alsoTriggerAction: spiritWisps
resetCustomTimer:true
[hiddenAction_spiritWisps]
spawnUnits:highpeakHauntingWisp_1

[action_crumbling]
buildSpeed: 0s
iconImage:ROOT:\data\images\fireIcon.png
text:Crumbling
description: -Overexploitation is causing the ground to crumble\n -Getting damaged over time
displayType:infoOnly
isActive:false
isVisible:if numberOfUnitsInTeam(withTag='farm', withinRange=150, greaterThan=3)
isGuiBlinking:if numberOfUnitsInTeam(withTag='farm', withinRange=150, greaterThan=3)
autoTrigger:if numberOfUnitsInTeam(withTag='farm', withinRange=150, greaterThan=3)
spawnEffects:CUSTOM:effectWithering*5
addResourcesScaledByAIHandicaps: hp=-${core.maxHp*0.01}
[effect_effectWithering]
spawnChance:0.3
attachedToUnit: true
life: 350
alpha: 0.3
hOffset:1
xOffsetRelativeRandom:10
yOffsetRelativeRandom:10
hSpeed: 0.05
dirSpeed:0.4
dirSpeedRandom:0.3
dirOffsetRandom:360
fadeInTime:50
image: ROOT:\data\images\daze.png
priority: high
drawUnderUnits:false
scaleFrom:1.5
scaleTo: 2.5

[hiddenAction_hauntingSpirits]
autoTrigger:true
spawnEffects:CUSTOM:hauntingSpirits*1

[effect_hauntingSpirits]
fadeInTime:20
yOffsetRelative:6
xOffsetRelativeRandom:16
yOffsetRelativeRandom:8
attachedToUnit: true
life: 200
alpha: 1
scaleFrom:0.5
scaleTo: 1
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
hSpeed: 0.1
dirSpeed:1
dirOffsetRandom:360
image: ROOT:\data\images\hauntingSpirits.png
drawUnderUnits:false


[graphics]
total_frames: 1
imageScale: 1

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0.5


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 150
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.7

noneInBaseExtraPriority: 0.2

recommendedInEachBaseNum:5

