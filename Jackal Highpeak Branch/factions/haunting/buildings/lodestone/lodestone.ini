[core]
copyFrom:ROOT:\data\templates\healerEffect.template
name: highpeakHauntingLodestone
tags: normalVision, lodestone, canBurn, building, attackCorpse
displayText: Lodestone
displayDescription: "Spiritual forces are being pulled by this dark lodestone..."\n\n -Defensive building\n -Can train etheral infantry and up to 6 keepers\n -Can raise the dead\n -Anchors etheral units\n -Increases spirit limit by 5\n -Can upgrade to living lodestone
class: CustomUnitMetadata
price: Emerald=750
maxHp: 1250
armour: 0
armourMinDamageToKeep: 0
mass: 9000

borrowResourcesWhileBuilt:maxSpirit=-5

energyMax: 12
energyRegen: 0.075
energyNeedsToRechargeToFull: true

techLevel: 1
buildSpeed: 20s
radius: 30
isBio: false
isBug: false
isBuilding:true
fogOfWarSightRange: 18
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 12

footprint: -1,-1,0,0
constructionFootprint: -2,-2,1,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

exit_y:25

[action_anchorInfo]
iconImage:ROOT:\data\images\trophy.png
displayType:action
pos:0
text: Anchor
description: Passive\n -Anchor etheral units
buildSpeed: 0s
isVisible: true

[action_upgrade]
pos:1.1
isVisible: if not self.hasParent()
isLocked: if self.hasParent()
text: Awaken lodestone
unitShownInUI:highpeakHauntingLodestone
descriptionAddFromUnit:highpeakHauntingLivingLodestone_1
displayType:upgrade
price:Emerald=1500, Gazul=500, Spirit=25
allowMultipleInQueue:false
buildSpeed:60s
deleteSelf:true
spawnUnits: highpeakHauntingLivingLodestone_1(offsetDir=90)

[canBuild_Recruit]
name:setRally, highpeakHauntingInfantry_1, highpeakHauntingArcher_1, highpeakHauntingInfantry_2
pos: 0.1

[canBuild_Keeper]
name:highpeakHauntingArcher_2
isLocked: if numberOfUnitsInTeam(withTag='Keeper', greaterThan=5, factoryQueue=true)
pos:0.2

[arm_1]
x: 0
y: 11
image_end: seed.png
drawOverBody: true
image_end_teamColors:true

[hiddenAction_hauntingSpirits]
autoTrigger:true
spawnEffects:CUSTOM:hauntingSpirits*3

[effect_hauntingSpirits]
spawnChance:0.75
fadeInTime:20
hOffset:8
xOffsetRelativeRandom:3
yOffsetRelativeRandom:3
attachedToUnit: true
life: 200
alpha: 1
scaleFrom:1
scaleTo: 0
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
hSpeed: 0.1
dirSpeed:2
dirSpeedRandom:1
dirOffsetRandom:360
image: ROOT:\data\images\hauntingSpirits.png
drawUnderUnits:false

[hiddenAction_onLivingLodestone]
autoTrigger: if self.hasParent()
resourceAmount:hp
resourceAmount_setValue:${core.maxHp}

[graphics]
imageScale: 0.95
total_frames: 1
rotate_with_direction:false
teamColorsOnTurret: true
image:        base.png
image_back:        back.png
image_wreak:  back.png
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 14
turretTurnSpeed: 20
maxAttackRange: 200
shootDelay: 0.20s

[turret_1]
x: 0
y: 8
shoot_sound:ROOT:\data\soundFx\flameThrower.ogg
shoot_sound_vol:0.05
recoilOffset:3
recoilOutTime: 15
recoilReturnTime: 18
projectile:1
energyUsage: 3


[projectile_1]
directDamage:10
armourIgnoreAmount:20
life: 120
speed: 3
speedSpread:1
explodeEffect: CUSTOM:deathFog*3
buildingDamageMultiplier: 0.1
drawSize:0
initialUnguidedSpeedHeight: 1.2
gravity:0.18
shadowFrame:11
trailEffect:CUSTOM:trail
trailEffectRate:1
wobbleAmplitude: 0.7
wobbleFrequency: 0.9s

spawnProjectilesOnExplode:raiseDead

mutatorIce_ifUnitWithTags: bio
mutatorIce_addResourcesDirectHit: Freezing=1

[projectile_raiseDead]
drawSize:0
areaDamage: 0
areaRadius:30
areaDamageNoFalloff:true
armourIgnoreAmount:1000
life: 0
explodeOnEndOfLife:true
speed:1
explodeEffect:NONE
friendlyFire:true
mutatorSoupCollector_ifUnitWithTags:corpse
mutatorSoupCollector_addResourcesAreaHit:raiseDeadHaunting=1

[effect_trail]
createWhenZoomedOut: false
color:#81f7ff
image: ROOT:\data\images\trail.png
life: 30
fadeOut: true
attachedToUnit: false
fadeInTime:2
scaleFrom: 0.4
scaleTo: 0.2
alpha: 0.6
drawUnderUnits:false

[effect_deathFog]
fadeInTime:20
color:#81f7ff
attachedToUnit: false
alpha:0.5
life: 70
scaleFrom:0.7
scaleTo: 0.1
xSpeedRelativeRandom: 0.4
ySpeedRelativeRandom: 0.4
hSpeed: 0.1
image: ROOT:\data\images\smoke.png
drawUnderUnits:false

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.00001
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  0
reverseSpeedPercentage:0

[animation_idle]
onActions: idle

arm1_0s: {x:0, y:0,height:0}
arm1_3s: {x:0, y:0,height:3}

pingPong:true

[arm_8]
x: 0
y: 0
spinRate:-0.5
image_end: ROOT:\data\images\haunted.png
drawUnderAllUnits: false

[ai]

upgradedFrom:highpeakHauntingMarker