
[core]
copyFrom:ROOT:\data\templates\builderEffect.template
name: highpeakHavenWorkshop
tags: canBurn, building
class: CustomUnitMetadata
price: Emerald=1200
maxHp: 2200
mass: 9000

displayText: Workshop
displayDescription: "This is the dock workers place. They got all those crazy contraptions there... Is that a troll?"\n\n -Can build siege weapons and transports\n -Can repair machines

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,1,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:5

isBuilding: true
isBio: false
numBitsOnDeath: 5

canRepairUnitsOnlyWithTags:machine
autoRepair: true
nanoRepairSpeed: 0.1
