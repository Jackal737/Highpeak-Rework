[canBuild_siege]
name:setRally, highpeakHumanWarMachine_1, highpeakHumanWarMachine_2, highpeakHumanWarMachine_3, highpeakHavenChariot_1, highpeakHumanAirship_1
pos: 0.1
addResources: Lodging=2

[canBuild_siege2]
name:highpeakHavenInfantry_2
pos: 0.2
addResources: Lodging=5

[canBuild_ai]
name:highpeakHavenChariot_1_ai, highpeakHumanAirship_1_ai
pos: 0.2
