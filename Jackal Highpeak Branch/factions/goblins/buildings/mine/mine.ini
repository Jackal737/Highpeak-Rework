
[core]
name: highpeakGoblinMine
tags:highpeakMine, canBurn, building
class: CustomUnitMetadata
price: Emerald=250
maxHp: 2200
mass: 9000

displayText: Pump (c)
displayDescription: "Standard Gazoo co pump also known as the Pump (c)."\n\n -Slowly generate Gazoo and Emeralds \n -Can only be built on Gazul veins\n -Expires after 10 minutes

energyMax: 600
dieOnZeroEnergy:true

techLevel: 1
buildSpeed: 20s

placeOnlyOnResPool: true

radius: 16

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:30

[hiddenAction_expiration]
autoTrigger: true
addResources: energy=-1

[hiddenAction_expired]
autoTrigger: if self.energy(lessThan=11)
spawnEffects: CUSTOM:lightningShock
playSoundAtUnit:click

[effect_lightningShock]
life: 60
scaleFrom:0.6
scaleTo: 0.2
alpha:0.9
xOffsetRelativeRandom:15
yOffsetRelativeRandom:15
dirOffsetRandom:360
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 1

[hiddenAction_delete]
autoTrigger: if not numberOfUnitsInTeam(withTag='highpeakRecordTrackingAndSpawner',greaterThan=0)
deleteSelf:true

[hiddenAction_aiBoost]
autoTrigger: if self.resource(type='Gazoo',lessThan=2000)
requireConditional: if self.isControlledByAI()
addResources: Gazoo=2

[hiddenAction_gazooTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoTriggerAction: gazooLvL1
resetCustomTimer:true
[hiddenAction_gazooLvL1]
addResourcesScaledByAIHandicaps: Gazoo=10
spawnEffects:CUSTOM:oil*5, CUSTOM:produceGazoo

[effect_produceGazoo]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:26
hSpeed: 0.3
image: ROOT:\data\images\gazoo10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[effect_oil]
xOffsetRelative:-6
xSpeedRelative:-0.4
hOffset:28
alpha:2

attachedToUnit: false
life: 50
physics: true
scaleFrom:1.5
scaleTo: 0.5
xSpeedRelativeRandom: 0.6
ySpeedRelativeRandom: 0.6
hSpeed: 2
image: oil.png
drawUnderUnits:false

dirOffsetRandom:360
dirSpeedRandom:7


[graphics]
total_frames: 1
imageScale: 0.7

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\mineShadow.png
shadowOffsetX:0
shadowOffsetY:1

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 60
animation_idle_scale_start:1
animation_idle_scale_end:1.02



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.4

noneGlobalExtraPriority: 0.2

