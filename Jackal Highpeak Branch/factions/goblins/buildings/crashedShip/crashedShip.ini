[core]
copyFrom:ROOT:\data\templates\healerEffect.template
isUnrepairableUnit:true
name: highpeakGoblinCrashedShip
tags: center, normalVision, dropoff, factionGoblin, greatEmerald
displayText: Crashed ship
displayDescription: Defend your ship at all cost\n -Heal nearby units\n -Provides 12 lodging

borrowResourcesWhileBuilt:lodging=-12

class: CustomUnitMetadata
price: 0
maxHp: 10000
armour: 10
armourMinDamageToKeep: 0
mass: 3500

techLevel: 1
buildSpeed: 20s
radius: 28
isBio: false
isBug: false
isBuilding:true
fogOfWarSightRange: 18
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 12

footprint: -1,-1,0,0
constructionFootprint: -2,-2,1,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

exit_y:20

[hiddenAction_deathExplosion]
requireConditional: if not game.nukesEnabled()
autoTriggerOnEvent:destroyed
fireTurretXAtGround:death

[hiddenAction_robogoblinTimer]
autoTrigger: if self.queueSize(lessThan=1)
alsoQueueAction: robogoblin

[action_robogoblin]
unitShownInUI: highpeakGoblinBuilder_1
textAddUnitName:highpeakGoblinBuilder_1
descriptionAddFromUnit:highpeakGoblinBuilder_1
descriptionAddUnitStats:highpeakGoblinBuilder_1
buildSpeed:20s
isActive:false
canPlayerCancel:false
produceUnits:highpeakGoblinBuilder_1
pos:1.5

[effect_deathExplode]
priority:critical
attachedToUnit: false
life: 180
physics: true
scaleFrom:2.5
scaleTo: 0.6
xSpeedRelativeRandom: 12
ySpeedRelativeRandom: 12
hSpeed: 2
image: ROOT:\data\images\pixel.png
drawUnderUnits:false
color:green

[arm_1]
x: 3.5
y: 10
drawDirOffset:215
image_end: crashedSpaceShip.png
drawOverBody: true
image_end_teamColors:true

[hiddenAction_aura]
autoTrigger:true
spawnEffects: CUSTOM:aura

[effect_aura]

priority: critical
image: ROOT:\data\images\auraSummon.png
life: 200
fadeOut: true
attachedToUnit: true
scaleFrom: 0.7
scaleTo: 1.3
fadeInTime:20
drawUnderUnits:false
liveAfterAttachedDies: true
xOffsetRelative: 0
yOffsetRelative: 0
dirSpeedRandom:0.15
dirOffsetRandom:360
color:green
alpha:0.6

[canBuild_heroGoblin]
name: highpeakGoblinHero
isVisible:if self.globalTeamTags(includes='factionGoblin')
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2

[canBuild_Recruit]
name:highpeakGoblinBuilder_2
pos: 0.1
addResources: Lodging=1

[action_repairShip]
canPlayerCancel:true
iconImage: ROOT:\data\images\addon.png
iconExtraImage: ROOT:\data\images\addon.png
convertTo:highpeakGoblinSpaceShip
text: Repair
description:"All systems red... Ready for take off. Now please Sign this Corporate Accident Disclosure"\n\n
textAddUnitName:highpeakGoblinSpaceShip
descriptionAddFromUnit:highpeakGoblinSpaceShip
descriptionAddUnitStats:highpeakGoblinSpaceShip
price: Emerald=1500, Gazoo=1000
buildSpeed: 600s
highPriorityQueue: true
ai_isHighPriority:true
pos:3

[hiddenAction_alarm]
autoTriggerOnEvent: tookDamage
requireConditional:if self.customTimer(laterThanSeconds=15)
showMessageToPlayer: OUR SHIP IS UNDER ATTACK!
playSoundToPlayer:ROOT:\data\soundFx\alarm.ogg:0.3
resetCustomTimer:true

[graphics]
imageScale: 1.1
total_frames: 1
rotate_with_direction:false
teamColorsOnTurret: true
image:        base.png
image_back:        back.png
image_wreak:  back.png
image_turret: NONE
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
turretSize: 10
turretTurnSpeed: 20
maxAttackRange: 200
shootDelay: 1

[turret_death]
x: 0
y: 0
canShoot:false
invisible:true
projectile:death

[projectile_death]
spawnProjectilesOnExplode:death
areaDamage: 100000
areaRadius:500000
areaDamageNoFalloff:true
areaHitAirAndLandAtSameTime:true
areaHitUnderwaterAlways:true
armourIgnoreAmount:100
friendlyFire:only-ignoreEnemy
life: 120
speed:50
explodeEffect:shockwave, CUSTOM:deathExplode*100
drawSize:0

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.00001
moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  0
reverseSpeedPercentage:0

[arm_2]
hidden: if game.nukesEnabled()
x: 0
y: 8
image_end: halo.png
drawOverBody: true

[arm_3]
hidden: if game.nukesEnabled()
x: 0
y: 4
image_end: seed.png
drawOverBody: true

[animation_idle]
onActions: idle

arm3_0s: {x:0, y:0,height:0}
arm3_3s: {x:0, y:0,height:3}

pingPong:true