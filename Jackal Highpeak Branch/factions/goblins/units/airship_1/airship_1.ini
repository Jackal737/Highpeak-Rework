life: 100
alpha: 0.2
scaleFrom:0.4
scaleTo: 1.5
#physics: true
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
hSpeed: 0.1
image: ROOT:\data\images\smokeGazoo.png
priority: low
drawUnderUnits:false
atmospheric:true

