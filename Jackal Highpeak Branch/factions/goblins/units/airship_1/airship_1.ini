imageScale: 1
teamColorsOnTurret: true
image:        body.png
image_wreak:  ROOT:\data\images\medium_dead_wood.png
image_turret: turret.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
showTransportBar:false

animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 8
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.02
animation_idle_pingPong: true

[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 5
turretTurnSpeed: 3

maxAttackRange: 125
shootDelay: 0.20s

[turret_1]
x: 0
y: 0
shoot_sound:gun_fire
shoot_sound_vol:0.2
shoot_flame:CUSTOM:toxicSmoke*1, CUSTOM:sparks*1
shoot_light:#cdff00
recoilOffset:-1
recoilOutTime: 15
recoilReturnTime: 18
projectile:1
energyUsage: 3

[projectile_1]
mutatorShield_ifUnitWithTags:shield
mutatorShield_areaDamageMultiplier:0.35

mutatorPlate_ifUnitWithTags:plate
mutatorPlate_areaDamageMultiplier:0.25

areaDamage:40
areaRadius:15
targetGround:true
targetGround_includeTargetHeight:true
targetGroundSpread:15
armourIgnoreAmount:-8
life: 120
speed: 6
speedSpread:1
explodeEffect: NONE
buildingDamageMultiplier: 0.1
drawSize:0.5
color:#cdff00

[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xOffsetRelative: 2
xSpeedRelativeRandom: 0.6
ySpeedRelativeRandom: 0.6
hSpeed: 1
image: ROOT:\data\images\spark.png
priority: verylow

