[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakGoblinAirship_1
displayText: Zeppelin
tags:machine, normalVision, canBurn
displayDescription: -Airship\n -Lightly armed \n -Can transport units\n -Fast
class: CustomUnitMetadata
price: Emerald=450, Gazoo=500, Lodging=2
borrowResourcesWhileBuilt:Lodging=2
maxHp: 450
armour: 4
armourMinDamageToKeep: 0
mass: 1500

maxTransportingUnits:8
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
