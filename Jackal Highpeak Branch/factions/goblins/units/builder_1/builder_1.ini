
[core]
copyFrom:ROOT:\data\templates\builderEffect.template, ROOT:\data\templates\gatherer.template, ROOT:\data\templates\drowning.template, ROOT:\data\templates\unitInventory.template
name: highpeakGoblinBuilder_1
tags: infantry, normalVision, miner, builder, goblinSemiTransportable
displayText: Robogoblin
displayDescription: -Can build and repair structures\n -Can mine emeralds\n -Will Expire unless transported
class: CustomUnitMetadata
price: 0
maxHp: 50
selfRegenRate:0
armour:5
mass: 100
radius: 4
softCollisionOnAll: 6

techLevel: 1
experimental: false
buildSpeed: 15s

energyMax: 60
dieOnZeroEnergy:true

isBio: false
isBug: false
hideScorchMark: true

isBuilder: true
autoRepair: true
nanoRepairSpeed: 0.05
nanoBuildSpeed: 0.6
canRepairBuildings: true
canRepairUnits:true
canRepairUnitsOnlyWithTags:machine, building
nanoRange: 60

explodeTypeOnDeath:verysmall
numBitsOnDeath:0


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false

[hiddenAction_expiration]
autoTrigger: if not self.hasParent()
addResources: energy=-1

[hiddenAction_expired]
autoTrigger: if self.energy(lessThan=11)
spawnEffects: CUSTOM:lightningShock
playSoundAtUnit:click

[effect_lightningShock]
life: 60
scaleFrom:0.3
scaleTo: 0.1
alpha:0.9
xOffsetRelativeRandom:3
yOffsetRelativeRandom:3
dirOffsetRandom:360
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 1

[hiddenAction_startMine]
playSoundAtUnit:ROOT:\data\soundFx\timer.ogg:0.1
autoTriggerOnEvent:created
addWaypoint_type:reclaim
addWaypoint_target_nearestUnit_tagged:emeraldResource
addWaypoint_target_nearestUnit_team:neutral
addWaypoint_target_nearestUnit_maxRange:400
addWaypoint_prepend:true

[canBuild_base]
name: repair, reclaim, highpeakGoblinForge, highpeakGoblinFarm, highpeakGoblinHouse, highpeakGoblinMine, highpeakGoblinBarracks, highpeakGoblinWorkshop, highpeakGoblinTower 
pos: 1.1

[canBuild_Flodrjinai]
isVisible: if self.numberOfUnitsInAllyNotOwnTeam(withTag='factionFlodrjinai', greaterThan=0)
name: highpeakFlodrjinaiBarracks
pos: 1.1

[canBuild_campfire]
isVisible:  if numberOfUnitsInNeutralTeam(withTag='winter', greaterThan=0)
name: highpeakNeutralcampfire
pos: 1.2

[effect_lightningShock2]
spawnChance:0.25
life: 60
scaleFrom:0.6
scaleTo: 0.2
alpha:0.9
xOffsetRelativeRandom:20
yOffsetRelativeRandom:29
dirOffsetRandom:360
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 1

[effect_marker]
image: ROOT:\data\images\smokeGazoo.png
scaleFrom:0.6
scaleTo: 2
alpha:0.4

[effect_marker2]
image: ROOT:\data\images\smoke.png
color: #7eff00

[graphics]
imageScale: 0.7
total_frames: 5
showEnergyBar:false
image:        body.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\shadow.png
shadowOffsetX:1
shadowOffsetY:2

repairEffectAtTarget:CUSTOM:marker*3, CUSTOM:lightningShock2, CUSTOM:marker2*3


animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 4

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 3
animation_attack_end: 4
animation_attack_speed: 7
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true

[attack]

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 8
turretTurnSpeed: 3

maxAttackRange: 1
shootDelay: 1s

[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.05
joinsGroupFormations: true

maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  180
reverseSpeedPercentage:0

[ai]
useAsBuilder:true

[animation_repair]
onActions : repair

body_0s: {frame:2}
body_0.1s: {frame:2}
body_0.5s: {frame:4} 
body_0.8s: {frame:4}

