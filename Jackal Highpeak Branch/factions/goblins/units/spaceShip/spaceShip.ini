recoilReturnTime: 18
projectile:2

idleDir:-30

[turret_mini2]
x: 20
y: 3
copyFrom:mini1
idleDir:30
warmup:10
linkDelayWithTurret:mini1

[projectile_2]

mutatorShield_ifUnitWithTags:shield
mutatorShield_areaDamageMultiplier:0.5

mutatorPlate_ifUnitWithTags:plate
mutatorPlate_areaDamageMultiplier:0.5

color:GREEN

areaDamage:75
areaHitAirAndLandAtSameTime:true
areaRadius:15
targetGround:true
targetGround_includeTargetHeight:true
targetGroundSpread:15
#directDamage: 40
armourIgnoreAmount:-8

life: 120
speed: 4
speedSpread:0.5
image: ROOT:\data\images\magicFire.png
explodeEffect: NONE

lightColor:#cdff00

buildingDamageMultiplier: 0.25
drawSize:0.6
shadowFrame:11
trailEffect:CUSTOM:projectileTrail
trailEffectRate:1

[effect_projectileTrail]
color:#cdff00
createWhenZoomedOut: false
image: ROOT:\data\images\trail.png
life: 20
fadeOut: true
attachedToUnit: false
fadeInTime:2
scaleFrom: 0.3
scaleTo: 0.1
alpha: 0.6
drawUnderUnits:false

[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xOffsetRelative: 2
xSpeedRelativeRandom: 0.6
ySpeedRelativeRandom: 0.6
hSpeed: 1
image: ROOT:\data\images\spark.png
priority: verylow

[effect_toxicSmoke]
attachedToUnit: true
alwayStartDirAtZero:true
life: 90
alpha: 0.4
scaleFrom:0.05
scaleTo: 0.9
dirOffsetRandom:90
dirSpeed:2
xOffsetRelative: 2
xSpeedRelativeRandom: 0.08
ySpeedRelative: 0.2
hSpeed: 0.1
image: ROOT:\data\images\smokeGazoo.png
priority: low

[turret_death]
x: 0
y: 0
canShoot:false
invisible:true
projectile:death

[projectile_death]
spawnProjectilesOnExplode:death
areaDamage: 100000
areaRadius:500000
areaDamageNoFalloff:true
areaHitAirAndLandAtSameTime:true
areaHitUnderwaterAlways:true
armourIgnoreAmount:100
friendlyFire:only-ignoreEnemy
life: 120
speed:50
explodeEffect:shockwave, CUSTOM:deathExplode*100
drawSize:0

################################# Movement #################################

[movement]
movementType: AIR
moveSpeed: 0.6
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.01
joinsGroupFormations: true

targetHeightDrift:3

maxTurnSpeed: 2
turnAcceleration: 1

moveSlidingMode :false
moveIgnoringBody:true
moveSlidingDir:  100
reverseSpeedPercentage:0


################################# AI #################################

[hiddenAction_aiBoost]
autoTrigger: if self.resource(type='Emerald',lessThan=2000)
requireConditional: if self.isControlledByAI()
addResources: Emerald=10




