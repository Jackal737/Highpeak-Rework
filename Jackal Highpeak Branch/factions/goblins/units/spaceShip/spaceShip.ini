
[core]
copyFrom: ROOT:\data\templates\unitXp.template, ROOT:\data\templates\healerEffect.template
tags:machine, normalVision, center, greatEmerald, factionGoblin
name: highpeakGoblinSpaceShip
displayText: Gaztrooyer
displayDescription: -Armored battlecruiser\n-Heavily armed and armored \n-Good vs everything\n-Can transport units\n-Can train robogoblins and clone the captain\n -Can research technology\n -Heal nearby units\n -Defend at all cost\n -Provides 10 lodging

borrowResourcesWhileBuilt:lodging=-10

class: CustomUnitMetadata
price: 0
maxHp: 2000
armour:8
mass: 500000

maxTransportingUnits:6
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6
transportUnitsKeepBuiltUnits:true

energyMax: 100
energyRegen: 1
energyNeedsToRechargeToFull: true

fogOfWarSightRange:10

techLevel: 1
experimental: false
buildSpeed: 60s

radius: 27
isBio: false
isBug: false

numBitsOnDeath: 5
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 75

################################# Death #################################

[hiddenAction_deathExplosion]
requireConditional: if not game.nukesEnabled()
autoTriggerOnEvent:destroyed
fireTurretXAtGround:death


[effect_deathExplode]
priority:critical
attachedToUnit: false
life: 180
physics: true
scaleFrom:2.5
scaleTo: 0.6
xSpeedRelativeRandom: 12
ySpeedRelativeRandom: 12
hSpeed: 2
image: ROOT:\data\images\pixel.png
drawUnderUnits:false
color:green

################################# Build #################################

[canBuild_builder]
name: repair, highpeakGoblinBuilder_1
pos: 2.1

[canBuild_heroGoblin]
name: highpeakGoblinHero
isVisible:if self.globalTeamTags(includes='factionGoblin')
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2.2

################################# Techs #################################

[action_truckTech]
isVisible: if not self.globalTeamTags(includes='GobTruckTech')
iconImage:ROOT:\data\images\ranged.png
displayType:action
pos:1
text: Corporate Secrets
price: emerald=500, gazoo=750
description: Semi Treks can now transport an extra four units, and drop their trailer on death as a bunker. Monster Treks gain an enforcer.
addGlobalTeamTags: GobTruckTech
buildSpeed: 160s

################################# Graphics #################################

[effect_trail]
color:#cdff00
xOffsetRelative:-14
yOffsetRelative:-48

createWhenZoomedOut: false
priority:high

image: ROOT:\data\images\trail.png
life: 25
fadeOut: true
attachedToUnit: false
scaleFrom: 0.8
scaleTo: 0
alpha: 2
ySpeedRelative:-0.4

[effect_trail2]
color:#cdff00
xOffsetRelative:14
yOffsetRelative:-48

createWhenZoomedOut: false
priority:high

image: ROOT:\data\images\trail.png
life: 25
fadeOut: true
attachedToUnit: false
scaleFrom: 0.8
scaleTo: 0
alpha: 2
ySpeedRelative:-0.4


[graphics]
teamColorsOnTurret:true
imageScale: 1.1
total_frames: 1
showEnergyBar:false
movementEffect:CUSTOM:trail, CUSTOM:trail2
movementEffectRate:1

image:        body.png
image_wreak:  NONE
image_turret: turret.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

################################# Alarm #################################

[hiddenAction_onCreateAmmo]
requireConditional: if not game.nukesEnabled()
autoTriggerOnEvent: created
addResources: ammo=15

[hiddenAction_alarmTimer]
requireConditional: if not game.nukesEnabled()
autoTrigger: if self.ammo(lessThan=15)
addResources: ammo=1

[hiddenAction_alarm]
autoTriggerOnEvent: tookDamage
requireConditional:if self.ammo(greaterThan=14)
addResources: ammo=-15
showMessageToPlayer: OUR GAZTROOYER IS UNDER ATTACK!
playSoundToPlayer:ROOT:\data\soundFx\alarm.ogg:0.3

################################# Weapons #################################

[attack]
aimOffsetSpread:0
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 25
turretTurnSpeed: 20
turretMultiTargeting:true

maxAttackRange: 175
shootDelay: 3

[turret_1]
x: 0
y: 0
canShoot:false
invisible:true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

[turret_2]
canAttackFlyingUnits: false
x: 0
y: 3
attachedTo:1
shoot_sound:plasma_fire
shoot_sound_vol:0.05
shoot_light:#b9ff45
projectile:1
energyUsage: 7
invisible:true

[projectile_1]

sweepOffset:12
sweepSpeed:1
moveWithParent:true
instantReuseLast:true
instantReuseLast_alsoChangeTurretAim:true

areaDamage: 9
areaRadius:30
armourIgnoreAmount:100
life: 8
instant:true
explodeEffect:CUSTOM:sparks*1
drawSize:1
laserEffect:true
color:#dbff9f
lightColor:#dbff9f

[turret_mini1]
x: -20
y: 3
turnSpeed:2
size:12
delay:0.7s
shoot_sound:ROOT:\data\soundFx\energy.ogg
shoot_sound_vol:0.2
shoot_flame:CUSTOM:toxicSmoke*1, CUSTOM:sparks*1
shoot_light:#cdff00
recoilOffset:-1
