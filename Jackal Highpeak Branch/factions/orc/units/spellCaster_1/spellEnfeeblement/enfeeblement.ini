[core]
showInEditor: true
name: highpeakOrcEnfeeblement
displayText: Enfeeblement
displayDescription: -yuck
class: CustomUnitMetadata
price: 0
maxHp: 4000
armour: 999999
armourMinDamageToKeep: 0
mass: 10000
techLevel: 1
radius: 1
isBio: false
transportSlotsNeeded: 1000
isUnrepairableUnit: true
hideScorchMark: true
fogOfWarSightRange: 0
energyMax: 5
energyRegen: 0
dieOnZeroEnergy: true
explodeOnDeath:false
softCollisionOnAll: 100
disableAllUnitCollisions:true
canNotBeDirectlyAttacked:true
isUnselectable:true

[action_lifeTime]
autoTrigger: true
isVisible: false
addEnergy: -1

[hiddenAction_triggerDamage]
autoTrigger: true
fireTurretXAtGround: weakness
fireTurretXAtGround_withOffset: 0,0

[hiddenAction_triggerParticles]
autoTrigger: if self.customTimer(laterThanSeconds=10)
isVisible: false
fireTurretXAtGround: effects2
fireTurretXAtGround_withOffset: 0,10
resetCustomTimer: true

[graphics]
total_frames: 1
showEnergyBar:false
image:        spawner.png
image_wreak:  NONE
image_shadow: NONE

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 65
turretTurnSpeed: 10
shootDelay: 3
aimOffsetSpread: 0

[turret_weakness]
x: 0
y: 0
projectile: weak
canShoot: true

[turret_effects2]
x: 0
y: 0
projectile: aura
canShoot: true

[projectile_weak]
life: 0
speed: 0
frame: 0
drawSize: 0
targetGround: true
areaDamage: 0
areaRadius: 65
friendlyFire: true
buildingDamageMultiplier: 1
explodeOnEndOfLife: true
explodeEffect: NONE
areaHitAirAndLandAtSameTime: true

mutatorAcid_ifUnitWithTags: bio, magical, machine, building, boneConstruct
mutatorAcid_addResourcesAreaHit: feeble=3


[projectile_aura]
life: 600
speed: 0.0001
targetSpeed: 0.0001
targetGround: true
directDamage: 0
frame: 0
drawSize: 0
trailEffect: CUSTOM:target
trailEffectRate: 15


[effect_target]
color: red
priority:veryhigh
createWhenOffscreen: true
image: ROOT:\data\images\vision.png
life: 160
fadeInTime:50
fadeOut: true
attachedToUnit: false
scaleFrom: 1
scaleTo: 0.6
alpha: 0.5
drawUnderUnits:false
dirOffsetRandom:180
shadow:true
imageShadow: SHADOW:ROOT:\data\images\miasma.png


[effect_splatters]
alwayStartDirAtZero:true
priority:high
physics:true
physicsGravity:1.4
createWhenOffscreen: false
createWhenZoomedOut: false
image: ROOT:\data\images\magicFire.png
color:YELLOW
life: 40
fadeOut: true
attachedToUnit: false
fadeInTime: 60
scaleFrom: 0.9
scaleTo: 0
alpha: 1
drawUnderUnits:false
xSpeedAbsolute: -0.1
dirOffset:90
xOffsetRelative: 0
xOffsetRelativeRandom: 75
yOffsetRelative: 20
yOffsetRelativeRandom: 60
xSpeedAbsoluteRandom:0.6
ySpeedAbsoluteRandom:0.6

[movement]
movementType: NONE
moveSpeed: 0
targetHeight:-1
maxTurnSpeed: 0
moveSlidingMode :true
moveIgnoringBody: true