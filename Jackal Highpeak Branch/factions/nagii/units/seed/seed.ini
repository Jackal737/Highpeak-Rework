
[core]
showInEditor:true
name: highpeakNagiiSeed
displayText: Spore
displayDescription: -Can grow into a nagii
class: CustomUnitMetadata
price: 0
maxHp: 50
mass: 150
armour:0

energyMax: 100
energyStartingPercentage:0

techLevel: 1
buildSpeed: 8s

radius: 3
isBio: true
isBug: false

numBitsOnDeath: 10

disableAllUnitCollisions:true
explodeOnDeath:false

effectOnDeath:CUSTOM:fairyDust*3

[hiddenAction_growUp]
