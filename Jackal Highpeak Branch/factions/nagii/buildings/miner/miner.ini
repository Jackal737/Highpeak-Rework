
[core]
name: highpeakNagiiMiner
tags: canBurn, nagiiMiner, building
displayText: Aa'ke
displayDescription: "Aa'ke absorbs green stones and produces sap Nagii call Gaaz'oo ." \n -Slowly harvest surrounding emeralds\n -Must be build near emeralds
class: CustomUnitMetadata
price: Emerald=150
maxHp: 275
armour: 0
armourMinDamageToKeep: 0
mass: 9000
techLevel: 1
buildSpeed: 16s
radius: 16
isBio: false
isBuilding: true
softCollisionOnAll: 5

resourceReclaimMultiplier:1.2
canReclaimResources: true
nanoRangeForReclaim:75
canReclaimResourcesOnlyWithTags:EmeraldResource
canReclaimResourcesNextSearchRange:75

[hiddenAction_startMine]
autoTrigger:if not self.hasActiveWaypoint(type='reclaim')
addWaypoint_type:reclaim
addWaypoint_target_nearestUnit_tagged:emeraldResource
addWaypoint_target_nearestUnit_team:neutral
addWaypoint_target_nearestUnit_maxRange:75
addWaypoint_prepend:true

[hiddenAction_unloadEmerald]
autoTrigger:if self.hasResources(localEmerald=10)
addResources: localEmerald=-10
addResourcesScaledByAIHandicaps: Emerald=10
spawnEffects:CUSTOM:unloadEmerald
playSoundAtUnit:ROOT:\data\soundFx\sap.ogg:0.4

[effect_unloadEmerald]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\emerald10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[hiddenAction_aiBoost]
autoTrigger: if self.resource(type='Emerald',lessThan=3000)
requireConditional: if self.isControlledByAI()
addResources: Emerald=1

[effect_markerMine]
color:green
alwayStartDirAtZero:true
fadeInTime:20
xOffsetRelative:0
yOffsetRelative:0
attachedToUnit: true
life: 250
alpha: 0.3
scaleFrom:1
scaleTo: 0
hSpeed: 0.2
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
image: ROOT:\data\images\marker.png
priority: high
drawUnderUnits:false

[graphics]
total_frames: 1
imageScale: 0.9
image:        base.png
image_back:  back.png
image_wreak: NONE
image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

reclaimEffectAtTarget: CUSTOM:markerMine
reclaimEffectRate:25

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 80

[movement]
movementType: BUILDING
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
maxTurnSpeed: 0
turnAcceleration: 0

[ai]

buildPriority: 0.75
recommendedInEachBaseNum:4
noneInBaseExtraPriority: 0.3

maxEachBase: 6

[placementRule_All]
searchTags:emeraldResource
searchTeam:any
searchDistance:75
excludeIncompleteBuildings: true
excludeNonBuildings: true
minCount: 1
blocksPlacement: true
checkEachTile: false
cannotPlaceMessage: Must be near an emerald deposit