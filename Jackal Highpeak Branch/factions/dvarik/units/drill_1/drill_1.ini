[core]
copyFrom: ROOT:\data\templates\unitXp.template, ROOT:\data\templates\blackIronUpgrades.template
name: highpeakDvarikDrill_1
displayText: Echidna
tags:machine, normalVision
displayDescription: -Machine\n -Can mine emeralds faster\n -Can garrison a unit
class: CustomUnitMetadata
price: Emerald=225, Gazul=150, Lodging=1
borrowResourcesWhileBuilt:Lodging=1

maxHp: 200
armour: 12
armourMinDamageToKeep: 0
mass: 3000

maxTransportingUnits:1
transportUnitsRequireTag:infantry, small
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6

techLevel: 1
buildSpeed: 16s
radius: 12
softCollisionOnAll: 25
isBio: false
isBug: false
fogOfWarSightRange: 18
hideScorchMark: false
selfRegenRate:0

resourceReclaimMultiplier:1.34
canReclaimResources: true
nanoRangeForReclaim:2
nanoRangeForReclaimIsMelee:true
canReclaimResourcesOnlyWithTags:EmeraldResource
canReclaimResourcesNextSearchRange:10000



[action_moveToUnload]
isVisible:if self.hasResources(localFood=10)
text: Unload
displayType:action
pos:0
buildSpeed:0

autoTrigger: if (self.hasActiveWaypoint(type='reclaim') and self.hasResources(localEmerald=50))
addWaypoint_type: touchTarget
addWaypoint_prepend: true
addWaypoint_target_nearestUnit_tagged: dropoff
addWaypoint_target_nearestUnit_team: own
addWaypoint_triggerActionIfFailed: findFailed

[hiddenAction_findFailed]
clearActiveWaypoint: true

[hiddenAction_unload]
autoTriggerOnEvent: touchTargetSuccess
alsoTriggerAction: unloadEmerald

[hiddenAction_unloadEmerald]
requireConditional:if self.hasResources(localEmerald=10)
addResources: localEmerald=-50
addResourcesScaledByAIHandicaps: Emerald=50
spawnEffects:CUSTOM:unloadEmerald*5

[hiddenAction_dvarLegsTechTrigger]
autoTrigger:if self.globalTeamTags(includes='dvarikLegsTech') and not self.tags(includes='DvarLegsTech')
setUnitStats: moveSpeed+=${movement.moveSpeed * 0.1}
temporarilyAddTags: DvarLegsTech

[effect_unloadEmerald]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\emerald10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2


[effect_marker]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xOffsetRelativeRandom: 12
yOffsetRelativeRandom: 8
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
color:GREEN
image: ROOT:\data\images\pixel.png
drawUnderUnits:false

[effect_markerMine]
alwayStartDirAtZero:true

fadeInTime:10
dirOffsetRandom:360
xOffsetRelativeRandom:15
yOffsetRelativeRandom:15
attachedToUnit: true
life: 30
alpha: 0.4
scaleFrom:1
scaleTo: 3
hSpeed: 0.1
xSpeedRelativeRandom:0.14
ySpeedRelativeRandom:0.14
image: ROOT:\data\images\smoke.png
priority: high
drawUnderUnits:false
alsoPlaySound:ROOT:\data\soundFx\flameThrower.ogg:0.05

[arm_1]
x: 0
y: 10
drawOverBody:false

[arm_2]
x: 0
y: 6
drawOverBody:false
image_end:  turret.png

[hiddenAction_smoke]
autoTrigger:true
spawnEffects:CUSTOM:smoke*3

[effect_smoke]
xOffsetRelative:-8
yOffsetRelative:-13
attachedToUnit: false
life: 150
alpha: 0.5
scaleFrom:0.3
scaleTo: 1.6
xSpeedRelativeRandom: 0.1
ySpeedRelativeRandom: 0.1
hSpeed: 0.1
image: ROOT:\data\images\smoke.png
priority: low
drawUnderUnits:false
atmospheric:true

[hiddenAction_charge]
autoTrigger:if self.isMoving()
fireTurretXAtGround: charge
fireTurretXAtGround_withOffset:0,25
[turret_charge]
x: 0
y: 0
size:0
canShoot:false
invisible: true
projectile: charge
turnSpeed: 40
[projectile_charge]
life: 140
speed: 10
drawSize: 0
targetGround:true
explodeEffect:NONE
deflectionPower: -1
areaDamage: 30
areaRadius: 45
buildingDamageMultiplier:0
mutator1_ifUnitWithTags:shield
mutator1_areaDamageMultiplier:0.5
mutator2_ifUnitWithTags:cavalry
mutator2_areaDamageMultiplier:0

[graphics]
total_frames: 1
imageScale: 0.7
teamColorsOnTurret: true
image:        body.png
image_wreak:  ROOT:\data\images\medium_dead_wood.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:2
showTransportBar:false

reclaimEffectAtTarget: CUSTOM:markerMine, CUSTOM:marker*2
reclaimEffectRate:20

movementEffect:CUSTOM:smoke*2
movementEffectRate:10

animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 10
animation_moving_scale_start:1
animation_moving_scale_end:1.01

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 15
animation_idle_scale_start:1
animation_idle_scale_end:1.01

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
isFixedFiring: true
turretSize: 4
turretTurnSpeed: 3

maxAttackRange: 1
shootDelay: 1s

[turret_1]
x:0
y:0

[attachment_1]
x: 0
y: -1
idleDir:0
canBeAttackedAndDamaged:false
keepAliveWhenParentDies:true
setDrawLayerOnTop:true
addTransportedUnits:true
rotateWithParent:true

[leg_1]
x: -8
y: 6
attach_x: -5
attach_y: 4
rotateSpeed:100
moveSpeed: 2
resetAngle:5
heightSpeed: 1
dust_effect: true
holdDisMin: 5
holdDisMax: 15
hardLimit: 12
holdDisMin_maxMovingLegs:1
hold_moveOnlyIfFurthest:true
estimatingPositionMultiplier:0.54
endDirOffset:0
draw_foot_on_top:true
image_leg:  leg.png
image_foot:  foot.png

[leg_2]
x: 8
y: 6
attach_x: 5
attach_y: 4
copyFrom: 1

endDirOffset:0

[leg_3]
x: 0
y: -8
attach_x: 0
attach_y: 0
copyFrom: 1

endDirOffset:180


[movement]
movementType: OVER_CLIFF
moveSpeed: 0.7
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 1.5
turnAcceleration: 0.75
moveSlidingMode :true
moveIgnoringBody:false
moveSlidingDir:  181
reverseSpeedPercentage:0

[ai]
useAsBuilder:true

[animation_mine]
onActions : reclaim

arm2_0s: {y:0}
arm2_0.1s: {y:1}