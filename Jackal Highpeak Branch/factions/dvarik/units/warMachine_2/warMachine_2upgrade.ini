[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakDvarikwarMachine_2upgrade
displayText: Ferreus Talpa
tags:machine, normalVision, plate, large
displayDescription: -Ultimate Dvarik war machine\n -Very well armed and armored\n -Can load and shoot lava shells \n -Trample damage while it moves \n -Plated\n -Good vs everything
class: CustomUnitMetadata
price: Emerald=1500, Gazul=500, Lodging=8
borrowResourcesWhileBuilt:Lodging=8

maxHp: 2750
armour: 25
armourMinDamageToKeep: 0
mass: 10000

transportSlotsNeeded:8

energyMax: 2.5
energyRegen: 0.009
energyNeedsToRechargeToFull: true

techLevel: 1
buildSpeed: 45s
radius: 24
isBio: false
isBug: false
fogOfWarSightRange: 18
hideScorchMark: false
selfRegenRate:0
softCollisionOnAll: 12

################################# Information #################################

[action_fire]
iconImage:ROOT:\data\images\fireIcon.png
displayType:action
pos:1
text: Fire
description: Passive\n -Can set buildings on fire, dealing damage over time
buildSpeed: 0s
isVisible: true


[action_plated]
iconImage:ROOT:\data\images\plated.png
displayType:action
pos:1
text: Plated
description: Passive\n -This unit is extremely resistant to small projectiles
buildSpeed: 0s
isVisible: true

[action_unstoppable]
iconImage:ROOT:\data\images\bulldozerIconClean.png
displayType:action
pos:1
text: Unstoppable Force
description: Passive\n -This unit may not be stunned, slowed, or confused in any way
buildSpeed: 0s
isVisible: if self.tags(includes='Unstoppable')



################################# Abilities #################################

[hiddenAction_charge]
autoTrigger:if self.isMoving()
fireTurretXAtGround: charge
fireTurretXAtGround_withOffset:0,50

[action_mortar]
ai_isDisabled:true
displayRemainingStockpile: true
isLocked: if self.ammo(lessThan=1)
isLockedMessage: Out of ammo
playSoundAtUnit: cannon_firing
iconImage:ROOT:\data\images\fireIcon.png
displayType: action
text: Mortar shot
description: -Shoot a massive fireball\n -Deal 400 fire damage at target location and burn structures for 10 seconds\n -Friendly fire
price: ammo=1
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile:mortar
buildSpeed: 2s
addActionCooldownTime:15s
pos:0
allowMultipleInQueue:false
whenBuilding_rotateTo_aimAtActionTarget:true
#whenBuilding_rotateTo_rotateTurretX:mortar
whenBuilding_cannotMove:true

[action_buildShell]
ai_isDisabled:true
iconImage:ROOT:\data\images\addon.png
displayType:action
price:  BlackIron=350
text: Load shell
description:Load magma shell\n -Maximum capacity of 3 shells\n -Machine must remain stationary during process
buildSpeed: 25s
pos: 0
isActive:if self.ammoIncludingQueued(lessThan=3)
addResources: ammo=1
whenBuilding_cannotMove:true

[action_blackCladding]
iconImage:ROOT:\data\images\platedPlus.png
displayType:action
isVisible: true
isLocked: if self.resource(type='blackCladdingLayer')>=5
isLockedMessage: Maximum 5 layers
allowMultipleInQueue:false
whenBuilding_cannotMove:true
ai_isDisabled:true
price: BlackIron=475
addResources: blackCladdingLayer=1
setUnitStats: maxHp+=250, hp+=250, moveSpeed-=${ movement.moveSpeed * 0.03 }
text: Black Cladding
description: -Use Black Iron ingots to increase hp by 250\n -New layers of cladding slow down the unit\n -Maximum 5 layers
buildSpeed: 35s
pos: 0.5
spawnEffects: CUSTOM:blackIronUpgrade

[action_bulldozer]
iconImage:ROOT:\data\images\bulldozerIcon.png
displayType:action
isVisible: if not self.tags(includes='bulldozer')
allowMultipleInQueue:false
whenBuilding_cannotMove:true
ai_isDisabled:true
price: BlackIron=500
temporarilyAddTags:bulldozer
text: Bulldozer
description: -Use Black Iron ingots to install bulldozer plate\n -Increases charge damage
buildSpeed: 90s
pos: 0.5
spawnEffects: CUSTOM:blackIronUpgrade

[hiddenAction_dvarLegsTechTrigger]
autoTrigger:if self.globalTeamTags(includes='dvarikLegsTech') and not self.tags(includes='DvarLegsTech')
setUnitStats: moveSpeed+=${movement.moveSpeed * 0.1}
temporarilyAddTags: DvarLegsTech, Unstoppable

