[core]
copyFrom: ROOT:\data\templates\unitXp.template
name: highpeakDvarikwarMachine_1
displayText: Ascio testudo
tags:machine, normalVision, large
displayDescription: -Large war machine\n -Well armed and armored\n -Fire attack\n -Trample damage while it moves\n -Plated\n -Good vs everything
class: CustomUnitMetadata
price: Emerald=750, Gazul=450, Lodging=3
borrowResourcesWhileBuilt:Lodging=3

maxHp: 600
armour: 18
armourMinDamageToKeep: 1
mass: 3000

transportSlotsNeeded:5

techLevel: 1
buildSpeed: 30s
radius: 17
isBio: false
isBug: false
fogOfWarSightRange: 18
hideScorchMark: false
selfRegenRate:0
softCollisionOnAll: 12

################################# Information #################################

[action_dvarikPlated]
iconImage:ROOT:\data\images\plated.png
displayType:action
pos:1
text: Plated
description: Passive\n -This unit is extremely resistant to small projectiles
buildSpeed: 0s
isVisible: if self.tags(includes='plate')

[action_dvarikShield]
iconImage:ROOT:\data\images\shield.png
displayType:action
pos:1
text: Shield
description: Passive\n -This unit is resistant to small projectiles
buildSpeed: 0s
isVisible: if self.tags(includes='shield')

[action_fire]
iconImage:ROOT:\data\images\fireIcon.png
displayType:action
pos:1
text: Fire
description: Passive\n -Can set buildings on fire, dealing damage over time
buildSpeed: 0s
isVisible: true

[action_unstoppable]
iconImage:ROOT:\data\images\bulldozerIconClean.png
displayType:action
pos:1
text: Unstoppable Force
description: Passive\n -This unit may not be stunned, slowed, or confused in any way
buildSpeed: 0s
isVisible: if self.tags(includes='Unstoppable')

################################# Abilities #################################

[hiddenAction_smoke]
autoTrigger:true
spawnEffects:CUSTOM:smoke*3

[action_blackCladding]
iconImage:ROOT:\data\images\platedPlus.png
displayType:action
isVisible: true
isLocked: if self.resource(type='blackCladdingLayer')>=5
isLockedMessage: Maximum 5 layers
allowMultipleInQueue:false
whenBuilding_cannotMove:true
ai_isDisabled:true
price: BlackIron=150
addResources: blackCladdingLayer=1
setUnitStats: maxHp+=50, hp+=50, moveSpeed-=${ movement.moveSpeed * 0.03 }
text: Black Cladding
description: -Use Black Iron ingots to increase hp by 50\n -New layers of cladding slow down the unit\n -Unit becomes Shielded at 2 layers, and Plated at 4 layers\n -Maximum 5 layers
buildSpeed: 20s
pos: 0.5
spawnEffects: CUSTOM:blackIronUpgrade

[action_bulldozer]
iconImage:ROOT:\data\images\bulldozerIcon.png
displayType:action
isVisible: if not self.tags(includes='bulldozer')
allowMultipleInQueue:false
whenBuilding_cannotMove:true
ai_isDisabled:true
price: BlackIron=350
temporarilyAddTags:bulldozer
text: Bulldozer
description: -Use Black Iron ingots to install bulldozer plate\n -Increases charge damage
buildSpeed: 45s
pos: 0.5
spawnEffects: CUSTOM:blackIronUpgrade

[hiddenAction_claddingShield]
autoTrigger: if self.resource(type='blackCladdingLayer')>=2 and not (self.tags(includes='shield') or self.tags(includes='plate'))
temporarilyAddTags: shield

[hiddenAction_claddingPlate]
autoTrigger: if self.resource(type='blackCladdingLayer')>=4 and not self.tags(includes='plate')
temporarilyAddTags: plate
temporarilyRemoveTags: shield

[hiddenAction_dvarLegsTechTrigger]
autoTrigger:if self.globalTeamTags(includes='dvarikLegsTech') and not self.tags(includes='DvarLegsTech')
setUnitStats: moveSpeed+=${movement.moveSpeed * 0.1}
temporarilyAddTags: DvarLegsTech, Unstoppable
pos:0.6

################################# Graphics #################################

[graphics]
total_frames: 1
imageScale: 0.9
teamColorsOnTurret: true
image:        body2.png
image_wreak:  ROOT:\data\images\medium_dead_wood.png
image_turret: mainTurret2.png
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:3
showTransportBar:false

movementEffect:CUSTOM:smoke*2
movementEffectRate:10

animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 10
animation_moving_scale_start:1
animation_moving_scale_end:1.01

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 15
animation_idle_scale_start:1
animation_idle_scale_end:1.01

[effect_trail]
atmospheric:true
createWhenZoomedOut: false
color:#ff4e00
image: ROOT:\data\images\trail.png
life: 90
fadeOut: true
attachedToUnit: false
fadeInTime:2
scaleFrom: 0.4
scaleTo: 0.3
alpha: 0.6
drawUnderUnits:false

[effect_smoke]
xOffsetRelative:-12
yOffsetRelative:-13
attachedToUnit: false
life: 150
alpha: 0.5
scaleFrom:0.3
scaleTo: 1.6
xSpeedRelativeRandom: 0.1
ySpeedRelativeRandom: 0.1
hSpeed: 0.1
image: ROOT:\data\images\smoke.png
priority: low
drawUnderUnits:false
atmospheric:true



[effect_blackIronUpgrade]
alsoPlaySound:ROOT:\data\soundFx\equipWeapon.ogg:0.15
fadeInTime:10
alwayStartDirAtZero:true
attachedToUnit: true
life: 30
alpha: 1
image: ROOT:\data\images\upgrade.png
priority: high
drawUnderUnits:true
scaleFrom:0.6
scaleTo: 1.4



################################# Weapons #################################

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring:true
aimOffsetSpread:0
turretSize: 16
turretTurnSpeed: 0
maxAttackRange: 180
shootDelay: 1.5s

[turret_1]
x:0
y:2
shoot_flame:small
shoot_sound: ROOT:\data\soundFx\flameThrower.ogg
shoot_sound_vol:0.25
recoilOffset: -3
recoilOutTime: 4
recoilReturnTime: 18
projectile:spawner

[projectile_spawner]
spawnProjectilesOnCreate:1*7
life: 0
speed: 1
drawSize:0
directDamage:0

[projectile_1]
mutatorShield_ifUnitWithTags:shield
mutatorShield_areaDamageMultiplier:0.5

mutatorPlate_ifUnitWithTags:plate
mutatorPlate_areaDamageMultiplier:0.25

areaDamage:25
armourIgnoreAmount:5
areaHitAirAndLandAtSameTime:true
areaRadius:30
targetGround:true
targetGround_includeTargetHeight:true
targetGroundSpread:15
life: 120
speed: 3
speedSpread:1
image: ROOT:\data\images\ember.png
buildingDamageMultiplier: 1
drawSize:0.7
shadowFrame:11
trailEffect:CUSTOM:trail
trailEffectRate:1

initialUnguidedSpeedHeight: 1
gravity:0.18

wobbleAmplitude: 0.3
wobbleFrequency: 0.3s

mutatorFire_ifUnitWithTags: canBurn
mutatorFire_addResourcesAreaHit: Fire=5



[hiddenAction_charge]
autoTrigger:if self.isMoving()
fireTurretXAtGround: charge
fireTurretXAtGround_withOffset:0,50

[turret_charge]
x: 0
y: 0
size:0
canShoot:false
invisible: true
projectile: charge
turnSpeed: 40

[projectile_charge]
life: 140
speed: 10
drawSize: 0
targetGround:true
explodeEffect:NONE
deflectionPower: -1
areaDamage: 75
areaRadius: 35
buildingDamageMultiplier:0
mutator1_ifUnitWithTags:shield
mutator1_areaDamageMultiplier:0.5
mutator2_ifUnitWithTags:cavalry
mutator2_areaDamageMultiplier:0



[hiddenAction_bulldozerCharge]
autoTrigger:if self.isMoving() and self.tags(includes='bulldozer')
fireTurretXAtGround: bulldozerCharge
fireTurretXAtGround_withOffset:0,50

[turret_bulldozerCharge]
x: 0
y: 0
size:0
canShoot:false
invisible: true
projectile: bulldozerCharge
turnSpeed: 40

[projectile_bulldozerCharge]
life: 140
speed: 10
drawSize: 0
targetGround:true
explodeEffect:NONE
deflectionPower: -1
areaDamage: 35
areaRadius: 45
buildingDamageMultiplier:1
mutator1_ifUnitWithTags:shield
mutator1_areaDamageMultiplier:0.5
mutator2_ifUnitWithTags:cavalry
mutator2_areaDamageMultiplier:0

################################# Limbs #################################

[leg_1]
x: -12
y: 10
attach_x: -4
attach_y: 10
rotateSpeed:100
moveSpeed: 2
resetAngle:5
heightSpeed: 1
dust_effect: false
holdDisMin: 5
holdDisMax: 15
hardLimit: 15
holdDisMin_maxMovingLegs:1
hold_moveOnlyIfFurthest:true
estimatingPositionMultiplier:0.54
endDirOffset:0
draw_foot_on_top:true
image_leg:  leg2.png
image_foot:  foot2.png

[leg_2]
x: 12
y: 10
attach_x: 4
attach_y: 10
copyFrom: 1

endDirOffset:0

[leg_3]
x: -10
y: -10
attach_x: -4
attach_y: -10
copyFrom: 1

endDirOffset:180

[leg_4]
x: 10
y: -10
attach_x: 4
attach_y: -10
copyFrom: 1

endDirOffset:180

[arm_1]
hidden: if not self.tags(includes='bulldozer')
x: 0
y: 21
drawOverBody:true
image_end:  ROOT:\data\images\bulldozer.png

################################# Movement #################################

[movement]
movementType: OVER_CLIFF
moveSpeed: 0.5
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 1
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:false
moveSlidingDir:  181
reverseSpeedPercentage:0