initialUnguidedSpeedHeight: 1
gravity:0.18

mutatorFire_ifUnitWithTags: canBurn
mutatorFire_addResourcesDirectHit: Fire=5



[hiddenAction_charge]
autoTrigger:if self.isMoving()
fireTurretXAtGround: charge
fireTurretXAtGround_withOffset:0,50

[turret_charge]
x: 0
y: 0
size:0
canShoot:false
invisible: true
projectile: charge
turnSpeed: 40

[projectile_charge]
