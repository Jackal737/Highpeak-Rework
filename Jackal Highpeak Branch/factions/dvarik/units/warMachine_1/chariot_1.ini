recoilReturnTime: 18
projectile:1

[projectile_1]
lightColor:#ff7200
directDamage:60
armourIgnoreAmount:5
life: 200
speed: 4
image: ROOT:\data\images\ember.png
buildingDamageMultiplier: 1.5
drawSize:0.9
shadowFrame:11
trailEffect:CUSTOM:trail
trailEffectRate:1

wobbleAmplitude: 0.5
