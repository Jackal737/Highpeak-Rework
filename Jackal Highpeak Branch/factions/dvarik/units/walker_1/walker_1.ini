attach_y: 4
copyFrom: 1

endDirOffset:0

[leg_3]
x: 0
y: -10
attach_x: 0
attach_y: -2
copyFrom: 1

endDirOffset:180

[arm_9]
hidden: if not self.tags(includes='bulldozer')
x: 0.5
y: 16
drawOverBody:true
image_end:  ROOT:\data\images\bulldozer.png

################################# Movement #################################

[movement]
movementType: OVER_CLIFF
moveSpeed: 1.4
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 0.8
turnAcceleration: 0.5
moveSlidingMode :true
moveIgnoringBody:false
moveSlidingDir:  181
reverseSpeedPercentage:0