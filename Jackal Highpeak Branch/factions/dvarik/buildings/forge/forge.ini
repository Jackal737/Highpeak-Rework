
[core]
name: highpeakDvarikForge
tags: highpeakForge, canSellTrophy, building, dropoff
class: CustomUnitMetadata
price: Emerald=375
maxHp: 3000
armour: 5
mass: 9000

displayText: Fortification
displayDescription: "Dvar steel is impenetrable."\n\n -Can barter resources\n-Resource dropoff\n -Can load troops for protection\n -Well armored

techLevel: 1
buildSpeed: 15s

radius: 30
footprint: -1,-1,0,0
constructionFootprint: -1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

maxTransportingUnits:6
transportUnitsRequireTag:infantry, small
transportUnitsUnloadDelayBetweenEachUnit:25

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:30

################################# Abilities #################################

[action_produceGazul]
ai_isDisabled:true
price: Emerald=1000
addResources: Gazul=550
text: Barter for Gazul
description: -Recieve 550 Gazul for 1000 Emerald
buildSpeed: 10s
pos: 0.1



[action_produceEmerald]
ai_isDisabled:true
price: Gazul=1000
addResources: Emerald=550
text: Barter for emeralds
description: -Recieve 550 Emerald for 1000 Gazul
buildSpeed: 10s
pos: 0.2



[action_reinforce]
ai_isDisabled:true
price: BlackIron=250
text: Black Cladding
description: -Use Black Iron to reinforce this structure\n -Increases health
iconImage:ROOT:\data\images\platedPlus.png
displayType:action
isVisible: true
isLocked: if self.tags(includes='Reinforced')
isLockedMessage: Can only reinforce once
temporarilyAddTags: Reinforced
setUnitStats: maxHp+=1000, hp+=1000
buildSpeed: 45s
spawnEffects: CUSTOM:blackIronUpgrade
pos: 0.3



[hiddenAction_reinforceTech]
autoTrigger: if self.globalTeamTags(includes='dvarikBuildingTech') and not self.tags(includes='reinforced')
temporarilyAddTags: reinforced
setUnitStats: hp+=${core.maxHp*0.25}, maxHp+=${core.maxHp*0.25}



[hiddenAction_smoke]
autoTrigger:true
spawnEffects:CUSTOM:smoke*3

################################# Graphics #################################

[graphics]
total_frames: 1
imageScale: 0.8

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:1
showTransportBar: true

[effect_blackIronUpgrade]
alsoPlaySound:ROOT:\data\soundFx\equipWeapon.ogg:0.15
fadeInTime:10
alwayStartDirAtZero:true
attachedToUnit: true
life: 30
alpha: 1
image: ROOT:\data\images\upgrade.png
priority: high
drawUnderUnits:true
scaleFrom:0.6
scaleTo: 1.4

################################# Weapons #################################

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s

[effect_smoke]
xOffsetRelative:7
yOffsetRelative:11
attachedToUnit: false
life: 400
alpha: 0.3
scaleFrom:0.5
scaleTo: 2
#physics: true
xSpeedRelativeRandom: 0.07
ySpeedRelativeRandom: 0.07
hSpeed: 0.1
image: ROOT:\data\images\smoke.png
priority: low
drawUnderUnits:false
atmospheric:true
fadeInTime:40

################################# Movement #################################

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.6

noneGlobalExtraPriority: 0.2

maxEachBase: 1