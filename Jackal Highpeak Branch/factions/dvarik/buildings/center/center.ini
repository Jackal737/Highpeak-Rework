
[core]
name: highpeakDvarikCenter
tags: center, building, dropoff
class: CustomUnitMetadata
price: Emerald:750
maxHp: 3500
mass: 9000

displayText: Ministerium
displayDescription: "The Dvar bureaucracy of war is implacable"\n\n -Provides 14 lodging\n-Can train quartermasters\n -Can garrison quartermasters\n-Resource dropoff

borrowResourcesWhileBuilt:lodging=-14

techLevel: 1
buildSpeed: 15s

radius: 60
footprint: -2,-2,2,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

maxTransportingUnits:8
transportUnitsRequireTag:builder
transportUnitsKillOnDeath:false

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:25
exit_moveAwayAmount:40

[canBuild_builder]
name: setRally, highpeakDvarikBuilder_1
pos: 2.1
addResources: Lodging=1

[canBuild_hero]
name: highpeakDvarikHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2

[hiddenAction_reinforceTech]
autoTrigger: if self.globalTeamTags(includes='dvarikBuildingTech') and not self.tags(includes='reinforced')
temporarilyAddTags: reinforced
setUnitStats: hp+=${core.maxHp*0.25}, maxHp+=${core.maxHp*0.25}

[graphics]
total_frames: 1
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0
shadowOffsetY:0

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.55

noneInBaseExtraPriority: 0.25

maxEachBase: 1