
[core]
name: highpeakDvarikHouse
tags: building, house
class: CustomUnitMetadata
price: Emerald=400
maxHp: 2000
mass: 9000

displayText: Villa
displayDescription: "Only upstanding Dvar citizens are awarded such quarters"\n\n -Provides 10 lodging

techLevel: 1
buildSpeed: 10s

borrowResourcesWhileBuilt:lodging=-10

radius: 30
footprint: -1,-1,0,0
constructionFootprint: -1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:25

[hiddenAction_reinforceTech]
autoTrigger: if self.globalTeamTags(includes='dvarikBuildingTech') and not self.tags(includes='reinforced')
temporarilyAddTags: reinforced
setUnitStats: hp+=${core.maxHp*0.25}, maxHp+=${core.maxHp*0.25}

[graphics]
total_frames: 1
imageScale: 0.75

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0
shadowOffsetY:0




[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.5

noneGlobalExtraPriority: 0.2

maxEachBase: 5

maxGlobal: 20