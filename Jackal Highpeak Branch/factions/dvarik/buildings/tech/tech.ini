
[core]
name: highpeakDvarikTech
tags: building, house
class: CustomUnitMetadata
price: Emerald=500, Gazul=250
maxHp: 2500
mass: 9000

displayText: Manufactory
displayDescription: "Creating the finest Dvar weaponry takes ample time."\n\n -Unlocks certain units\n-Can research upgrades

techLevel: 1
buildSpeed: 10s

radius: 30
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:5

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:25

################################# Abilities #################################

[hiddenAction_reinforceTech]
autoTrigger: if self.globalTeamTags(includes='dvarikBuildingTech') and not self.tags(includes='reinforced')
temporarilyAddTags: reinforced
setUnitStats: hp+=${core.maxHp*0.25}, maxHp+=${core.maxHp*0.25}

################################# Techs #################################

[action_machineTech]
isVisible: if not self.globalTeamTags(includes='dvarikLegsTech')
iconImage:ROOT:\data\images\ranged.png
displayType:action
pos:1
text: Powerful Joints
price: emerald=700, gazul=600
description: All Dvarik walkers gain increased move and turn speed. Testudo and Magna Talpa become Unstoppable.
addGlobalTeamTags: dvarikLegsTech
buildSpeed: 120s

[action_buildingTech]
isVisible: if not self.globalTeamTags(includes='dvarikBuildingTech')
iconImage:ROOT:\data\images\ranged.png
displayType:action
pos:1
text: Reinforced Foundations
price: emerald=750, gazul=300
description: Dvarik structures gain additional health.
addGlobalTeamTags: dvarikBuildingTech
buildSpeed: 90s

[graphics]
total_frames: 1
imageScale: 1.3

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:0
shadowOffsetY:0



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.5

noneGlobalExtraPriority: 0.2

maxEachBase: 5

maxGlobal: 20