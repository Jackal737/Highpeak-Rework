
[core]
name: highpeakMine
tags:highpeakMine, canBurn, building, mine
class: CustomUnitMetadata
price: Emerald=250
maxHp: 2200
mass: 9000

displayText: Mine
displayDescription: "The Emerald keeps us alive but Gazul makes us thrive."\n\n -Generates Gazul\n -Can only be built on Gazul veins

techLevel: 1
buildSpeed: 20s

placeOnlyOnResPool: true

radius: 16

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:30

[hiddenAction_spawnin]
requireConditional: if self.isControlledByAi()
autoTriggerOnEvent: created
addResources: emerald=-350

[hiddenAction_reinforceTech]
autoTrigger: if self.globalTeamTags(includes='dvarikBuildingTech') and not self.tags(includes='reinforced')
temporarilyAddTags: reinforced
setUnitStats: hp+=${core.maxHp*0.25}, maxHp+=${core.maxHp*0.25}

[hiddenAction_delete]
autoTrigger: if not numberOfUnitsInTeam(withTag='highpeakRecordTrackingAndSpawner',greaterThan=0)
deleteSelf:true

[hiddenAction_gazulTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoTriggerAction: gazulLvL1
resetCustomTimer:true
[hiddenAction_gazulLvL1]
addResourcesScaledByAIHandicaps: Gazul=10
spawnEffects:CUSTOM:produceGazul

[effect_produceGazul]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\gazul10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2


[graphics]
total_frames: 1
imageScale: 0.9

image:        ROOT:\data\images\mine.png
image_back:  ROOT:\data\images\mineBack.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:ROOT:\data\images\mineShadow.png
shadowOffsetX:0
shadowOffsetY:1



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.4

noneGlobalExtraPriority: 0.2

