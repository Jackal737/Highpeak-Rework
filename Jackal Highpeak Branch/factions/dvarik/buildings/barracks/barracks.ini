
[core]
name: highpeakDvarikBarracks
tags: highpeakbarracks, building
class: CustomUnitMetadata
price: Emerald=500
maxHp: 2500
mass: 9000

displayText: Quarters
displayDescription: "Standard military quarters. The amenities are ... adequate... as expected."\n\n -Can train Infantry units

techLevel: 1
buildSpeed: 20s

radius: 30
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5


exit_y:35

[canBuild_Recruit]
name:setRally, highpeakDvarikInfantry_1, highpeakDvarikInfantry_2,highpeakDvarikArcher_1, highpeakDvarikArcher_2, highpeakDvarikInfantry_3
pos: 0.1
addResources: Lodging=1

[hiddenAction_reinforceTech]
autoTrigger: if self.globalTeamTags(includes='dvarikBuildingTech') and not self.tags(includes='reinforced')
temporarilyAddTags: reinforced
setUnitStats: hp+=${core.maxHp*0.25}, maxHp+=${core.maxHp*0.25}

[graphics]
total_frames: 1
imageScale: 0.8

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:2



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.55

noneInBaseExtraPriority: 0.2

maxEachBase: 2

