
[core]
name: highpeakLonguiFarm
class: CustomUnitMetadata
tags: canBurn, farm, building, foodResource, resource
price: Emerald=250
maxHp: 600
mass: 9000

displayText: Frog Farm
displayDescription: "Sustenance brings strenght, want some stir fried spicy frog legs?"\n\n -Provides food to gather\n -Slowly gathers itself over time\n -Must be build near dropoff buildings

techLevel: 1
buildSpeed: 8s

radius: 22
footprint: -1,-1,0,0
constructionFootprint: -1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

disableAllUnitCollisions:true

explodeOnDeath:false
isBuilding: true
isBio: false
numBitsOnDeath: 0

[hiddenAction_onCreate]
autoTriggerOnEvent: completeAndActive
convertTo: highpeakLonguiFarmReady


[graphics]
total_frames: 1
imageScale: 1.1

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0.5


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 1
shootDelay: 2s

[hiddenAction_spawnIn]
requireConditional: if self.isControlledByAi()
autoTriggerOnEvent: created
setBuilt: 0
addResources: emerald=-250



[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1


[ai]

buildPriority: 0.2

noneInBaseExtraPriority: 0.2

recommendedInEachBaseNum: 5
recommendedInEachBasePriorityIfUnmet: 0.4

[placementRule_All]
searchTags:dropoff
searchTeam:own
searchDistance:100
excludeIncompleteBuildings: true
excludeNonBuildings: true
minCount: 1
blocksPlacement: true
checkEachTile: false
cannotPlaceMessage: Must be near a dropoff building

