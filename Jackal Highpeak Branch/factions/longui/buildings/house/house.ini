
[core]
name: highpeakLonguiHouse
tags: building, house, canBurn
class: CustomUnitMetadata
price: Emerald=450
maxHp: 2000
mass: 9000

displayText: Garden
displayDescription: "Rigorous work brings vigor to the body and a focused mind."\n\n -Provides 10 lodging\n -Slowly generates wine over time

techLevel: 1
buildSpeed: 10s

borrowResourcesWhileBuilt:lodging=-12

radius: 50
footprint: -2,-2,1,1
constructionFootprint: -2,-2,1,1
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:25

[hiddenAction_wineTimer]
autoTrigger: if self.customTimer(laterThanSeconds=5)
alsoTriggerAction: wineLvL1
resetCustomTimer:true
[hiddenAction_wineLvL1]
addResourcesScaledByAIHandicaps: wine=2
spawnEffects:CUSTOM:produceWine
alsoTriggerAction: wineLvl2
[hiddenAction_wineLvL2]
requireConditional: if self.globalTeamTags(includes='longuiWineTech')
addResources: wine=3

[effect_produceWine]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\wine10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[effect_unloadFood]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\food10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[hiddenAction_fey]
autoTrigger:true
spawnEffects:CUSTOM:fey*2

[effect_fey]
yOffsetRelative:6
xOffsetRelativeRandom:24
yOffsetRelativeRandom:14
attachedToUnit: true
life: 200
alpha: 3
scaleFrom:0.3
scaleTo: 0.8
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
hSpeed: 0.1
dirSpeedRandom:3
dirOffsetRandom:360
image: ROOT:\data\images\fey.png
drawUnderUnits:false


[graphics]
total_frames: 1
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 1


maxAttackRange: 0
shootDelay: 2s


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.4 	

noneInBaseExtraPriority: 0.2

recommendedInEachBaseNum:5
