[core]
showInEditor:false
copyFrom:archer_2.ini
name: highpeakTheConspiracyArcher_2_disguise
displayText: Deer
displayDescription:-Can be hunted for food
class: CustomUnitMetadata
maxHp: 150
mass: 400
techLevel: 1
buildSpeed: 0s
radius: 8
isBio: true
isBug: false
hideScorchMark: true
selfRegenRate:0
softCollisionOnAll: 12
effectOnDeath:CUSTOM:death, CUSTOM:blood*3
unitsSpawnedOnDeath_setToTeamOfLastAttacker:true
showOnMinimapToEnemies:false

[effect_death]
life: 0
spawnChance:0.40
alpha:0
alsoPlaySound:ROOT:\data\soundFx\stagHowl.ogg:0.05


[effect_blood]
attachedToUnit: false
life: 60
physics: true
scaleFrom:1.1
scaleTo: 0.2
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: ROOT:\data\images\bloodRed.png
drawUnderUnits:false


[hiddenAction_Wanders]
autoTrigger: if self.customTimer(laterThanSeconds=8)
requireConditional: if not self.isMoving
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_position_randomOffsetFromSelf: 40,40
addWaypoint_maxTime: 2s
resetCustomTimer:true

[action_stealth]
autoTrigger: if self.hasTakenDamage(withinSeconds=1)
text:Reveal
description:-Reveal the unit's true nature
buildSpeed:0.5s
convertTo:highpeakTheConspiracyArcher_2

[graphics]
total_frames: 4
imageScale: 0.7
image:        body2.png
image_wreak:  ROOT:\data\images\skeleton.png
image_shadow: SHADOW:ROOT:\data\images\shadowHorse.png
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 1
animation_moving_end: 3
animation_moving_speed: 4
animation_moving_pingPong: true

animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 120
animation_idle_scale_start:1
animation_idle_scale_end:1.03
animation_idle_pingPong: true

animation_attack_start: 0
animation_attack_end: 3
animation_attack_speed: 5
animation_attack_pingPong: true

lock_body_rotation_with_main_turret: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[movement]
movementType: LAND
moveSpeed: 0.4
moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.4
maxTurnSpeed: 8.5
turnAcceleration: 1
moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  25
reverseSpeedPercentage:0

[ai]

notPassivelyTargetedByOtherUnits:true