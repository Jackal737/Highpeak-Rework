
[core]
name: highpeakTheConspiracyCenter
tags: center, canBurn, building, dropoff
class: CustomUnitMetadata
price: Emerald:750
maxHp: 3000
mass: 9000

displayText: Hive
displayDescription: "Huddle huddle! Gather to scheme!"\n\n-Generates cave dwellers\n-Can train sappers\n -Randomly spawns acid miasma in a very large area\n -Can house sappers to gain the acid rain ability\n-Resource dropoff


techLevel: 1
buildSpeed: 15s

radius: 60
footprint: -2,-2,2,1
constructionFootprint: -2,-2,2,2
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:0
fogOfWarSightRange: 5

transportUnitsCanUnloadUnits:if self.queueSize(lessThan=1)
maxTransportingUnits:10
transportUnitsRequireTag:builder
transportUnitsKillOnDeath:false

isBuilding: true
isBio: false
numBitsOnDeath: 5

exit_y:20
exit_moveAwayAmount:40

[hiddenAction_caveDwellersTimer]
autoTrigger: if self.customTimer(laterThanSeconds=9)
alsoTriggerAction: caveDwellersLvL1
resetCustomTimer:true
[hiddenAction_caveDwellersLvL1]
requireConditional:if self.resource(type='CaveDwellers',lessThan=100)
addResourcesScaledByAIHandicaps: caveDwellers=1
spawnEffects:CUSTOM:produceCaveDwellers

[effect_produceCaveDwellers]
alwayStartDirAtZero:true
attachedToUnit: false
life: 100
alpha: 1
hOffset:16
hSpeed: 0.3
image: ROOT:\data\images\caveDwellers10.png
priority: high
drawUnderUnits:false
scaleFrom:1.2
scaleTo: 1.2

[canBuild_builder]
name: setRally, highpeakTheConspiracyBuilder_1
pos: 2.2

[canBuild_hero]
name: highpeakTheConspiracyHero
isLocked: if numberOfUnitsInTeam(withTag='hero', greaterThan=0, factoryQueue=true)
isLockedMessage:Your explorer is alive
pos:2

[hiddenAction_miasma]
autoTrigger:true
spawnEffects:CUSTOM:miasma
fireTurretXAtGround: miasma
fireTurretXAtGround_withOffset:0,0

[effect_miasma]
dirOffsetRandom:360
xOffsetRelative:7
yOffsetRelative:53
attachedToUnit: false
life: 200
alpha: 0.3
scaleFrom:0.75
scaleTo: 3
xSpeedRelativeRandom: 0.07
ySpeedRelativeRandom: 0.07
hSpeed: 0.25
image: ROOT:\data\images\miasma.png
priority: low
drawUnderUnits:false
atmospheric:true
fadeInTime:40
alsoEmitEffects:CUSTOM:miasma2, CUSTOM:miasma3

[effect_miasma2]
