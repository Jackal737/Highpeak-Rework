[graphics]
total_frames: 1
imageScale: 0.9

image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: NONE

image_shadow: SHADOW:shadow.png
shadowOffsetX:0
shadowOffsetY:0

[attack]

canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 0
turretTurnSpeed: 20

maxAttackRange: 300
shootDelay: 2s

[turret_miasma]
x: 0
y: 0
projectile:miasma

[projectile_miasma]
mutatorAcid_ifUnitWithTags: bio, magical, machine, building, boneConstruct
mutatorAcid_addResourcesAreaHit: Acid=5

areaDamage:50
areaRadius:40
targetGround:true
areaHitAirAndLandAtSameTime:true
targetGroundSpread:300
life: 150
explodeOnEndOfLife:true
speed: 20
explodeEffect: CUSTOM:crack, CUSTOM:crackSpread*5, CUSTOM:miasmaTrail*3
drawSize:0

[effect_crack]
fadeInTime:25
alwayStartDirAtZero:true
priority:high
attachedToUnit: false
life: 90
scaleFrom:0.75
scaleTo: 0.75
#dirOffsetRandom:360
image: ROOT:\data\images\crack.png
drawUnderUnits:true

[effect_crackSpread]
