#-------------------------------------------------(acidRain)----------------------------------------------------
[turret_acidRain]
x: 0
y: 0
canShoot:false
limitingRange:3000

[action_acidRain]
iconImage:ROOT:\data\images\trophy.png
isLocked: if self.transportingCount(lessThan=10)
isLockedMessage: Requires 10 sappers
displayType: action
price: Gazul=75
text: Acid rain
description: -Spawn a cloud of deadly acid rain at target location\n -The cloud becomes less accurate over great distances\n -Requires 10 sappers\n -Friendly fire\n -Cannot be aborted
playSoundToPlayerOnQueue:ROOT:\data\soundFx\flamethrower.ogg:0.7
whenBuilding_playAnimation:erupting
fireTurretXAtGround: acidRain
fireTurretXAtGround_withProjectile:acidRainClose
buildSpeed: 5s
canPlayerCancel:false
pos: 1
onlyOneUnitAtATime: true
whenBuilding_cannotMove:true
addActionCooldownTime:120s
allowMultipleInQueue: false

[projectile_acidRainClose]
areaDamage:10
areaHitAirAndLandAtSameTime:true
areaRadius:180
targetGround:true
targetGroundSpread: 0
armourIgnoreAmount:0
life: 45
speed: 22
color:red
image: ROOT:\data\images\smoke.png
largeHitEffect:true
buildingDamageMultiplier: 100
drawSize:0
spawnProjectilesOnEndOfLife:acidRainMedium
spawnUnit:highpeakAcidRain
pushVelocity:-1

explodeEffect: NONE

[projectile_acidRainMedium]
@copyFromSection: projectile_acidRainClose
targetGroundSpread: 100
spawnProjectilesOnEndOfLife:acidRainFar
color:yellow
[projectile_acidRainFar]
@copyFromSection: projectile_acidRainClose
spawnProjectilesOnEndOfLife:IGNORE
targetGroundSpread: 300
life: 1000
color:green