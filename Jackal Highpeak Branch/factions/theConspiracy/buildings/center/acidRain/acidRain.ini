[core]
showInEditor: true
name: highpeakAcidRain
displayText: Acid rain
displayDescription: -Bad for the grass >:D
class: CustomUnitMetadata
price: 0
maxHp: 4000
armour: 999999
armourMinDamageToKeep: 0
mass: 10000
techLevel: 1
radius: 1
isBio: false
transportSlotsNeeded: 1000
isUnrepairableUnit: true
hideScorchMark: true
fogOfWarSightRange: 0
energyMax: 20
energyRegen: 0
dieOnZeroEnergy: true
explodeOnDeath:false
softCollisionOnAll: 100
disableAllUnitCollisions:true
canNotBeDirectlyAttacked:true
isUnselectable:true

[action_lifeTime]
autoTrigger: true
isVisible: false
addEnergy: -1

[hiddenAction_triggerDamage]
autoTrigger: true
fireTurretXAtGround: damageEmitter
fireTurretXAtGround_withOffset: 0,0

[hiddenAction_triggerParticles]
autoTriggerOnEvent: created
isVisible: false
fireTurretXAtGround: effects
fireTurretXAtGround_withOffset: 0,10

[graphics]
total_frames: 1
showEnergyBar:false
image:        spawner.png
image_wreak:  NONE
image_shadow: NONE

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 150
turretTurnSpeed: 10
shootDelay: 3
aimOffsetSpread: 0

[turret_damageEmitter]
x: 0
y: 0
projectile: acid
canShoot: true

[turret_effects]
x: 0
y: 0
projectile: ambientFog
canShoot: true

[projectile_acid]
life: 0
speed: 0
frame: 0
drawSize: 0
targetGround: true
areaDamage: 10
areaRadius: 150
friendlyFire: true
buildingDamageMultiplier: 1
explodeOnEndOfLife: true
explodeEffect: NONE
areaHitAirAndLandAtSameTime: true

mutatorAcid_ifUnitWithTags: bio, magical, machine, building, boneConstruct
mutatorAcid_addResourcesAreaHit: Acid=2

[projectile_ambientFog]
life: 600
speed: 0.0001
targetSpeed: 0.0001
targetGround: true
directDamage: 0
frame: 0
drawSize: 0
trailEffect: CUSTOM:fog*3, CUSTOM:splatters*6
trailEffectRate: 15

[effect_none]
priority:verylow
stripIndex: effects
frameIndex: 0
life: 0
alpha: 0

[effect_fog]
priority:veryhigh
createWhenOffscreen: true
image: ROOT:\data\images\miasma.png
life: 160
fadeInTime:50
fadeOut: true
attachedToUnit: false
scaleFrom: 2.5
scaleTo: 5
alpha: 0.6
drawUnderUnits:false
hSpeed: -0.3
hOffset: 270
hOffsetRandom: 0.15
dirOffsetRandom:180
shadow:true
imageShadow: SHADOW:ROOT:\data\images\miasma.png
xOffsetRelativeRandom: 75
yOffsetRelativeRandom: 75
xSpeedAbsoluteRandom:0.5
ySpeedAbsoluteRandom:0.5

[effect_splatters]
alwayStartDirAtZero:true
priority:high
physics:true
physicsGravity:1.4
createWhenOffscreen: false
createWhenZoomedOut: false
image: ROOT:\data\images\magicFire.png
color:YELLOW
life: 130
fadeOut: true
attachedToUnit: false
fadeInTime: 60
scaleFrom: 0.9
scaleTo: 0
alpha: 1
drawUnderUnits:false
xSpeedAbsolute: -0.1
hSpeed: -2
hOffset: 270
atmospheric:true
dirOffset:90
xOffsetRelative: 0
xOffsetRelativeRandom: 75
yOffsetRelative: 20
yOffsetRelativeRandom: 60
xSpeedAbsoluteRandom:0.6
ySpeedAbsoluteRandom:0.6

[movement]
movementType: NONE
moveSpeed: 0
targetHeight:-1
maxTurnSpeed: 0
moveSlidingMode :true
moveIgnoringBody: true