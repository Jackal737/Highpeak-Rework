
[core]
name: highpeakTheConspiracyForge
class: CustomUnitMetadata
tags: canBurn, building, dropoff, highpeakForge, canSellTrophy
price: Emerald=150
maxHp: 750
mass: 9000

displayText: Black pit
displayDescription: "Hole... Full of things?"\n\n -Can barther resources\n -Resource dropoff\n -Can house a ziradon to gain vision and a ranged attack

energyMax: 2
energyRegen: 0.009
energyNeedsToRechargeToFull: true

techLevel: 1
buildSpeed: 8s

radius: 22
footprint: -1,-1,0,0
constructionFootprint: -1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0
fogOfWarSightRange: 5
disableAllUnitCollisions:true

explodeOnDeath:false
isBuilding: true
isBio: false
numBitsOnDeath: 0

maxTransportingUnits:1
transportUnitsRequireTag:wyrm
transportUnitsCanUnloadUnits:if not self.isOverLiquid()
transportUnitsUnloadDelayBetweenEachUnit:6
transportUnitsEachUnitAlwaysUsesSingleSlot:true
transportUnitsKillOnDeath:false

[action_produceGazul]
ai_isDisabled:true
price: Emerald=1000
addResources: Gazul=550
text: Barther for Gazul
description: -Recieve 550 Gazul for 1000 Emerald
buildSpeed: 10s
pos: 0.1

[action_produceEmerald]
ai_isDisabled:true
price: Gazul=1000
addResources: Emerald=550
text: Barther for emeralds
description: -Recieve 550 Emerald for 1000 Gazul
buildSpeed: 10s
pos: 0.2

[hiddenAction_visionOn]
autoTrigger: if self.transportingCount(greaterThan=0) and not self.tags(includes='visionOn')
setUnitStats: fogOfWarSightRange+=10
temporarilyAddTags: visionOn


[hiddenAction_visionOff]
autoTrigger: if self.transportingCount(lessThan=1) and self.tags(includes='visionOn')
setUnitStats: fogOfWarSightRange-=10
temporarilyRemoveTags: visionOn

[graphics]
total_frames: 1
imageScale: 0.9
teamColorsOnTurret:true
image:        base.png
image_back:  back.png
image_wreak:  NONE
image_turret: turret.png

image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0.5


[attack]

canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
isFixedFiring: false
turretSize: 27
turretTurnSpeed: 3

maxAttackRange: 175
shootDelay: 4
aimOffsetSpread:0

[turret_1]
canAttackCondition: if self.transportingCount(greaterThan=0)
invisible: if self.transportingCount(lessThan=1)
x: 0
y: 0
height: 5
shoot_flame:smoke, CUSTOM:trail2*3
energyUsage: 0.2
recoilOffset:-1
shoot_sound:ROOT:\data\soundFx\flameThrower.ogg
shoot_sound_vol:0.1

turnSpeed:2
turnSpeedAcceleration:0.03
turnSpeedDeceleration:0.05

idleSweepDelay:320
idleSweepAngle:180
idleSweepSpeed:1
idleSweepAddRandomDelay:160
idleSweepAddRandomAngle:180

[projectile_1]

areaDamage: 20
areaRadius: 40
armourIgnoreAmount:20
buildingDamageMultiplier:0.5
life: 140
speed:3
speedSpread: 2
trailEffect:CUSTOM:trail
lightColor:#ffffff
explodeEffect:smoke
image:ROOT:\data\images\miasma.png
drawSize:0.7
targetGround:true
targetGroundSpread: 16
targetGround_includeTargetHeight:true

mutatorPoison_ifUnitWithTags: bio, magical
mutatorPoison_addResourcesAreaHit: Acid=2

mutatorFire_ifUnitWithTags: machine, building
mutatorFire_addResourcesAreaHit: Acid=2

[effect_trail]
dirOffsetRandom:360
createWhenZoomedOut: false
image: ROOT:\data\images\miasma.png
xOffsetRelative:0
yOffsetRelative:0
attachedToUnit: false
life: 55
alpha: 0.5
scaleFrom:0.6
scaleTo: 1.8
#physics: true
xSpeedRelativeRandom: 0.3
ySpeedRelativeRandom: 0.3
hSpeed: 0.1
priority: high
drawUnderUnits:false
atmospheric:true

[effect_trail2]
createWhenZoomedOut: false
image: ROOT:\data\images\magicFire.png
life: 25
color:YELLOW
xSpeedRelativeRandom:1.5
ySpeedRelativeRandom:0.5
ySpeedRelative:4

fadeOut: true
attachedToUnit: false
fadeInTime:2
scaleFrom: 0.75
scaleTo: 0
alpha: 0.5
drawUnderUnits:false

[effect_smoke]
dirOffsetRandom:360
xOffsetRelative:0
yOffsetRelative:0
attachedToUnit: false
life: 75
alpha: 0.5
scaleFrom:0.3
scaleTo: 1.6
xSpeedRelativeRandom: 0.1
ySpeedRelativeRandom: 0.1
ySpeedRelative: 0.25
hSpeed: 0.1
image: ROOT:\data\images\miasma.png
priority: low
drawUnderUnits:false
atmospheric:true


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[ai]

buildPriority: 0.6

noneGlobalExtraPriority: 0.2

maxEachBase: 1

